<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
<!-- значок вкладки: каркасная шапка-голограмма в луче с размытыми краями — без книги, без размытия контура и строк развертки, контур толще, чтобы читалась на 16px. Иконки установленного приложения — отдельные PNG с панелью A5: неоновая рамка и белая шапка (favicon-192/512, apple-touch-icon), в манифесте только они -->
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1C1650"/><stop offset="1" stop-color="#0B1030"/></linearGradient>
<radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#7B6CFF" stop-opacity=".55"/><stop offset="1" stop-color="#7B6CFF" stop-opacity="0"/></radialGradient>
<linearGradient id="holo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ADA2FF" stop-opacity=".45"/><stop offset="1" stop-color="#ADA2FF" stop-opacity=".12"/></linearGradient>
<linearGradient id="beam" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ADA2FF" stop-opacity=".55"/><stop offset="1" stop-color="#ADA2FF" stop-opacity="0"/></linearGradient>
<pattern id="scan" width="4" height="3.2" patternUnits="userSpaceOnUse"><rect width="4" height="1.2" fill="#E6E2FF" opacity=".35"/></pattern>
<filter id="neon" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.6"/></filter></defs><rect width="64" height="64" rx="14" fill="url(#bg)"/><path d="M17 66 5 29h54L47 66z" fill="url(#beam)" filter="url(#soft)"/><g transform="translate(32 30) scale(1.2) translate(-32 -31.5)"><path d="M32 13.5 55 23.5 32 33.5 9 23.5zM18 34V42.5l14 7 14-7V34L32 40.5z" fill="#ADA2FF55" stroke="#E6E2FF" stroke-width="3.83" stroke-linejoin="round"/><path d="M32 23.5 50 27v10" fill="none" stroke="#F0C048" stroke-width="3.83" stroke-linecap="round" stroke-linejoin="round"/><circle cx="50" cy="40" r="3.83" fill="#F0C048"/></g></svg>