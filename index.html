  .brand__sub { display: none; }
  .icon-btn { width: 38px; height: 38px; }
  .side__menu { display: flex; flex: none; }
  /* on mobile the theme is an icon in the top bar, so the drawer has no action row */
  .side__theme { display: grid; flex: none; width: 40px; height: 40px; border: 1.5px solid color-mix(in srgb, var(--accent) 55%, transparent); border-radius: 10px; color: var(--accent); }
  .side__theme:hover { background: var(--accent-soft); }
  .side__actions { display: none; }

  /* drawer: progress, bookmarks and the contents (levels, search, chapters) */
  .drawer { display: block; position: fixed; z-index: 30; top: 0; bottom: 0; left: 0; width: min(360px, 88vw); overflow-y: auto; overscroll-behavior: contain;
    padding: calc(env(safe-area-inset-top, 0px) + 12px) 14px calc(env(safe-area-inset-bottom, 0px) + 24px); background: var(--paper); border-right: 1px solid var(--border);
    box-shadow: 8px 0 24px rgba(0, 0, 0, .18); transform: translateX(-105%); visibility: hidden; transition: transform .2s ease, visibility .2s linear; }
  .drawer--open { transform: none; visibility: visible; }
  .drawer__head { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-family: var(--f-display); font-weight: 700; font-size: 17px; }
  .side__summary { margin-top: 12px; }
  .drawer-backdrop { display: block; position: fixed; z-index: 25; inset: 0; background: rgba(8, 10, 20, .45); opacity: 0; visibility: hidden; transition: opacity .2s linear, visibility .2s linear; }
  .drawer-backdrop--open { opacity: 1; visibility: visible; }
  .search__input { font-size: 16px; } /* 16px+ keeps iOS from zooming in on focus */

  .ex { scroll-margin-top: 76px; } /* clears the sticky top bar */
  .sheet { padding-inline: 16px; padding-block: 24px 14px; border-inline: 0; border-radius: 0; min-height: 0; }
}
@media (max-width: 560px) {
  .sheet__title { font-size: 26px; }
  .sheet__lead { font-size: 17px; }
  .examples__item { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .note { grid-template-columns: minmax(0, 1fr); gap: 6px; }
  .note::before { align-self: start; }
  .ex { padding: 16px 14px; }

  /* exercise footer: score on its own line above, the three buttons share one row */

  .ex__score { order: -1; width: 100%; margin-left: 0; text-align: right; }

  /* rule tables become stacked cards: one row per card, column names as labels */
  .rule-table { overflow: visible; border: 0; background: none; }
  .rule-table__table, .rule-table__body, .rule-table__row, .rule-table__cell { display: block; }

  .rule-table__cell[data-label]::before { content: attr(data-label); display: block; margin-bottom: 1px; font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }

<script>
/* Helpers used by the data files to write rules. */
window.BOOK = [];
const T = (head, rows) => {
  const labels = head.map(h => h.replace(/<[^>]+>/g, '').replace(/"/g, '&quot;'));
  return `<div class="rule-table"><table class="rule-table__table"><thead class="rule-table__head"><tr>${head.map(h => `<th class="rule-table__th">${h}</th>`).join('')}</tr></thead>` +
    `<tbody class="rule-table__body">${rows.map(r => `<tr class="rule-table__row">${r.map((c, i) => `<td class="rule-table__cell" data-label="${labels[i] || ''}">${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
};
const E = list => `<ul class="examples">${list.map(([en, ru]) => `<li class="examples__item"><span class="examples__en">${en}</span><span class="examples__ru">${ru}</span></li>`).join('')}</ul>`;
const N = t => `<div class="note"><div>${t}</div></div>`;
const M = (label, words) => `<div class="markers"><span class="markers__label">${label}</span>${words.map(w => `<span class="markers__word">${w}</span>`).join('')}</div>`;
const F = t => `<div class="formula">${t}</div>`;

/* the theme buttons (desktop row, floating tools, mobile top bar) are empty in the HTML and filled here from one template:
   stars and rays for the hover, the moon and the sun; the label only on the wide buttons (the mobile one is icon-only).
   The label text is set by syncThemeBtn right after. It runs here, straight after the markup and before the data files
   load, so the buttons are never seen empty or with the wrong theme name */
function themeToggleHtml(iconOnly) {
  const icon = iconOnly ? 'icon-btn__icon' : 'action-btn__icon';
  return `<span class="theme-toggle__stars" aria-hidden="true">${'<i></i>'.repeat(8)}</span><span class="theme-toggle__rays" aria-hidden="true"></span>`
    + `<svg class="${icon} theme-toggle__moon" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path class="theme-toggle__moon-body" d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7Z"/></svg>`
    + `<svg class="${icon} theme-toggle__sun" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2" fill="currentColor" stroke="none"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.55 1.55M17.15 17.15l1.55 1.55M5.3 18.7l1.55-1.55M17.15 6.85l1.55-1.55"/></svg>`
    + (iconOnly ? '' : '<span class="theme-toggle__label"></span>');
}
document.querySelectorAll('.theme-toggle').forEach(b => { b.innerHTML = themeToggleHtml(b.classList.contains('icon-btn')); });
syncThemeBtn();
function syncThemeBtn() {
  const dark = document.documentElement.dataset.theme !== 'light';
  /* the label names the theme the button switches to; the icon-only button in the mobile top bar gets it as aria-label */
  const action = dark ? 'Включить светлую тему' : 'Включить темную тему';
  document.querySelectorAll('.theme-toggle').forEach(b => {
    b.title = action;
    const label = b.querySelector('.theme-toggle__label');
    if (label) label.textContent = dark ? 'Светлая тема' : 'Темная тема';
    else b.setAttribute('aria-label', action);
  });
}
</script>

<script>
/* ================= App ================= */
const LEVELS = { A1: 'Начальный', A2: 'Элементарный', B1: 'Средний', B2: 'Выше среднего', C1: 'Продвинутый', C2: 'Свободное владение' };
const CHAPTERS = window.BOOK.slice().sort((a, b) => a.n - b.n);
const TOPICS = [];
CHAPTERS.forEach(ch => ch.topics.forEach((t, i) => { t.ch = ch; t.num = `${ch.n}.${i + 1}`; TOPICS.push(t); }));
const topicById = Object.fromEntries(TOPICS.map(t => [t.id, t]));
const chapById = Object.fromEntries(CHAPTERS.map(c => ['ch-' + c.id, c]));

const $ = (s, r = document) => r.querySelector(s);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = s => { const sp = el('span'); sp.innerHTML = esc(s).replace(/\(([^)]+)\)/g, '<span class="ex__hint">($1)</span>'); return sp; };
const pagesLabel = ch => ch.pages ? `Голицынский, с. ${ch.pages[0]}–${ch.pages[1]}` : 'Нет в сборнике';

function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function shuffled(arr, seed) { return arr.map((v, i) => ({ v, k: hash(seed + '|' + i + '|' + v) })).sort((a, b) => a.k - b.k).map(o => o.v); }

/* Compare answers ignoring case, punctuation, curly quotes and contractions. */
function norm(s) {
  s = s.toLowerCase().replace(/[’‘`´]/g, "'").replace(/[—–]/g, '-').replace(/[.!?,;:"“”«»]/g, ' ').replace(/\s+-\s+/g, ' ').replace(/\s+/g, ' ').trim();
  s = s.replace(/\bwon't\b/g, 'will not').replace(/\bcan't\b/g, 'cannot').replace(/\bshan't\b/g, 'shall not')
       .replace(/n't\b/g, ' not').replace(/'m\b/g, ' am').replace(/'re\b/g, ' are').replace(/'ll\b/g, ' will').replace(/'ve\b/g, ' have')
       .replace(/\bcan not\b/g, 'cannot');
  return s.replace(/\s+/g, ' ').trim();
}
/* 's and 'd have two meanings each (he's = he is / he has, I'd = I would / I had), so they cannot be folded into one form
   like n't or 'll: both sides are expanded into every reading and match if any reading is shared.
   Only after pronouns and question words — Tom's / my brother's stay possessive. */
const AMBIGUOUS = /\b(i|you|he|she|it|we|they|that|there|here|what|who|where|when|how|let)'(s|d)\b/;
const READINGS = { s: ['is', 'has'], d: ['would', 'had'] };
function readings(s) {
  const m = s.match(AMBIGUOUS);
  if (!m) return [s];
  const [whole, word, c] = m, at = m.index;
  const subs = word === 'let' ? (c === 's' ? ['let us'] : [whole]) : READINGS[c].map(r => `${word} ${r}`);
  return subs.flatMap(sub => readings(s.slice(0, at) + sub + s.slice(at + whole.length)));
}
const accepts = (answers, value) => {
  const mine = readings(norm(value));
  return answers.split('|').some(a => readings(norm(a)).some(r => mine.includes(r)));
};
const firstAnswer = answers => { const a = answers.split('|')[0]; return a === '-' ? '—' : a; };

/* Scoring units: one per gap, one per choice/translation item. */
const gapAnswers = it => Array.isArray(it[1]) ? it[1] : [it[1]];
function units(ex) {
  if (ex.type === 'text') return ex.answers.length;
  if (ex.type === 'gap') return ex.items.reduce((n, it) => n + gapAnswers(it).length, 0);
  return ex.items.length;
}

let progress = store.get('gk2-progress', {});
let studied = store.get('gk2-studied', {});
let bookmarks = store.get('gk2-bookmarks', {}); /* topic id → time it was bookmarked */
let answers = store.get('gk2-answers', {});
let levelFilter = store.get('gk2-level', '');
let route = null;
let viaBookmarks = false; /* the open topic was reached from the «Избранное» list */

function topicStats(t) {
  const p = progress[t.id] || {};
  let s = 0, tot = 0, tried = false;
  /* min(): a score saved before an exercise lost a gap must not push the topic past 100% */
  t.ex.forEach((ex, i) => { tot += units(ex); if (p[i]) { s += Math.min(p[i][0], units(ex)); tried = true; } });
  return { s, tot, tried, pct: tot ? Math.round(100 * s / tot) : 0 };
}
function chapterStats(ch, level) {
  let s = 0, tot = 0, tried = false;
  ch.topics.filter(t => !level || t.level === level).forEach(t => { const r = topicStats(t); s += r.s; tot += r.tot; tried = tried || r.tried; });
  return { s, tot, tried, pct: tot ? Math.round(100 * s / tot) : 0 };
}

/* Book progress: every rule is one point (when marked as studied), every exercise up to one point by the share of right answers
   in its latest check. 100% only with every rule studied and every exercise solved without mistakes. */
function bookProgress() {
  let got = 0, rules = 0, exs = 0;
  TOPICS.forEach(t => {
    rules++; if (studied[t.id]) got++;
    t.ex.forEach((ex, i) => { exs++; const r = progress[t.id] && progress[t.id][i]; if (r) got += r[0] / r[1]; });
  });
  const total = rules + exs;
  return { share: 100 * got / total, pct: Math.floor(100 * got / total), full: got === total, rules, exs, total };
}

/* the progress block, shown in the «Прогресс» drop-down */
function overallBox() {
  let total = 0, perfect = 0;
  TOPICS.forEach(t => t.ex.forEach((ex, i) => {
    total++;
    const r = progress[t.id] && progress[t.id][i];
    if (r && r[0] === r[1]) perfect++;
  }));
  /* «Выполнено» = «Без ошибок» + «С ошибками»: every checked exercise is one or the other */
  const wrong = mistakeCount();
  const book = bookProgress();
  const box = el('div', 'overall');
  box.innerHTML = `<div class="overall__row"><span>Правил изучено</span><b class="overall__value">${TOPICS.filter(t => studied[t.id]).length} из ${TOPICS.length}</b></div>
    <div class="overall__row"><span>Выполнено упражнений</span><b class="overall__value">${perfect + wrong} из ${total}</b></div>
    <div class="overall__row"><span>Без ошибок</span><b class="overall__value">${perfect}</b></div>
    <button class="overall__row overall__mistakes" type="button" data-go="mistakes"${route === 'mistakes' ? ' aria-current="page"' : ''}>
      <span>С ошибками</span><span class="overall__mistakes-end"><b class="overall__value">${wrong}</b>${arrowHtml('next')}</span></button>
    <div class="overall__book">
      <div class="overall__row"><span>Прохождение тренажера</span></div>
      <div class="bar bar--labeled" style="--p:${book.share}%"><i class="bar__fill${book.full ? ' bar__fill--full' : ''}" style="width:${book.share}%"></i><span class="bar__label">${book.pct}%</span><span class="bar__label bar__label--on-fill" aria-hidden="true">${book.pct}%</span></div>
      <p class="overall__note">${foldNote('book')}</p>
    </div>
    <div class="overall__file">
      <div class="overall__row"><span>Резервная копия</span></div>
      <div class="overall__file-btns">
        <button class="overall__file-btn" type="button" data-file="export" title="Сохранить прогресс в файл"${saveLocked() ? ' disabled' : ''}>Сохранить</button>
        <button class="overall__file-btn" type="button" data-file="import" title="Загрузить прогресс из файла">Загрузить</button>
        <button class="overall__file-btn overall__file-btn--wide" type="button" data-file="link" title="Получить ссылку с прогрессом, чтобы отправить ее куда удобно">Отправить ссылкой</button>
      </div>
      <p class="overall__note${fileMsg ? ' overall__note--' + fileMsg[0] : ''}" role="status">${fileMsg ? esc(fileMsg[1]) : foldNote('backup')}</p>
    </div>`;
  return box;
}

/* folded notes in the «Прогресс» block. Folded, the text breaks off after a few words that fade out, with «Показать еще»
   right after them (as in VK posts); open, the whole text with «Скрыть». Open or not is kept only while the page is open
   (re-renders keep it, a reload starts folded). Each note: [shown text, fading words, the rest] */
const FOLD_NOTES = {
  book: ['', 'Учитываются изученные', ' правила и верные ответы в упражнениях. 100% — все изучено и решено без ошибок.'],
  backup: ['Прогресс хранится только в этом браузере. ', 'Сохраните его в файл',
    ' по кнопке «Сохранить» или отправьте ссылкой — «Отправить ссылкой», чтобы перенести прогресс в другой браузер/устройство.'],
};
const notesOpen = {};
function foldNote(key) {
  const [head, fade, tail] = FOLD_NOTES[key], open = !!notesOpen[key];
  const btn = `<button class="overall__more-btn" type="button" data-fold-note="${key}" aria-expanded="${open}">${open ? 'Скрыть' : 'Показать еще'}</button>`;
  /* folded: the fading words and the button wrap together, so the button always stands right after them */
  return head + (open ? `${fade}${tail} ${btn}` : `<span class="overall__fade-row"><span class="overall__fade">${fade}</span> ${btn}</span>`);
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-fold-note]');
  if (!b) return;
  const key = b.dataset.foldNote, note = b.closest('.overall__note');
  notesOpen[key] = !notesOpen[key];
  note.innerHTML = foldNote(key);
  $('[data-fold-note]', note).focus();
});

/* the «Прогресс» button: the book progress bar and percentage, the number of exercises with mistakes */
function renderOverall() {
  const book = bookProgress(), wrong = mistakeCount();
  const b = $('#progBtn');
  b.innerHTML = `<span>Прогресс</span><span class="bar bar--thin side__stat-bar" aria-hidden="true">${barFill(book.full ? 100 : Math.min(book.share, 99))}</span>` +
    `<b class="side__stat-pct">${book.pct}%</b>` + (wrong ? `<span class="side__badge" title="С ошибками: ${wrong}">${wrong}</span>` : '') + FOLD_ARROW;
  b.setAttribute('aria-label', `Прогресс: тренажер пройден на ${book.pct}%` + (wrong ? `, с ошибками ${wrong}` : ''));
  renderFold('prog');
}

/* order of «Работа над ошибками»: by level A1 → C2, within a level by topic number, then by exercise */
const mistakeOrder = (t, i = 0) => Object.keys(LEVELS).indexOf(t.level) * 1e6 + TOPICS.indexOf(t) * 1000 + i;

/* exercises whose latest check is below the full score (errors or blank answers), in mistakeOrder;
   «Заново» drops the check, so the exercise leaves the list until it is checked again */
function mistakes() {
  const out = [];
  TOPICS.forEach(t => {
    const exs = t.ex.map((ex, i) => [i, progress[t.id] && progress[t.id][i]]).filter(([, r]) => r && r[0] < r[1]);
    if (exs.length) out.push({ t, exs });
  });
  return out.sort((a, b) => mistakeOrder(a.t) - mistakeOrder(b.t));
}
const mistakeCount = () => mistakes().reduce((n, m) => n + m.exs.length, 0);

/* the level filter of «Работа над ошибками»: its own, not the sidebar one (that one follows every opened topic);
   a saved level with no mistakes left falls back to «Все» */
let mistakesLevel = store.get('gk2-mistakes-level', '');
function mistakesFilter() {
  return mistakesLevel && mistakes().some(m => m.t.level === mistakesLevel) ? mistakesLevel : '';
}

/* the exercise after (topic, ei) in «С ошибками» within the page's level filter, wrapping round to the start; null when it is the only one */
function nextMistake(topic, ei) {
  const cur = mistakeOrder(topic, ei);
  const level = mistakesFilter();
  const all = mistakes().filter(m => !level || m.t.level === level).flatMap(({ t, exs }) => exs.map(([i]) => ({ t, i, at: mistakeOrder(t, i) }))).filter(m => m.at !== cur);
  return all.find(m => m.at > cur) || all[0] || null;
}

/* the exercise opened from «Работа над ошибками» gets a bar back to the list and on to the next one */
let mistakeFocus = null, pendingFocus = null;

/* open a topic and bring one of its exercises into view */
function openExercise(topicId, ei) {
  pendingFocus = { t: topicId, ei };
  go(topicId);
  const box = document.querySelectorAll('#main .ex')[ei];
  if (!box) return;
  /* a jump, not a smooth scroll: a new page opens anyway, and the flash shows where to look */
  box.scrollIntoView({ block: 'start' });
  box.classList.remove('ex--flash'); void box.offsetWidth; box.classList.add('ex--flash');
}

/* ---------- Sidebar ---------- */
/* progress for the selected level filter: points scored / all points; hidden for «Все» (the .overall block covers it) */
function renderLevelProgress() {
  const box = $('#lvlProg');
  box.hidden = !levelFilter;
  if (!levelFilter) return;
  const topics = TOPICS.filter(t => t.level === levelFilter);
  let s = 0, tot = 0;
  topics.forEach(t => { const r = topicStats(t); s += r.s; tot += r.tot; });
  const pct = tot ? Math.round(100 * s / tot) : 0;
  box.innerHTML = `<div class="lvl-prog__row"><span>Уровень <span class="lvl-tag lvl-tag--sm" title="${LEVELS[levelFilter]}">${levelFilter}</span> пройден на</span>${pctLabel(pct, 'lvl-prog__value')}</div>
    <div class="bar bar--thin">${barFill(pct)}</div>`;
}

function renderLevels() {
  const box = $('#levelChips'); box.innerHTML = '';
  [['', 'Все'], ...Object.keys(LEVELS).map(l => [l, l])].forEach(([v, label]) => {
    const b = el('button', 'level-chip', label); b.type = 'button';
    b.setAttribute('aria-pressed', String(levelFilter === v));
    b.dataset.level = v;
    b.addEventListener('click', () => { levelFilter = v; store.set('gk2-level', v); renderLevels(); renderToc(); });
    box.append(b);
  });
  fillLevelChips();
}

/* each chip fills with green from the bottom up to the share of its level's points scored (for «Все» — the whole book);
   at 100% (every exercise of every topic scored in full) it also gets --done */
function fillLevelChips() {
  document.querySelectorAll('#levelChips .level-chip').forEach(b => {
    const level = b.dataset.level;
    let s = 0, tot = 0;
    TOPICS.filter(t => !level || t.level === level).forEach(t => { const r = topicStats(t); s += r.s; tot += r.tot; });
    const pct = tot ? 100 * s / tot : 0;
    if (level) b.style.setProperty('--lvl', pct + '%'); /* «Все» shows no liquid */
    b.classList.toggle('level-chip--done', tot > 0 && s === tot);
    b.title = `${level ? LEVELS[level] : 'Весь тренажер'} · пройдено ${Math.round(pct)}%`;
  });
}

/* Accordion: one chapter open at a time (saved in gk2-open-chap); a search opens every match. */
let openChap = store.get('gk2-open-chap', null);
let justToggled = null;
function setOpenChap(id) { openChap = id; store.set('gk2-open-chap', id); }

/* sparks around the «В избранном» ribbon: offset from its centre (px), delay (s), a dot instead of a plus */
/* the text starts 6px to the right, so the right-hand sparks sit only above and below it */
const BM_SPARKS = [[-13, -9, .15, 0], [8, -13, .25, 1], [-12, 8, .35, 1], [1, -15, .45, 1], [-16, -1, .55, 0], [7, 14, .65, 0], [-5, 15, .7, 1]];
/* the symbols on the «Правило изучено» reel; it stops on the last one */
const SLOT_REEL = ['★', '✗', '?', '♦', '✓', '•', '✗', '★', '?', '✓'];
/* an arrow that nudges the way it points while its button is hovered (see .arrow) */
const arrowHtml = (dir, cls = '') => `<span class="arrow arrow--${dir}${cls ? ' ' + cls : ''}" aria-hidden="true">${dir === 'prev' ? '←' : '→'}</span>`;
/* a progress pill: at 100% a green outline, below that a fill coloured by range; cls mixes in an element class of the parent */
const pill = (pct, cls = '') => `<span class="pill pill--${pct >= 100 ? 'good' : pct > 60 ? 'high' : pct > 30 ? 'mid' : 'low'}${cls ? ' ' + cls : ''}" style="--p:${pct}%">${pct}%</span>`;
/* the fill of a progress bar; at 100% it turns green */
const barFill = pct => `<i class="bar__fill${pct >= 100 ? ' bar__fill--full' : ''}" style="width:${pct}%"></i>`;
/* the percentage next to a bar; at 100% it turns green */
const pctLabel = (pct, cls = '', tag = 'b') => `<${tag} class="pct${pct >= 100 ? ' pct--full' : ''}${cls ? ' ' + cls : ''}">${pct}%</${tag}>`;

function setChapOpen(box, open) {
  box.classList.toggle('chap--open', open);
  box.querySelector('.chap__btn').setAttribute('aria-expanded', String(open));
  box.querySelector('.chap__body').inert = !open;
}

function renderToc() {
  const q = $('#search').value.trim().toLowerCase();
  const filtering = !!(q || levelFilter);
  if (route === 'contents') $('#tocContents').setAttribute('aria-current', 'page'); else $('#tocContents').removeAttribute('aria-current');
  renderLevelProgress();
  fillLevelChips();
  const list = $('#tocList'); list.innerHTML = '';
  let shown = 0;
  CHAPTERS.forEach(ch => {
    const match = ch.topics.filter(t => (!levelFilter || t.level === levelFilter) &&
      (!q || (t.title + ' ' + t.sub + ' ' + ch.title).toLowerCase().includes(q)));
    if (filtering && !match.length) return;
    const open = q ? true : ch.id === openChap;
    /* a chapter opened by navigation renders closed first, then expands on the next frame */
    const animateIn = open && justToggled === ch.id;
    /* the chapter of the open page (the chapter itself or one of its topics); a topic opened from «Избранное» marks only that list */
    const current = !viaBookmarks && (route === 'ch-' + ch.id || (topicById[route] && topicById[route].ch === ch));
    const box = el('div', current ? 'chap chap--current' : 'chap');
    const cb = el('button', 'chap__btn'); cb.type = 'button';
    if (current) cb.setAttribute('aria-current', 'location');
    /* the pill counts only the selected level and appears once a topic of that level has been started
       (started only at another level, it showed a confusing 0%) */
    const cs = chapterStats(ch, levelFilter);
    const lv = [...new Set(ch.topics.map(t => t.level))].sort();
    cb.innerHTML = `<span class="chap__num">${ch.n}</span><span>${esc(ch.title)}<small class="chap__meta">${esc(ch.pages ? 'с. ' + ch.pages[0] + '–' + ch.pages[1] : 'сверх сборника')} · ${ch.topics.length} ${plural(ch.topics.length, 'тема', 'темы', 'тем')}</small>` +
      `<span class="chap__levels" aria-label="Уровни">${lv.map(l => `<span class="lvl-tag lvl-tag--sm" title="${LEVELS[l]}">${l}</span>`).join('')}</span></span>` +
      `<span class="chap__end">${cs.tried ? pill(cs.pct) : ''}` +
      '<span class="chap__arrow" aria-hidden="true"><svg class="chap__arrow-icon" viewBox="0 0 12 12" width="12" height="12"><path d="M4 2.5 7.5 6 4 9.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span></span>';
    /* the chapter title only expands and collapses it; the chapter page opens from «Обзор всего раздела» inside */
    cb.addEventListener('click', () => {
      if (box.classList.contains('chap--open')) { setChapOpen(box, false); if (!q) setOpenChap(null); }
      else if (q) setChapOpen(box, true);
      else { justToggled = ch.id; setOpenChap(ch.id); renderToc(); }
    });
    box.append(cb);
    if (levelFilter && !q && match.length < ch.topics.length) {
      const note = el('small', 'chap__meta', `${match.length} из ${ch.topics.length} ${plural(ch.topics.length, 'темы', 'тем', 'тем')} уровня ${levelFilter}`);
      cb.querySelector('.chap__meta').after(note);
    }
    /* body is always rendered so it can animate open and closed */
    const body = el('div', 'chap__body');
    const clip = el('div', 'chap__clip');
    const sub = el('div', 'chap__topics');

/* ---------- Backup: everything the app keeps in localStorage (gk2-*) as one JSON file ---------- */

const BACKUP_APP = 'grammar-online';

let fileMsg = null, fileMsgTimer;
function showFileMsg(kind, text) {
  fileMsg = [kind, text];

function backupKeys() {

  return keys.sort();
}
function backupObject(now) {

}
const isBackup = b => !!b && b.app === BACKUP_APP && !!b.data && typeof b.data === 'object' && !Array.isArray(b.data)

  const d = n => String(n).padStart(2, '0');
  a.download = `grammar-progress-${now.getFullYear()}-${d(now.getMonth() + 1)}-${d(now.getDate())}-${d(now.getHours())}${d(now.getMinutes())}.json`;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  showFileMsg('ok', `Прогресс по грамматике успешно сохранен в файл «${a.download}». Файл сохранен в папку загрузок.`);
}
/* «Сохранить» pressed more than 3 times within 2 seconds: every press downloads one more file, so the button is locked
   with a warning and a countdown to 0 — 7 seconds the first two times, 30 seconds after that. The count of warnings
   is forgotten after a calm minute. The lock lives in localStorage, so reloading the page does not lift it
   (key without the gk2- prefix: it stays out of backups). */
const SAVE_LOCKS = [7, 7, 30], SAVE_KEY = 'gk-save-lock';
let saveClicks = [], saveTick, saveShown;
let { until: saveUntil = 0, total: saveTotal = 0, strikes: saveStrikes = 0 } = store.get(SAVE_KEY, {}) || {};
/* a no-break space keeps the number with its word */
const seconds = n => `${n} ${plural(n, 'секунду', 'секунды', 'секунд')}`;
const saveLocked = () => Date.now() < saveUntil;
function saveWarning(n) {
  return (saveTotal > SAVE_LOCKS[0]
      ? `Вы снова нажимаете «Сохранить» слишком часто, поэтому кнопка выключена на ${seconds(saveTotal)}.`
      : 'Пожалуйста, не нажимайте «Сохранить» так часто: каждое нажатие скачивает еще один файл.'
        + (saveStrikes === SAVE_LOCKS.length - 1 ? ` Если это повторится, кнопка выключится на ${seconds(SAVE_LOCKS.at(-1))}.` : ''))
    + ` Кнопка снова заработает через ${seconds(n)}.`;
}
function saveClicked() {
  const now = Date.now();
  if (now < saveUntil) return;
  saveClicks = saveClicks.filter(t => now - t < 2000).concat(now);
  if (saveClicks.length <= 3) return exportBackup();
  saveClicks = [];
  if (now - saveUntil > 60000) saveStrikes = 0;
  saveTotal = SAVE_LOCKS[Math.min(saveStrikes, SAVE_LOCKS.length - 1)];
  saveStrikes++;
  saveUntil = now + saveTotal * 1000;
  store.set(SAVE_KEY, { until: saveUntil, total: saveTotal, strikes: saveStrikes });
  showFileMsg('bad', saveWarning(saveTotal));
  runSaveLock();
}
/* the countdown: only the text changes, the block is not rebuilt every second; at 0 the button comes back */
function runSaveLock() {
  clearInterval(saveTick);
  saveShown = null;
  const tick = () => {
    const left = Math.max(0, Math.ceil((saveUntil - Date.now()) / 1000));
    if (left === saveShown) return;
    saveShown = left;
    fileMsg = ['bad', saveWarning(left)];
    document.querySelectorAll('.overall__file .overall__note').forEach(n => { n.textContent = fileMsg[1]; });
    if (left > 0) return;
    clearInterval(saveTick);
    setTimeout(() => { if (fileMsg && fileMsg[0] === 'bad') fileMsg = null; renderFold('prog'); }, 400);
  };
  tick();
  saveTick = setInterval(tick, 200);
}
if (saveLocked()) runSaveLock();
/* what a backup holds: rules studied, exercises done, without and with mistakes, bookmarks (topics this version knows) */
function backupSummary(data) {
  const ids = o => Object.keys(o && typeof o === 'object' ? o : {}).filter(id => topicById[id]);
  let ex = 0, perfect = 0, wrong = 0;
  ids(data['gk2-progress']).forEach(id => {
    const e = data['gk2-progress'][id];
    if (!e || typeof e !== 'object') return;
    Object.values(e).forEach(r => {
      ex++;
      if (!Array.isArray(r)) return;
      if (r[0] < r[1]) wrong++; else perfect++;
    });

const EX_TOTAL = TOPICS.reduce((n, t) => n + t.ex.length, 0);
/* a backup read from a file: its data and save time, or null when the file is not ours */
function readBackup(file) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onerror = () => resolve(null);
    reader.onload = () => {
      let b;
      try { b = JSON.parse(reader.result); } catch (e) { b = null; }
      resolve(isBackup(b) ? b : null);
    };
    reader.readAsText(file);

/* «Отправить ссылкой»: the same backup packed into the address itself (#restore=…, deflate + base64url), so no file is needed.
   Opening such a link shows the import window with that progress; the data leaves the address bar straight away. */
const LINK_KEY = 'restore=';
async function packLink(text) {
  const bytes = new Uint8Array(await new Response(new Blob([text]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer());
  let s = '';
  bytes.forEach(c => { s += String.fromCharCode(c); });

}
async function unpackLink(code) {
  const bytes = Uint8Array.from(atob(code.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));

  showLinkBox(url);

function plural(n, one, few, many) {
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return one;
  if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
  return many;
}

/* ---------- Page progress: the whole book on Contents, the current chapter elsewhere ---------- */
function progressBlock(ch, curLevel) {
  const box = el('div', 'page-prog'); box.id = 'pageProg';
  box.dataset.scope = ch ? ch.id : '';
  box.dataset.level = curLevel || '';
  fillProgress(box);
  return box;
}
function fillProgress(box) {
  const ch = box.dataset.scope ? CHAPTERS.find(c => c.id === box.dataset.scope) : null;
  const topics = ch ? ch.topics : TOPICS;
  let s = 0, tot = 0, done = 0, exn = 0;
  topics.forEach(t => {
    const st = topicStats(t); s += st.s; tot += st.tot;
    t.ex.forEach((e, i) => { exn++; if (progress[t.id] && progress[t.id][i]) done++; });
  });
  /* the whole book counts rules too, the same figure as in the sidebar; a chapter counts its exercises */
  const pct = ch ? (tot ? Math.round(100 * s / tot) : 0) : bookProgress().pct;
  /* breakdown by level, shown when the scope covers more than one level; the level of the open topic is filled */
  const levels = Object.keys(LEVELS).filter(l => topics.some(t => t.level === l));
  const rows = levels.length > 1 ? levels.map(l => {
    let ls = 0, lt = 0;
    topics.filter(t => t.level === l).forEach(t => { const st = topicStats(t); ls += st.s; lt += st.tot; });
    const p = lt ? Math.round(100 * ls / lt) : 0;
    return `<div class="page-prog__level" title="${LEVELS[l]}"><span class="lvl-tag page-prog__tag${l === box.dataset.level ? ' lvl-tag--filled' : ''}">${l}</span><span class="bar bar--thin">${barFill(p)}</span>${pctLabel(p, 'page-prog__value')}</div>`;
  }).join('') : '';
  box.innerHTML = `<div class="page-prog__row"><span>${ch ? `Раздел ${ch.n} пройден на` : 'Учебник пройден на'}</span>${pctLabel(pct, 'page-prog__value')}</div>
    <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}">${barFill(pct)}</div>
    <div class="page-prog__row"><span>Упражнений выполнено</span><b class="page-prog__value">${done} из ${exn}</b></div>` +
    (rows ? `<div class="page-prog__levels" aria-label="Прогресс по уровням">${rows}</div>` : '');
}

/* ---------- Pages ---------- */
function crumbs(parts) {
  const c = el('div', 'crumbs');
  parts.forEach((p, i) => {
    if (i) { const s = el('span', 'crumbs__sep', '→'); s.setAttribute('aria-hidden', 'true'); c.append(s); }
    if (typeof p === 'string') c.append(el('span', null, p));
    else { const b = el('button', 'crumbs__link', p.label); b.type = 'button'; b.addEventListener('click', () => go(p.to)); c.append(b); }
  });
  return c;
}

/* what is wrong with an exercise: errors and blanks from its last check */
function mistakeSummary(t, i, r) {
  const score = `<span class="mistakes__score">${r[0]} из ${r[1]}</span>`;
  const m = answers[t.id] && answers[t.id][i] && answers[t.id][i].m;
  if (!m) return score; /* checked before the item numbers were kept */
  /* «ошибки в № 3, 5, 7», «не заполнены № 8–10»; in a text exercise the items are gaps */
  const gaps = t.ex[i].type === 'text';
  const [w, b] = m, parts = [];
  if (w.length) parts.push(`<span class="mistakes__score">${w.length > 1 ? 'ошибки' : 'ошибка'} в ${gaps ? (w.length > 1 ? 'пропусках ' : 'пропуске ') : '№ '}${numList(w)}</span>`);
  if (b.length) parts.push(`<span class="mistakes__note">${b.length > 1 ? 'не заполнены' : 'не заполнен'} ${gaps ? (b.length > 1 ? 'пропуски ' : 'пропуск ') : '№ '}${numList(b)}</span>`);
  return parts.join(' · ') || score;
}
/* 1, 2, 3, 5, 8, 9 → «1–3, 5, 8, 9»; runs of three or more become a range */
function numList(nums) {
  const out = [];
  for (let k = 0; k < nums.length;) {
    let e = k; while (e + 1 < nums.length && nums[e + 1] === nums[e] + 1) e++;
    if (e - k >= 2) out.push(`${nums[k]}–${nums[e]}`); else for (let j = k; j <= e; j++) out.push(nums[j]);
    k = e + 1;
  }
  return out.join(', ');
}

function pager(idx, arr, idOf, titleOf, noun) {
  const nav = el('nav', 'pager'); nav.setAttribute('aria-label', 'Соседние страницы');
  const levelsOf = item => item.level ? [item.level] : [...new Set(item.topics.map(x => x.level))].sort();
  const curLv = levelsOf(arr[idx]);
  /* a level the neighbour has and the current page does not is filled */
  const mk = (item, dir, label) => {
    const b = el('button', 'pager__btn pager__btn--' + dir); b.type = 'button';
    const tags = levelsOf(item).map(l => `<span class="lvl-tag lvl-tag--sm${curLv.includes(l) ? '' : ' lvl-tag--filled'}" title="${LEVELS[l]}">${l}</span>`).join('');
    b.innerHTML = `<small class="pager__label"><span>${label}</span><span class="pager__levels">${tags}</span></small><span>${esc(titleOf(item))}</span>`;
    b.addEventListener('click', () => go(idOf(item)));
    nav.append(b);
  };
  const prevLabel = `${arrowHtml('prev')} ${noun === 'тема' ? 'Предыдущая тема' : 'Предыдущий раздел'}`;
  const nextLabel = `${noun === 'тема' ? 'Следующая тема' : 'Следующий раздел'} ${arrowHtml('next')}`;
  if (idx > 0) mk(arr[idx - 1], 'prev', prevLabel);
  if (idx < arr.length - 1) mk(arr[idx + 1], 'next', nextLabel);
  const here = el('div', 'pager-current');
  const cur = arr[idx];
  here.innerHTML = `<span>${noun === 'тема' ? 'Текущая тема' : 'Текущий раздел'}</span>` +
    `<span class="pager-current__title">${esc(noun === 'тема' ? titleOf(cur) : `${cur.n}. ${cur.title}`)}</span>` +
    `<span>· ${noun === 'тема' ? 'уровень' : 'уровни'}</span>` +
    curLv.map(l => `<span class="lvl-tag" title="${LEVELS[l]}">${l}</span>`).join('');
  const frag = document.createDocumentFragment(); frag.append(here, nav);
  if (noun === 'тема') { const lv = levelPager(idx, arr, idOf, titleOf); if (lv) frag.append(lv); }
  return frag;
}

/* A compact row under the pager: the nearest topics of the open topic's level back and forward, shown only when
   a neighbour in book order is of another level (so the plain pager would lead the reader off their level). */
function levelPager(idx, arr, idOf, titleOf) {
  const level = arr[idx].level;
  const before = arr.slice(0, idx).reverse().find(x => x.level === level);
  const after = arr.slice(idx + 1).find(x => x.level === level);
  const prev = before && before !== arr[idx - 1] ? before : null;
  const next = after && after !== arr[idx + 1] ? after : null;
  if (!prev && !next) return null;
  const box = el('nav', 'pager-level'); box.setAttribute('aria-label', `Темы уровня ${level}`);
  box.innerHTML = `<span class="pager-level__label">Идти только по темам уровня <span class="lvl-tag lvl-tag--sm" title="${LEVELS[level]}">${level}</span></span>`;
  const link = (item, dir) => {
    const b = el('button', 'pager-level__link pager-level__link--' + dir); b.type = 'button';
    b.innerHTML = `<small class="pager-level__dir">${dir === 'prev' ? arrowHtml('prev') + ' Предыдущая' : 'Следующая ' + arrowHtml('next')}</small><span>${esc(titleOf(item))}</span>`;
    b.addEventListener('click', () => go(idOf(item)));
    box.append(b);
  };
  if (prev) link(prev, 'prev');
  if (next) link(next, 'next');
  return box;
}

/* ---------- Exercises ---------- */
const FIELD_MARKS = ['ex__field--ok', 'ex__field--bad', 'ex__field--miss'];
const OPT_MARKS = ['ex__opt--ok', 'ex__opt--bad'];

function makeGap(answers, id, label) {
  const inp = el('input', 'ex__field ex__gap');
  inp.type = 'text'; inp.id = id; inp.autocomplete = 'off'; inp.spellcheck = false;
  inp.setAttribute('autocapitalize', 'off'); inp.setAttribute('aria-label', label);
  const longest = Math.max(...answers.split('|').map(s => s.length));
  inp.style.width = Math.max(4, Math.min(longest + 2, 24)) + 'ch';
  return inp;
}

function fillGaps(container, text, answers, idBase, label) {
  const parts = text.split('___');
  const inputs = [];
  parts.forEach((part, k) => {
    container.append(fmt(part));
    if (k < parts.length - 1) {
      const inp = makeGap(answers[k] || '', `${idBase}-${k}`, `${label}, пропуск ${k + 1}`);
      container.append(inp); inputs.push(inp);
    }
  });
  return inputs;
}

function renderEx(t, ex, ei) {
  const box = el('section', 'ex');
  box.innerHTML = `<div class="ex__head"><span class="ex__num">Упражнение ${ei + 1}</span><p class="ex__task">${ex.task}</p></div>`;
  const rows = [];
  const idBase = `x-${t.id}-${ei}`;

  /* shown answers stay until «Скрыть ответы» (or a page reload): typing, checking and resetting keep them */
  let keysShown = false;
  const clearRow = row => {
    row.li.querySelectorAll('.ex__verdict').forEach(v => v.remove());
    if (row.selfBtn) row.selfBtn.hidden = true;
  };

  if (ex.type === 'text') {
    const div = el('div', 'ex__text');
    const row = { li: div, q: div, inputs: fillGaps(div, ex.text, ex.answers, idBase, 'Текст') };
    rows.push(row); box.append(div);
  } else {
    const ol = el('ol', 'ex__items');
    ex.items.forEach((it, ii) => {
      const li = el('li', 'ex__item'); const row = { it, li };
      if (ex.type === 'gap') {
        const q = el('div', 'ex__q');
        row.q = q; row.inputs = fillGaps(q, it[0], gapAnswers(it), `${idBase}-${ii}`, `Предложение ${ii + 1}`);
        li.append(q);
      } else if (ex.type === 'choice') {
        const q = el('div', 'ex__q');
        const [before, after = ''] = it[0].split('___');
        const blank = el('span', 'ex__blank', ' ');
        q.append(fmt(before), blank, fmt(after));
        const opts = el('div', 'ex__opts'); opts.setAttribute('role', 'group');
        shuffled(it[1], it[0]).forEach(o => {
          const b = el('button', 'ex__opt', o); b.type = 'button'; b.setAttribute('aria-pressed', 'false');
          b.addEventListener('click', () => {
            opts.querySelectorAll('.ex__opt').forEach(x => { x.setAttribute('aria-pressed', String(x === b)); x.classList.remove(...OPT_MARKS); });
            row.sel = o; blank.textContent = o; blank.classList.remove('ex__blank--miss'); clearRow(row); if (keysShown) showKey(row); unlock(); save();
          });
          opts.append(b);
        });
        Object.assign(row, { q, blank, opts });
        li.append(q, opts);
      } else if (ex.type === 'translate') {
        const q = el('div', 'ex__q ex__q--ru', it[0]);
        const inp = el('input', 'ex__field ex__tr');
        inp.type = 'text'; inp.id = `${idBase}-${ii}`; inp.autocomplete = 'off'; inp.spellcheck = false;
        inp.setAttribute('autocapitalize', 'off'); inp.setAttribute('aria-label', `Перевод предложения ${ii + 1}`);
        inp.placeholder = 'Ваш перевод';
        const selfBtn = el('button', 'ex__self-ok', 'Мой вариант тоже верен'); selfBtn.type = 'button'; selfBtn.hidden = true;
        Object.assign(row, { q, inputs: [inp], selfBtn });
        li.append(q, inp);
      }
      row.key = el('div', 'ex__key'); row.key.hidden = true;
      li.append(row.key);
      if (row.selfBtn) li.append(row.selfBtn);
      ol.append(li); rows.push(row);
    });
    box.append(ol);
  }

  /* typing clears marks; Enter jumps to the next field */
  rows.forEach(row => (row.inputs || []).forEach(inp => {
    inp.addEventListener('input', () => { inp.classList.remove(...FIELD_MARKS); row.credited = false; clearRow(row); unlock(); save(); });
    inp.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      const all = [...box.querySelectorAll('input')];
      const next = all[all.indexOf(inp) + 1];
      if (next) next.focus(); else if (!bCheck.disabled) check();
    });
  }));

  const foot = el('div', 'ex__foot');
  const bCheck = el('button', 'btn btn--primary ex__btn', 'Проверить'); bCheck.type = 'button';
  const bShow = el('button', 'btn ex__btn', 'Показать ответы'); bShow.type = 'button'; bShow.setAttribute('aria-pressed', 'false');
  /* nothing to check until at least one answer is given */
  const blank = () => rows.every(r => ex.type === 'choice' ? !r.sel : r.inputs.every(i => !i.value.trim()));
  const syncBlank = () => { const b = blank(); bCheck.disabled = b; bCheck.title = b ? 'Сначала введите хотя бы один ответ' : ''; };
  /* any change of an answer makes «Проверить» and «Показать ответы» available again */
  const unlock = () => { syncBlank(); bShow.hidden = false; };
  const bReset = el('button', 'btn ex__btn', 'Заново'); bReset.type = 'button';
  const score = el('span', 'ex__score'); score.setAttribute('aria-live', 'polite');
  foot.append(bCheck, bShow, bReset, score);
  box.append(foot);

  const answerOf = (row, k) => ex.type === 'text' ? ex.answers[k] : ex.type === 'gap' ? gapAnswers(row.it)[k] : row.it[1];
  const total = units(ex);
  let checked = false;
  /* with every answer right, «Показать ответы» has something to show only in translations: other accepted variants,
     or the reference wording of a row credited by «Мой вариант тоже верен» */
  const hasAlternatives = ex.type === 'translate' && ex.items.some(it => it[1].includes('|'));
  /* the last check for «Работа над ошибками»: [numbers of wrong items, numbers of blank items];
     an item is a sentence (a gap in a «text» exercise), wrong if any of its gaps is wrong, blank if the rest are empty */
  let marks = null;
  function countMarks() {
    const wrong = [], blank = [];
    const mark = (n, state) => { if (state === 'wrong') wrong.push(n); else if (state === 'blank') blank.push(n); };
    const stateOf = (ok, value) => ok ? 'ok' : value.trim() ? 'wrong' : 'blank';
    rows.forEach((row, ri) => {
      if (ex.type === 'choice') { mark(ri + 1, !row.sel ? 'blank' : row.sel === row.it[1][0] ? 'ok' : 'wrong'); return; }
      if (ex.type === 'translate') { const v = row.inputs[0].value; mark(ri + 1, stateOf(row.credited || accepts(row.it[1], v), v)); return; }
      const res = row.inputs.map((inp, k) => stateOf(accepts(answerOf(row, k), inp.value), inp.value));
      if (ex.type === 'text') res.forEach((r, k) => mark(k + 1, r));
      else mark(ri + 1, res.includes('wrong') ? 'wrong' : res.includes('blank') ? 'blank' : 'ok');
    });
    return [wrong, blank];
  }

  /* answers persist in localStorage: gk2-answers[topic][exercise] = { v: per-row values, c: credited rows, k: checked, m: marks } */
  function save() {
    const v = rows.map(r => ex.type === 'choice' ? (r.sel ?? null) : r.inputs.map(i => i.value));
    const empty = v.every(x => x == null || (Array.isArray(x) && x.every(s => !s)));
    answers[t.id] = answers[t.id] || {};
    if (empty) { delete answers[t.id][ei]; if (!Object.keys(answers[t.id]).length) delete answers[t.id]; }
    else answers[t.id][ei] = { v, c: rows.map((r, i) => r.credited ? i : -1).filter(i => i >= 0), k: checked, ...(checked && marks ? { m: marks } : {}) };
    store.set('gk2-answers', answers);
  }

  function rowScore(row) {
    if (ex.type === 'choice') return row.sel === row.it[1][0] ? 1 : 0;
    if (ex.type === 'translate') return row.credited || accepts(row.it[1], row.inputs[0].value) ? 1 : 0;
    return row.inputs.reduce((n, inp, k) => n + (accepts(answerOf(row, k), inp.value) ? 1 : 0), 0);
  }

  function showScore() {
    const ok = rows.reduce((n, r) => n + rowScore(r), 0);
    bCheck.disabled = ok === total;
    bShow.hidden = ok === total && !hasAlternatives && !rows.some(r => r.credited);
    if (bShow.hidden && keysShown) hideKeys();
    score.textContent = `${ok} из ${total}` + (ok === total ? ' · без ошибок' : '');
    score.className = 'ex__score' + (ok === total ? ' ex__score--good' : ok / total < .5 ? ' ex__score--low' : '');
    return ok;
  }

  function updateScore() {
    const ok = showScore();
    /* the latest check counts, not the best one: the score under the exercise, the progress and «С ошибками» always agree */
    progress[t.id] = progress[t.id] || {};
    progress[t.id][ei] = [ok, total]; store.set('gk2-progress', progress);
    renderToc(); renderOverall(); renderRedoBar();
    const pp = $('#pageProg'); if (pp) fillProgress(pp);
  }

  function check(silent) {
    rows.forEach(row => {
      clearRow(row);
      let good;
      if (ex.type === 'choice') {
        good = row.sel === row.it[1][0];
        row.opts.querySelectorAll('.ex__opt').forEach(b => { b.classList.remove(...OPT_MARKS); if (b.textContent === row.sel) b.classList.add(good ? 'ex__opt--ok' : 'ex__opt--bad'); });
        if (!row.sel) row.blank.classList.add('ex__blank--miss');
      } else {
        good = true;
        row.inputs.forEach((inp, k) => {
          const g = ex.type === 'translate' ? (row.credited || accepts(row.it[1], inp.value)) : accepts(answerOf(row, k), inp.value);
          inp.classList.remove(...FIELD_MARKS);
          inp.classList.add(g ? 'ex__field--ok' : inp.value.trim() ? 'ex__field--bad' : 'ex__field--miss');
          if (!g) good = false;
        });
        if (ex.type === 'translate' && !good && row.inputs[0].value.trim()) row.selfBtn.hidden = false;
      }
      if (ex.type !== 'text') {
        const v = el('span', 'ex__verdict ex__verdict--' + (good ? 'ok' : 'bad'), good ? '✓' : '✗');
        v.setAttribute('aria-label', good ? 'верно' : 'ошибка');
        row.q.append(v);
      }
    });
    checked = true; marks = countMarks();
    if (keysShown) rows.forEach(showKey);
    if (!silent) { updateScore(); save(); }
  }

  rows.forEach(row => {
    if (!row.selfBtn) return;
    row.selfBtn.addEventListener('click', () => {
      row.credited = true;
      row.inputs[0].classList.remove(...FIELD_MARKS); row.inputs[0].classList.add('ex__field--ok');
      row.selfBtn.hidden = true;
      const v = row.q.querySelector('.ex__verdict'); if (v) { v.className = 'ex__verdict ex__verdict--ok'; v.textContent = '✓'; }
      marks = countMarks();
      updateScore(); save();
    });
  });

  bCheck.addEventListener('click', () => check());
  /* «Показать ответы» toggles; while on, typing keeps the hints in place and choosing an option updates its key line */
  function setKeysShown(on) {
    keysShown = on;
    bShow.textContent = on ? 'Скрыть ответы' : 'Показать ответы';
    bShow.setAttribute('aria-pressed', String(on));
  }
  function showKey(row) {
    if (ex.type === 'choice') {
      const good = row.sel === row.it[1][0];
      row.key.textContent = good ? 'Верно' : 'Ответ: ' + row.it[1][0];
      row.key.classList.toggle('ex__key--wrong', !good); row.key.hidden = false;
      row.opts.querySelectorAll('.ex__opt').forEach(b => b.classList.toggle('ex__opt--key', b.textContent === row.it[1][0]));
    } else if (ex.type === 'translate') {
      const alts = row.it[1].split('|');
      row.key.textContent = 'Ответ: ' + alts[0] + (alts.length > 1 ? '  (или: ' + alts.slice(1, 3).join('; ') + ')' : '');
      row.key.hidden = false;
    } else {
      row.li.querySelectorAll('.ex__inline-key').forEach(k => k.remove());
      row.inputs.forEach((inp, k) => {
        const a = answerOf(row, k);
        if (accepts(a, inp.value)) return;
        inp.after(el('span', 'ex__inline-key', '(' + firstAnswer(a) + ')'));
      });
    }
  }
  function hideKeys() {
    rows.forEach(row => {
      row.li.querySelectorAll('.ex__inline-key').forEach(k => k.remove());
      if (row.opts) row.opts.querySelectorAll('.ex__opt').forEach(b => b.classList.remove('ex__opt--key'));
      if (row.key) { row.key.hidden = true; row.key.classList.remove('ex__key--wrong'); }
    });
    setKeysShown(false);
  }
  bShow.addEventListener('click', () => {
    if (keysShown) { hideKeys(); return; }
    rows.forEach(showKey);
    setKeysShown(true);
  });
  bReset.addEventListener('click', () => {
    rows.forEach(row => {
      clearRow(row); row.credited = false;
      (row.inputs || []).forEach(inp => { inp.value = ''; inp.classList.remove(...FIELD_MARKS); });
      if (row.opts) {
        row.sel = undefined; row.blank.textContent = ' '; row.blank.classList.remove('ex__blank--miss');
        row.opts.querySelectorAll('.ex__opt').forEach(b => { b.setAttribute('aria-pressed', 'false'); b.classList.remove(...OPT_MARKS); });
      }
      if (keysShown) showKey(row);
    });
    score.textContent = ''; score.className = 'ex__score';
    unlock();
    checked = false; marks = null; save();
    /* the reset exercise no longer counts towards progress (nor «С ошибками») until it is checked again */
    if (progress[t.id] && progress[t.id][ei]) {
      delete progress[t.id][ei];
      if (!Object.keys(progress[t.id]).length) delete progress[t.id];
      store.set('gk2-progress', progress);
      renderToc(); renderOverall();
      const pp = $('#pageProg'); if (pp) fillProgress(pp);
    }
  });

  /* opened from «Работа над ошибками»: back to the list, on to the next exercise; turns green once solved fully */
  const redoBar = mistakeFocus && mistakeFocus.t === t.id && mistakeFocus.ei === ei ? el('nav', 'ex__redo') : null;
  if (redoBar) { redoBar.setAttribute('aria-label', 'Работа над ошибками'); box.append(redoBar); }
  function renderRedoBar() {
    if (!redoBar) return;
    const r = progress[t.id] && progress[t.id][ei];
    const fixed = !!r && r[0] === r[1];
    const next = nextMistake(t, ei);
    redoBar.classList.toggle('ex__redo--done', fixed);
    redoBar.innerHTML = '';
    if (fixed) redoBar.append(el('p', 'ex__redo-status', next ? '✓ Исправлено — упражнение убрано из «Работы над ошибками»' : '✓ Исправлено — это было последнее упражнение с ошибками'));
    const back = el('button', 'ex__redo-link'); back.type = 'button';
    back.innerHTML = `${arrowHtml('prev')} К работе над ошибками`;
    back.addEventListener('click', () => go('mistakes'));
    redoBar.append(back);
    if (next) {
      const b = el('button', 'ex__redo-link ex__redo-link--next'); b.type = 'button';
      b.innerHTML = `<span>Следующее: ${esc(next.t.num)} · Упр. ${next.i + 1}</span>${arrowHtml('next')}`;
      b.title = next.t.title;
      b.addEventListener('click', () => openExercise(next.t.id, next.i));
      redoBar.append(b);
    }
  }
  renderRedoBar();

  /* restore saved answers */
  const saved = answers[t.id] && answers[t.id][ei];
  if (saved && saved.v.length === rows.length) {
    rows.forEach((row, i) => {
      const val = saved.v[i];
      if (ex.type === 'choice') {
        const b = val != null && [...row.opts.querySelectorAll('.ex__opt')].find(x => x.textContent === val);
        if (b) { row.sel = val; row.blank.textContent = val; b.setAttribute('aria-pressed', 'true'); }
      } else if (Array.isArray(val)) row.inputs.forEach((inp, k) => { inp.value = val[k] || ''; });
    });
    (saved.c || []).forEach(i => { if (rows[i]) rows[i].credited = true; });
    if (saved.k) {
      check(true);
      showScore();
    }
  }
  if (!checked) syncBlank();
  return box;
}

/* ---------- Router ---------- */
/* syncToc = false on page load: the accordion keeps its saved open/closed state instead of following the route */
function go(id, scroll = true, syncToc = true, fromBookmarks = false) {
  if (!(id === 'contents' || id === 'mistakes' || topicById[id] || chapById[id])) id = 'contents';
  route = id;
  viaBookmarks = fromBookmarks;
  mistakeFocus = pendingFocus; pendingFocus = null;
  const curCh = topicById[id] ? topicById[id].ch : chapById[id];
  /* «Избранное» and the contents list are independent: a topic opened from the bookmarks leaves the contents list (open chapter, level filter) untouched */
  if (syncToc && !fromBookmarks && curCh && curCh.id !== openChap) { justToggled = curCh.id; setOpenChap(curCh.id); }
  const main = $('#main'); main.innerHTML = '';
  const wrap = el('div', 'sheet__inner');
  if (topicById[id]) {
    const t = topicById[id];
    /* the level chips follow the open lesson, except one opened from «Избранное» */
    if (!fromBookmarks && levelFilter !== t.level) { levelFilter = t.level; store.set('gk2-level', levelFilter); renderLevels(); }
    renderTopic(t, wrap);
  }
  else if (chapById[id]) renderChapter(chapById[id], wrap);
  else if (id === 'mistakes') renderMistakesPage(wrap);
  else renderContents(wrap);
  main.append(wrap);
  /* a move to another page adds a history entry, so the browser's Back / Forward work; the first render and re-renders of the same page only replace it */
  try { if (booted && location.hash.slice(1) !== id) history.pushState(null, '', '#' + id); else history.replaceState(null, '', '#' + id); } catch (e) {}
  store.set('gk2-last', id);
  renderToc();
  renderOverall();
  setDrawer(false);
  if (scroll) window.scrollTo(0, 0);
  syncToTop();
}

$('#tocContents').addEventListener('click', () => go('contents'));

/* Hide / show the sidebar on desktop; the choice is remembered. */
function setSide(collapsed, focus) {
  $('#app').classList.toggle('app--side-collapsed', collapsed);
  $('#floatTools').hidden = !collapsed;
  $('#sideShow').setAttribute('aria-expanded', String(!collapsed));
  $('#sideHide').setAttribute('aria-expanded', String(!collapsed));
  store.set('gk2-side-collapsed', collapsed);
  if (focus) (collapsed ? $('#sideShow') : $('#sideHide')).focus();
}
$('#sideHide').addEventListener('click', () => setSide(true, true));

/* ---------- Scroll to top ---------- */
function syncToTop() {
  const max = document.documentElement.scrollHeight - innerHeight;
  const show = max > 0 && scrollY / max >= .3;
  const b = $('#toTop');
  b.classList.toggle('to-top--visible', show);
  b.tabIndex = show ? 0 : -1;
}
addEventListener('scroll', syncToTop, { passive: true });
addEventListener('resize', syncToTop);
$('#toTop').addEventListener('click', () => {
  const smooth = !matchMedia('(prefers-reduced-motion: reduce)').matches;
  scrollTo({ top: 0, behavior: smooth ? 'smooth' : 'auto' });
});

/* ---------- Theme ---------- */
let themeTimer;
/* on every hover the stars of the theme button get a new random order, and the rays are centred on the icon */
document.querySelectorAll('.theme-toggle').forEach(b => {
  const shuffle = () => {
    b.querySelectorAll('.theme-toggle__stars i').forEach(s => { s.style.transitionDelay = (Math.random() * .3).toFixed(2) + 's'; });
    /* the rays start from the centre of the visible icon */
    const icon = [...b.querySelectorAll('svg')].find(s => s.getClientRects().length), r = b.getBoundingClientRect();
    if (icon) { const i = icon.getBoundingClientRect(); b.style.setProperty('--cx', i.left - r.left + i.width / 2 + 'px'); b.style.setProperty('--cy', i.top - r.top + i.height / 2 + 'px'); }
  };
  /* the sun: one turn in 12s while hovered; on leave it eases forward to the next 45° step, where its eight rays look the same as at rest */
  const sun = b.querySelector('.theme-toggle__sun');
  let spin = null;
  const spinStart = () => {
    /* hover and focus both start it (a click focuses the hovered button): a second animation would lose the first one, left spinning */
    if (spin || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    sun.style.transition = 'none'; sun.style.transform = '';
    spin = sun.animate([{ transform: 'rotate(0deg)' }, { transform: 'rotate(360deg)' }], { duration: 12000, iterations: Infinity });
  };
  const spinStop = () => {
    if (!spin) return;
    const angle = (spin.currentTime % 12000) / 12000 * 360;
    spin.cancel(); spin = null;
    sun.style.transform = `rotate(${angle}deg)`;
    void sun.getBoundingClientRect();
    sun.style.transition = 'transform .5s ease-out';
    sun.style.transform = `rotate(${Math.ceil(angle / 45) * 45}deg)`;
  };
  b.addEventListener('pointerenter', () => { shuffle(); spinStart(); });
  b.addEventListener('focus', () => { shuffle(); spinStart(); });
  b.addEventListener('pointerleave', spinStop);
  b.addEventListener('blur', spinStop);
});
document.querySelectorAll('.theme-toggle').forEach(b => b.addEventListener('click', () => {
  const root = document.documentElement;
  const next = root.dataset.theme === 'light' ? 'dark' : 'light';
  const apply = () => { root.dataset.theme = next; store.set('gk2-theme', next); syncThemeBtn(); };
  if (document.startViewTransition && !matchMedia('(prefers-reduced-motion: reduce)').matches) { document.startViewTransition(apply); return; }
  root.classList.add('theme-anim');
  apply();
  clearTimeout(themeTimer);
  themeTimer = setTimeout(() => root.classList.remove('theme-anim'), 150);
}));
$('#sideShow').addEventListener('click', () => setSide(false, true));
setSide(!!store.get('gk2-side-collapsed', false), false);
$('#search').addEventListener('input', renderToc);
/* ---------- Mobile drawer ---------- */
function setDrawer(open, focus) {
  $('#drawer').classList.toggle('drawer--open', open);
  $('#drawerBackdrop').classList.toggle('drawer-backdrop--open', open);
  document.documentElement.style.overflow = open ? 'hidden' : '';
  $('#menuBtn').setAttribute('aria-expanded', String(open));
  if (focus) (open ? $('#drawerClose') : $('#menuBtn')).focus();
}
$('#menuBtn').addEventListener('click', () => setDrawer(true, true));
$('#drawerClose').addEventListener('click', () => setDrawer(false, true));
$('#drawerBackdrop').addEventListener('click', () => setDrawer(false));
addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if ($('#drawer').classList.contains('drawer--open')) setDrawer(false, true);
});
matchMedia('(max-width: 880px)').addEventListener('change', () => setDrawer(false));
/* Back / Forward (popstate) and a hash typed into the address bar (hashchange) open that page */
/* a «restore» link pasted into an open tab: put the page's own address back and offer the import */
const followHash = () => {
  const id = location.hash.slice(1);
  if (id.startsWith(LINK_KEY)) { history.replaceState(null, '', '#' + route); openLink(id); }
  else if (id && id !== route) go(id);
};
window.addEventListener('popstate', followHash);
window.addEventListener('hashchange', followHash);
let booted = false;
renderLevels();
const startId = location.hash.slice(1);
go(startId && (startId === 'contents' || startId === 'mistakes' || topicById[startId] || chapById[startId]) ? startId : store.get('gk2-last', 'contents'), false, false);
booted = true;
/* opened from a «restore» link: go() has already replaced the address with the page's own */
if (startId.startsWith(LINK_KEY)) openLink(startId);
renderOverall();
$('#tocToggle').insertAdjacentHTML('beforeend', FOLD_ARROW);

/* «Поддержать автора»: banknotes for the hover rain, each with its own speed, start and swing; each keeps to its own strip
   of the button, so the rain covers it edge to edge, corners included; on every new fall it gets a new place in the strip,
   swing, tilt and flip, so the rain never repeats */
(function () {
  if (!matchMedia('(hover: hover)').matches) return; /* touch screens have no hover: no rain to fall */
  const box = $('#donateBills'), N = 16, rnd = (a, b) => a + Math.random() * (b - a);
  const shuffle = b => {
    b.style.setProperty('--x', (2 + (+b.dataset.slot + Math.random()) * 96 / N).toFixed(1) + '%');
    b.style.setProperty('--sw', rnd(3, 8).toFixed(1) + 'px');
    b.style.setProperty('--r', rnd(10, 40).toFixed(0) + 'deg');
    b.style.setProperty('--fl', rnd(30, 160).toFixed(0) + 'deg');
  };
  /* the strips are dealt out in random order, so neighbours in time do not fall side by side */
  const slots = [...Array(N).keys()].sort(() => Math.random() - .5);
  for (let n = 0; n < N; n++) {
    const b = document.createElement('i');
    b.dataset.slot = slots[n];
    b.style.setProperty('--t', rnd(1.6, 2.4).toFixed(2) + 's');
    b.style.setProperty('--d', (n * .13 + rnd(0, .1)).toFixed(2) + 's');
    b.style.setProperty('--s', rnd(.5, .85).toFixed(2) + 's');
    b.style.setProperty('--sd', (-rnd(0, .8)).toFixed(2) + 's');
    shuffle(b); b.append(document.createElement('b')); box.append(b);
  }
  box.addEventListener('animationiteration', e => { if (e.animationName === 'bill-fall') shuffle(e.target); });
})();
$('#tocToggle').addEventListener('click', () => {
  /* during a search the list is forced open; the toggle then clears the search and folds it */
  if ($('#search').value.trim()) { $('#search').value = ''; tocFolded = true; }
  else tocFolded = !tocFolded;
  store.set('gk2-toc-folded', tocFolded);
  renderToc();
});
['prog', 'bm'].forEach(k => { $(FOLD[k][0]).addEventListener('click', () => setFold(k, !folds[k])); setFold(k, !!folds[k]); });
