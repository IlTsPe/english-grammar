<script>
/* манифест (установка на домашний экран) подключается только по http/https: с диска (file://) браузер не дает его прочитать
   и пишет в консоль ошибку CORS */
if (location.protocol !== 'file:') document.head.insertAdjacentHTML('beforeend', '<link rel="manifest" href="manifest.webmanifest">');
/* тема: сохраненный выбор, по умолчанию темная; ставится до первой отрисовки. Ссылка «restore» несет тему, в которой ее скопировали
   (…&theme=light): страница открывается в ней без сохранения — после импорта прогресс приносит свою тему */
(function () {
  var t; try { t = JSON.parse(localStorage.getItem('gk2-theme')); } catch (e) {}
  var m = /^#restore=[^&]*&theme=(light|dark)/.exec(location.hash);
  if (m) t = m[1];
  if (t !== 'light') t = 'dark';
  document.documentElement.dataset.theme = t;
})();
</script>

<script>
/* Помощники, которыми файлы данных пишут правила. */
window.BOOK = [];
const T = (head, rows) => {
  const labels = head.map(h => h.replace(/<[^>]+>/g, '').replace(/"/g, '&quot;'));
  return `<div class="rule-table"><table class="rule-table__table"><thead class="rule-table__head"><tr>${head.map(h => `<th class="rule-table__th">${h}</th>`).join('')}</tr></thead>` +
    `<tbody class="rule-table__body">${rows.map(r => `<tr class="rule-table__row">${r.map((c, i) => `<td class="rule-table__cell" data-label="${labels[i] || ''}">${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
};
const E = list => `<ul class="examples">${list.map(([en, ru]) => `<li class="examples__item"><span class="examples__en">${en}</span><span class="examples__ru">${ru}</span></li>`).join('')}</ul>`;
const N = t => `<div class="note"><div>${t}</div></div>`;
const M = (label, words) => `<div class="markers"><span class="markers__label">${label}</span>${words.map(w => `<span class="markers__word">${w}</span>`).join('')}</div>`;
const F = t => `<div class="formula">${t}</div>`;

/* кнопки темы (ряд на десктопе, плавающие кнопки, мобильная шапка) в HTML пустые и заполняются здесь по одному шаблону:
   звезды и лучи для наведения, луна и солнце, подпись (скрыта CSS у мобильной кнопки только со значком).
   Текст подписи ставит syncThemeBtn сразу после. Код выполняется здесь, сразу после разметки и до загрузки файлов
   данных, поэтому кнопки никогда не видны пустыми или с неверным названием темы */
function themeToggleHtml() {
  const icon = 'action-btn__icon';
  return `<span class="theme-toggle__stars" aria-hidden="true">${'<i></i>'.repeat(8)}</span><span class="theme-toggle__rays" aria-hidden="true"></span>`
    + `<svg class="${icon} theme-toggle__moon" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path class="theme-toggle__moon-body" d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7Z"/></svg>`
    + `<svg class="${icon} theme-toggle__sun" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2" fill="currentColor" stroke="none"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.55 1.55M17.15 17.15l1.55 1.55M5.3 18.7l1.55-1.55M17.15 6.85l1.55-1.55"/></svg>`
    + '<span class="theme-toggle__label"></span>';
}
document.querySelectorAll('.theme-toggle').forEach(b => { b.innerHTML = themeToggleHtml(); });
syncThemeBtn();
function syncThemeBtn() {
  const dark = document.documentElement.dataset.theme !== 'light';
  /* подпись называет тему, на которую переключает кнопка; кнопка только со значком в мобильной шапке получает ее как aria-label */
  const action = dark ? 'Включить светлую тему' : 'Включить темную тему';
  document.querySelectorAll('.theme-toggle').forEach(b => {
    b.title = action;
    const label = b.querySelector('.theme-toggle__label');
    /* у кнопки мобильной шапки подпись просто «Тема» (data-label), поэтому полное действие она получает еще и как aria-label */
    if (label) label.textContent = b.dataset.label || (dark ? 'Светлая тема' : 'Темная тема');
    if (!label || b.dataset.label) b.setAttribute('aria-label', action);
  });
}
</script>

<script>
/* ================= Приложение ================= */
const LEVELS = { A1: 'Начальный', A2: 'Элементарный', B1: 'Средний', B2: 'Выше среднего', C1: 'Продвинутый', C2: 'Свободное владение' };
const CHAPTERS = window.BOOK.slice().sort((a, b) => a.n - b.n);
const TOPICS = [];
CHAPTERS.forEach(ch => ch.topics.forEach((t, i) => { t.ch = ch; t.num = `${ch.n}.${i + 1}`; TOPICS.push(t); }));
const topicById = Object.fromEntries(TOPICS.map(t => [t.id, t]));
const chapById = Object.fromEntries(CHAPTERS.map(c => ['ch-' + c.id, c]));

const $ = (s, r = document) => r.querySelector(s);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = s => { const sp = el('span'); sp.innerHTML = esc(s).replace(/\(([^)]+)\)/g, '<span class="ex__hint">($1)</span>'); return sp; };

function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function shuffled(arr, seed) { return arr.map((v, i) => ({ v, k: hash(seed + '|' + i + '|' + v) })).sort((a, b) => a.k - b.k).map(o => o.v); }

/* Сравнение ответов без учета регистра, пунктуации, фигурных кавычек и сокращений. */
function norm(s) {
  s = s.toLowerCase().replace(/[’‘`´]/g, "'").replace(/[—–]/g, '-').replace(/[.!?,;:"“”«»]/g, ' ').replace(/\s+-\s+/g, ' ').replace(/\s+/g, ' ').trim();
  s = s.replace(/\bwon't\b/g, 'will not').replace(/\bcan't\b/g, 'cannot').replace(/\bshan't\b/g, 'shall not')
       .replace(/n't\b/g, ' not').replace(/'m\b/g, ' am').replace(/'re\b/g, ' are').replace(/'ll\b/g, ' will').replace(/'ve\b/g, ' have')
       .replace(/\bcan not\b/g, 'cannot');
  return s.replace(/\s+/g, ' ').trim();
}
/* у 's и 'd по два значения (he's = he is / he has, I'd = I would / I had), поэтому их нельзя свести к одной форме,
   как n't или 'll: обе стороны раскрываются во все прочтения и совпадают, если хоть одно прочтение общее.
   Только после местоимений и вопросительных слов — Tom's / my brother's остаются притяжательными. */
const AMBIGUOUS = /\b(i|you|he|she|it|we|they|that|there|here|what|who|where|when|how|let)'(s|d)\b/;
const READINGS = { s: ['is', 'has'], d: ['would', 'had'] };
function readings(s) {
  const m = s.match(AMBIGUOUS);
  if (!m) return [s];
  const [whole, word, c] = m, at = m.index;
  const subs = word === 'let' ? (c === 's' ? ['let us'] : [whole]) : READINGS[c].map(r => `${word} ${r}`);
  return subs.flatMap(sub => readings(s.slice(0, at) + sub + s.slice(at + whole.length)));
}
const accepts = (answers, value) => {
  const mine = readings(norm(value));
  return answers.split('|').some(a => readings(norm(a)).some(r => mine.includes(r)));
};
const firstAnswer = answers => { const a = answers.split('|')[0]; return a === '-' ? '—' : a; };

/* Единицы счета: одна на пропуск, одна на пункт выбора / перевода. */
const gapAnswers = it => Array.isArray(it[1]) ? it[1] : [it[1]];
function units(ex) {
  if (ex.type === 'text') return ex.answers.length;
  if (ex.type === 'gap') return ex.items.reduce((n, it) => n + gapAnswers(it).length, 0);
  return ex.items.length;
}
/* порядок упражнений на экране: индексы t.ex (по ним хранится прогресс) без поля at идут по порядку, упражнение с at
   встает на это место (номер на экране); новые упражнения дописываются в конец массива, и прогресс старых не сдвигается */
const exOrders = new Map();
function exOrder(t) {
  if (!exOrders.has(t)) {
    const order = t.ex.map((ex, i) => i).filter(i => !t.ex[i].at);
    t.ex.map((ex, i) => i).filter(i => t.ex[i].at).sort((a, b) => t.ex[a].at - t.ex[b].at).forEach(i => order.splice(t.ex[i].at - 1, 0, i));
    exOrders.set(t, order);
  }
  return exOrders.get(t);
}
const exNo = (t, ei) => exOrder(t).indexOf(ei) + 1;

let progress = store.get('gk2-progress', {});
let studied = store.get('gk2-studied', {});
let bookmarks = store.get('gk2-bookmarks', {}); /* id темы → время добавления в избранное */
let notes = store.get('gk2-notes', []); /* «Мои заметки», см. renderNotesPage */
if (!Array.isArray(notes)) notes = [];
let answers = store.get('gk2-answers', {});
let levelFilter = store.get('gk2-level', '');
let route = null;
let viaBookmarks = false; /* открытая тема пришла из списка «Избранное» */

/* доля в целых процентах; 100 только когда сделано все, поэтому 199 из 200 показывает 99, а не округленные 100 */
const pctOf = (s, tot) => !tot ? 0 : s >= tot ? 100 : Math.min(99, Math.round(100 * s / tot));
/* баллы темы: по одному на пропуск или пункт ее упражнений плюс один за правило, отмеченное изученным, —
   так что с неизученным правилом ни тема, ни ее раздел или уровень не доходят до 100% */
function topicStats(t) {
  const p = progress[t.id] || {};
  let s = studied[t.id] ? 1 : 0, tot = 1, tried = !!studied[t.id];
  /* min(): счет, сохраненный до того, как в упражнении убрали пропуск, не должен выталкивать тему за 100% */
  t.ex.forEach((ex, i) => { tot += units(ex); if (p[i]) { s += Math.min(p[i][0], units(ex)); tried = true; } });
  return { s, tot, tried, pct: pctOf(s, tot) };
}
function chapterStats(ch, level) {
  let s = 0, tot = 0, tried = false;
  ch.topics.filter(t => !level || t.level === level).forEach(t => { const r = topicStats(t); s += r.s; tot += r.tot; tried = tried || r.tried; });
  return { s, tot, tried, pct: pctOf(s, tot) };
}

/* Прогресс книги: каждое правило — один балл (если отмечено изученным), каждое упражнение — до одного балла по доле верных ответов
   в последней проверке. 100% только когда все правила изучены и все упражнения решены без ошибок. */
function bookProgress() {
  let got = 0, rules = 0, exs = 0;
  TOPICS.forEach(t => {
    rules++; if (studied[t.id]) got++;
    t.ex.forEach((ex, i) => { exs++; const r = progress[t.id] && progress[t.id][i]; if (r) got += r[0] / r[1]; });
  });
  const total = rules + exs;
  return { share: 100 * got / total, pct: Math.floor(100 * got / total), full: got === total, rules, exs, total };
}

/* блок прогресса, показываемый в раскрывающемся «Прогрессе» */
function overallBox() {
  let total = 0, perfect = 0;
  TOPICS.forEach(t => t.ex.forEach((ex, i) => {
    total++;
    const r = progress[t.id] && progress[t.id][i];
    if (r && r[0] === r[1]) perfect++;
  }));
  /* «Выполнено» = «Без ошибок» + «С ошибками»: каждое проверенное упражнение — одно или другое */
  const wrong = mistakeCount();
  const book = bookProgress();
  const box = el('div', 'overall');
  box.innerHTML = `<div class="overall__row"><span>Правил изучено</span><b class="overall__value">${TOPICS.filter(t => studied[t.id]).length} из ${TOPICS.length}</b></div>
    <div class="overall__row"><span>Выполнено упражнений</span><b class="overall__value">${perfect + wrong} из ${total}</b></div>
    <div class="overall__row"><span>Без ошибок</span><b class="overall__value">${perfect}</b></div>
    <button class="overall__row overall__mistakes" type="button" data-go="mistakes"${route === 'mistakes' ? ' aria-current="page"' : ''}>
      <span>С ошибками</span><span class="overall__mistakes-end"><b class="overall__value">${wrong}</b>${arrowHtml('next')}</span></button>
    <div class="overall__book">
      <div class="overall__row"><span>Прохождение тренажера</span></div>
      <div class="bar bar--labeled" style="--p:${book.share}%"><i class="bar__fill${book.full ? ' bar__fill--full' : ''}" style="width:${book.share}%"></i><span class="bar__label">${book.pct}%</span><span class="bar__label bar__label--on-fill" aria-hidden="true">${book.pct}%</span></div>
      <p class="overall__note">${foldNote('book')}</p>
    </div>
    <div class="overall__file">
      <div class="overall__row"><span>Резервная копия</span></div>
      <div class="overall__file-btns">
        <button class="overall__file-btn" type="button" data-file="export" title="Сохранить прогресс в файл"${saveLocked() ? ' disabled' : ''}>Сохранить</button>
        <button class="overall__file-btn" type="button" data-file="import" title="Загрузить прогресс из файла">Загрузить</button>
        <button class="overall__file-btn overall__file-btn--wide" type="button" data-file="link" title="Получить ссылку с прогрессом, чтобы отправить ее куда удобно">Отправить ссылкой</button>
      </div>
      <p class="overall__note${fileMsg ? ' overall__note--' + fileMsg[0] : ''}" role="status">${fileMsg ? esc(fileMsg[1]) : foldNote('backup')}</p>
    </div>`;
  return box;
}

/* свернутые заметки в блоке «Прогресс». Свернутый текст обрывается после нескольких угасающих слов, сразу за ними «Показать еще»
   (как в постах ВКонтакте); открытый — весь текст со «Скрыть». Открыт или нет, помнится только пока открыта страница
   (перерисовки сохраняют, перезагрузка начинает свернутым). Каждая заметка: [видимый текст, угасающие слова, остальное] */
const FOLD_NOTES = {
  book: ['', 'Учитываются изученные', ' правила и верные ответы в упражнениях. 100% — все изучено и решено без ошибок.'],
  backup: ['Прогресс хранится только в этом браузере. ', 'Сохраните его в файл',
    ' по кнопке «Сохранить» или отправьте ссылкой — «Отправить ссылкой», чтобы перенести прогресс в другой браузер/устройство.'],
};
const notesOpen = {};
function foldNote(key) {
  const [head, fade, tail] = FOLD_NOTES[key], open = !!notesOpen[key];
  const btn = `<button class="overall__more-btn" type="button" data-fold-note="${key}" aria-expanded="${open}">${open ? 'Скрыть' : 'Показать еще'}</button>`;
  /* свернуто: угасающие слова и кнопка переносятся вместе, поэтому кнопка всегда стоит сразу за ними */
  return head + (open ? `${fade}${tail} ${btn}` : `<span class="overall__fade-row"><span class="overall__fade">${fade}</span> ${btn}</span>`);
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-fold-note]');
  if (!b) return;
  const key = b.dataset.foldNote, note = b.closest('.overall__note');
  notesOpen[key] = !notesOpen[key];
  note.innerHTML = foldNote(key);
  $('[data-fold-note]', note).focus();
});

/* кнопка «Прогресс»: полоса и процент прогресса книги, число упражнений с ошибками */
function renderOverall() {
  const book = bookProgress(), wrong = mistakeCount();
  const b = $('#progBtn');
  b.innerHTML = `<span>Прогресс</span><span class="bar bar--thin side__stat-bar" aria-hidden="true">${barFill(book.full ? 100 : Math.min(book.share, 99))}</span>` +
    `<b class="side__stat-pct">${book.pct}%</b>` + (wrong ? `<span class="side__badge" title="С ошибками: ${wrong}">${wrong}</span>` : '') + FOLD_ARROW;
  b.setAttribute('aria-label', `Прогресс: тренажер пройден на ${book.pct}%` + (wrong ? `, с ошибками ${wrong}` : ''));
  renderFold('prog');
}

/* порядок «Работы над ошибками»: по уровню A1 → C2, внутри уровня по номеру темы, затем по упражнению */
const mistakeOrder = (t, i) => Object.keys(LEVELS).indexOf(t.level) * 1e6 + TOPICS.indexOf(t) * 1000 + (i == null ? 0 : exNo(t, i));

/* упражнения, у которых последняя проверка ниже полного счета (ошибки или пустые ответы), в порядке mistakeOrder;
   «Заново» сбрасывает проверку, поэтому упражнение уходит из списка, пока его не проверят снова */
function mistakes() {
  const out = [];
  TOPICS.forEach(t => {
    const exs = exOrder(t).map(i => [i, progress[t.id] && progress[t.id][i]]).filter(([, r]) => r && r[0] < r[1]);
    if (exs.length) out.push({ t, exs });
  });
  return out.sort((a, b) => mistakeOrder(a.t) - mistakeOrder(b.t));
}
const mistakeCount = () => mistakes().reduce((n, m) => n + m.exs.length, 0);

/* фильтр уровня «Работы над ошибками»: свой, не тот, что в меню (тот следует за каждой открытой темой);
   сохраненный уровень, в котором ошибок не осталось, сменяется на «Все» */
let mistakesLevel = store.get('gk2-mistakes-level', '');
let mistakesPage = 0; /* открытая страница списка, только пока сайт открыт */
function mistakesFilter() {
  return mistakesLevel && mistakes().some(m => m.t.level === mistakesLevel) ? mistakesLevel : '';
}

/* упражнение после (topic, ei) в «С ошибками» в пределах фильтра уровня страницы, по кругу к началу; null, если оно единственное */
function nextMistake(topic, ei) {
  const cur = mistakeOrder(topic, ei);
  const level = mistakesFilter();
  const all = mistakes().filter(m => !level || m.t.level === level).flatMap(({ t, exs }) => exs.map(([i]) => ({ t, i, at: mistakeOrder(t, i) }))).filter(m => m.at !== cur);
  return all.find(m => m.at > cur) || all[0] || null;
}

/* упражнение, открытое из «Работы над ошибками», получает панель для возврата к списку и перехода к следующему */
let mistakeFocus = null, pendingFocus = null;

/* открыть тему и показать одно из ее упражнений */
function openExercise(topicId, ei) {
  pendingFocus = { t: topicId, ei };
  go(topicId);
  const box = $(`#main .ex[data-ei="${ei}"]`);
  if (!box) return;
  /* прыжок, а не плавная прокрутка: новая страница все равно открывается, а мигание показывает, куда смотреть */
  box.scrollIntoView({ block: 'start' });
  box.classList.remove('ex--flash'); void box.offsetWidth; box.classList.add('ex--flash');
}

/* ---------- Боковое меню ---------- */
/* прогресс для выбранного фильтра уровня: набранные баллы / все баллы; скрыт для «Все» (его показывает блок .overall) */
function renderLevelProgress() {
  const box = $('#lvlProg');
  box.hidden = !levelFilter;
  if (!levelFilter) return;
  const topics = TOPICS.filter(t => t.level === levelFilter);
  let s = 0, tot = 0;
  topics.forEach(t => { const r = topicStats(t); s += r.s; tot += r.tot; });
  const pct = pctOf(s, tot);
  box.innerHTML = `<div class="lvl-prog__row"><span>Уровень <span class="lvl-tag lvl-tag--sm" title="${LEVELS[levelFilter]}">${levelFilter}</span> пройден на</span>${pctLabel(pct, 'lvl-prog__value')}</div>
    <div class="bar bar--thin">${barFill(pct)}</div>`;
}

function renderLevels() {
  const box = $('#levelChips'); box.innerHTML = '';
  [['', 'Все'], ...Object.keys(LEVELS).map(l => [l, l])].forEach(([v, label]) => {
    const b = el('button', 'level-chip', label); b.type = 'button';
    b.setAttribute('aria-pressed', String(levelFilter === v));
    b.dataset.level = v;
    b.addEventListener('click', () => { levelFilter = v; store.set('gk2-level', v); renderLevels(); renderToc(); });
    box.append(b);
  });
  fillLevelChips();
}

/* каждый чип заливается зеленым снизу до доли набранных баллов своего уровня (для «Все» — всей книги);
   на 100% (все правила изучены и все упражнения всех тем решены полностью) он получает еще и --done */
function fillLevelChips() {
  document.querySelectorAll('#levelChips .level-chip').forEach(b => {
    const level = b.dataset.level;
    let s = 0, tot = 0;
    TOPICS.filter(t => !level || t.level === level).forEach(t => { const r = topicStats(t); s += r.s; tot += r.tot; });
    const pct = tot ? 100 * s / tot : 0;
    if (level) b.style.setProperty('--lvl', pct + '%'); /* у «Все» жидкости нет */
    b.classList.toggle('level-chip--done', tot > 0 && s === tot);
    b.title = `${level ? LEVELS[level] : 'Весь тренажер'} · пройдено ${pctOf(s, tot)}%`;
  });
}

/* Аккордеон: одновременно открыт один раздел (хранится в gk2-open-chap); поиск открывает все совпадения. */
let openChap = store.get('gk2-open-chap', null);
let justToggled = null;
function setOpenChap(id) { openChap = id; store.set('gk2-open-chap', id); }

/* искры вокруг ленточки «В избранном»: смещение от ее центра (px), задержка (s), точка вместо плюса */
/* текст начинается на 6px правее, поэтому правые искры стоят только над и под ним */
const BM_SPARKS = [[-13, -9, .15, 0], [8, -13, .25, 1], [-12, 8, .35, 1], [1, -15, .45, 1], [-16, -1, .55, 0], [7, 14, .65, 0], [-5, 15, .7, 1]];
/* символы на барабане «Правило изучено»; он останавливается на последнем */
const SLOT_REEL = ['★', '✗', '?', '♦', '✓', '•', '✗', '★', '?', '✓'];
/* стрелка, которая сдвигается в свою сторону, пока на ее кнопку наведено (см. .arrow) */
const arrowHtml = (dir, cls = '') => `<span class="arrow arrow--${dir}${cls ? ' ' + cls : ''}" aria-hidden="true">${dir === 'prev' ? '←' : '→'}</span>`;
/* плашка прогресса: на 100% зеленая обводка, ниже — заливка цветом по диапазону; cls добавляет класс элемента родителя */
const pill = (pct, cls = '') => `<span class="pill pill--${pct >= 100 ? 'good' : pct > 60 ? 'high' : pct > 30 ? 'mid' : 'low'}${cls ? ' ' + cls : ''}" style="--p:${pct}%">${pct}%</span>`;
/* заливка полосы прогресса; на 100% становится зеленой */
const barFill = pct => `<i class="bar__fill${pct >= 100 ? ' bar__fill--full' : ''}" style="width:${pct}%"></i>`;
/* процент рядом с полосой; на 100% становится зеленым */
const pctLabel = (pct, cls = '', tag = 'b') => `<${tag} class="pct${pct >= 100 ? ' pct--full' : ''}${cls ? ' ' + cls : ''}">${pct}%</${tag}>`;

function setChapOpen(box, open) {
  box.classList.toggle('chap--open', open);
  box.querySelector('.chap__btn').setAttribute('aria-expanded', String(open));
  box.querySelector('.chap__body').inert = !open;
}

/* наведению нужно настоящее движение мыши: перерисовка или прокрутка ставят под неподвижный курсор новые пункты, и браузер подсвечивал их,
   будто на них навели. Пока у <html> есть .pointer-still, правила наведения выключены (они ограничены :where(:root:not(.pointer-still)));
   класс ставится при загрузке и при каждой перерисовке содержания и снимается первым движением мыши. Касание его никогда не снимает */
let pointerAt = '';
function holdHover() { document.documentElement.classList.add('pointer-still'); }
document.addEventListener('pointermove', e => {
  if (e.pointerType !== 'mouse') return;
  const at = e.clientX + ',' + e.clientY;
  if (at === pointerAt) return; /* собственное движение браузера после изменения раскладки, с теми же координатами */
  pointerAt = at;
  document.documentElement.classList.remove('pointer-still');
});

function renderToc() {
  holdHover();
  const q = $('#search').value.trim().toLowerCase();
  const filtering = !!(q || levelFilter);
  if (isAbout(route)) $('#infoBtn').setAttribute('aria-current', 'page'); else $('#infoBtn').removeAttribute('aria-current');
  if (route === 'contents') $('#tocContents').setAttribute('aria-current', 'page'); else $('#tocContents').removeAttribute('aria-current');
  document.querySelectorAll('.page-link').forEach(b => b.toggleAttribute('aria-current', b.dataset.go === 'about' ? isAbout(route) : route === b.dataset.go));
  renderLevelProgress();
  fillLevelChips();
  const list = $('#tocList'); list.innerHTML = '';
  let shown = 0;
  CHAPTERS.forEach(ch => {
    const match = ch.topics.filter(t => (!levelFilter || t.level === levelFilter) &&
      (!q || (t.title + ' ' + t.sub + ' ' + ch.title).toLowerCase().includes(q)));
    if (filtering && !match.length) return;
    const open = q ? true : ch.id === openChap;
    /* раздел, открытый переходом, сначала рисуется закрытым, затем раскрывается в следующем кадре */
    const animateIn = open && justToggled === ch.id;
    /* раздел открытой страницы (сам раздел или одна из его тем); тема, открытая из «Избранного», отмечается только в том списке */
    const current = !viaBookmarks && (route === 'ch-' + ch.id || (topicById[route] && topicById[route].ch === ch));
    const box = el('div', current ? 'chap chap--current' : 'chap');
    const cb = el('button', 'chap__btn'); cb.type = 'button';
    if (current) cb.setAttribute('aria-current', 'location');
    /* плашка считает только выбранный уровень и появляется, когда начата тема этого уровня
       (если начата только на другом уровне, она показывала непонятные 0%) */
    const cs = chapterStats(ch, levelFilter);
    const lv = [...new Set(ch.topics.map(t => t.level))].sort();
    cb.innerHTML = `<span class="chap__num">${ch.n}</span><span>${esc(ch.title)}<small class="chap__meta">${ch.topics.length} ${plural(ch.topics.length, 'тема', 'темы', 'тем')}</small>` +
      `<span class="chap__levels" aria-label="Уровни">${lv.map(l => `<span class="lvl-tag lvl-tag--sm" title="${LEVELS[l]}">${l}</span>`).join('')}</span></span>` +
      `<span class="chap__end">${cs.tried ? pill(cs.pct) : ''}` +
      '<span class="chap__arrow" aria-hidden="true"><svg class="chap__arrow-icon" viewBox="0 0 12 12" width="12" height="12"><path d="M4 2.5 7.5 6 4 9.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span></span>';
    /* название раздела только раскрывает и сворачивает его; страница раздела открывается из «Обзора всего раздела» внутри */
    cb.addEventListener('click', () => {
      if (box.classList.contains('chap--open')) { setChapOpen(box, false); if (!q) setOpenChap(null); }
      else if (q) setChapOpen(box, true);
      else { justToggled = ch.id; setOpenChap(ch.id); renderToc(); }
    });
    box.append(cb);
    if (levelFilter && !q && match.length < ch.topics.length) {
      const note = el('small', 'chap__meta', `${match.length} из ${ch.topics.length} ${plural(ch.topics.length, 'темы', 'тем', 'тем')} уровня ${levelFilter}`);
      cb.querySelector('.chap__meta').after(note);
    }
    /* тело рисуется всегда, чтобы анимировать раскрытие и закрытие */
    const body = el('div', 'chap__body');
    const clip = el('div', 'chap__clip');
    const sub = el('div', 'chap__topics');
    const ov = el('button', 'topic-btn topic-btn--overview chap__topic'); ov.type = 'button';
    ov.innerHTML = `<span>Обзор всего раздела</span>${arrowHtml('next', 'topic-btn__arrow')}`;
    if (route === 'ch-' + ch.id) ov.setAttribute('aria-current', 'page');
    ov.addEventListener('click', () => go('ch-' + ch.id));
    sub.append(ov);
    (filtering ? match : ch.topics).forEach(t => { const b = topicButton(t); b.classList.add('chap__topic'); sub.append(b); });
    clip.append(sub); body.append(clip); box.append(body);
    setChapOpen(box, open && !animateIn);
    if (animateIn) requestAnimationFrame(() => requestAnimationFrame(() => setChapOpen(box, true)));
    shown++;
    list.append(box);
  });
  justToggled = null;
  $('#tocToggle .toc__label').textContent = levelFilter ? `Разделы уровня ${levelFilter}` : 'Разделы тренажера';
  $('#tocCount').textContent = shown || '';
  syncTocFold();
  if (!shown) list.innerHTML = '<p class="toc__empty">Ничего не нашлось. Попробуйте «past», «артикль» или снимите фильтр уровня.</p>';
  renderBookmarks();
  renderNotes();
}

/* ленточка избранного; cls добавляет класс элемента того места, где она стоит */
const bmIcon = (cls = '') => `<svg class="bm-icon${cls ? ' ' + cls : ''}" viewBox="0 0 11 14" aria-hidden="true"><path d="M1 1.5A1 1 0 0 1 2 .5h7a1 1 0 0 1 1 1V13L5.5 10 1 13z" fill="currentColor"/></svg>`;

function topicButton(t, fromBookmarks = false) {
  const b = el('button', fromBookmarks ? 'topic-btn bookmarks__topic' : 'topic-btn'); b.type = 'button';
  /* открытая тема подсвечивается только в том списке, из которого ее открыли: «Избранное» или список содержания */
  if (t.id === route && fromBookmarks === viaBookmarks) b.setAttribute('aria-current', 'page');
  const st = topicStats(t);
  b.innerHTML = `<span>${esc(t.title)}${bookmarks[t.id] ? bmIcon('topic-btn__bm') : ''}<small class="topic-btn__meta">${t.num} · ${t.level}${studied[t.id] ? ' · <span class="topic-btn__studied">правило ✓</span>' : ''}</small></span>` +
    (st.tried ? pill(st.pct, 'topic-btn__pill') : '');
  if (bookmarks[t.id]) b.title = 'В избранном';
  b.addEventListener('click', () => go(t.id, true, true, fromBookmarks));
  return b;
}

/* «Избранное»: темы в избранном в порядке книги, независимо от фильтра уровня и поиска меню;
   свои чипы уровней (только уровни, где есть избранное, gk2-bm-level) сужают список. Становится золотым, пока открытая тема пришла из этого списка. */
let bmLevel = store.get('gk2-bm-level', '');
function bookmarksBox() {

/* номера страниц в `nav` (скрыт, если страница одна); `pick(k)` открывает страницу k. Стрелки — только где есть куда идти;
   при многих страницах: первая, последняя, текущая с соседями и «…» на месте пропусков (1 … 4 5 6 … 100),
   у края — пять подряд (1 2 3 4 5 … 100) */
function fillPaging(nav, page, count, pick) {
  nav.replaceChildren();
  nav.hidden = count < 2;
  if (count < 2) return;
  const pageBtn = (k, html, label) => {
    const b = el('button', 'paging__btn'); b.type = 'button'; b.innerHTML = html;
    if (label) b.setAttribute('aria-label', label);
    if (k === page && !label) b.setAttribute('aria-current', 'page');
    b.addEventListener('click', () => pick(k));
    nav.append(b);
  };
  if (page > 0) pageBtn(page - 1, arrowHtml('prev'), 'Предыдущая страница');
  const nums = new Set(count <= 7 ? [...Array(count).keys()] : [0, count - 1, page - 1, page, page + 1]);
  if (count > 7 && page <= 3) [1, 2, 3, 4].forEach(k => nums.add(k));
  if (count > 7 && page >= count - 4) [2, 3, 4, 5].forEach(k => nums.add(count - k));
  let prev = -1;
  [...nums].filter(k => k >= 0 && k < count).sort((x, y) => x - y).forEach(k => {
    if (k - prev === 2) pageBtn(prev + 1, String(prev + 2)); /* пропуск в одну страницу показывает эту страницу, а не «…» */
    else if (k - prev > 2) nav.append(el('span', 'paging__gap', '…'));
    pageBtn(k, String(k + 1)); prev = k;
  });
  if (page < count - 1) pageBtn(page + 1, arrowHtml('next'), 'Следующая страница');
}

/* ---------- Резервная копия: все, что приложение хранит в localStorage (gk2-*), одним JSON-файлом ---------- */
/* fileMsg: последний результат под кнопками, [вид, текст]; хранится здесь, потому что блок перерисовывается */
const BACKUP_APP = 'grammar-online';
/* сообщение об успехе исчезает через 15 секунд; новое сохранение за это время только обновляет его и снова начинает 15 секунд */
let fileMsg = null, fileMsgTimer;
function showFileMsg(kind, text) {

/* ключи удаленных функций: убираются из этого браузера, из новых копий и при загрузке старых */
const OLD_KEYS = ['gk2-redo', 'gk2-toc-follow'];
try { OLD_KEYS.forEach(k => localStorage.removeItem(k)); } catch (e) {}
function backupKeys() {
  const keys = [];
  try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k.startsWith('gk2-') && !OLD_KEYS.includes(k)) keys.push(k); } } catch (e) {}
  return keys.sort();
}
function backupObject(now) {
  const data = {};
  backupKeys().forEach(k => { data[k] = store.get(k, null); });
  return { app: BACKUP_APP, version: 1, saved: now.toISOString(), data };
}
const isBackup = b => !!b && b.app === BACKUP_APP && !!b.data && typeof b.data === 'object' && !Array.isArray(b.data)
  && Object.keys(b.data).every(k => k.startsWith('gk2-'));
function exportBackup() {
  const now = new Date();
  const json = JSON.stringify(backupObject(now), null, 1);
  const a = el('a');
  a.href = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
  const d = n => String(n).padStart(2, '0');
  a.download = `grammar-progress-${now.getFullYear()}-${d(now.getMonth() + 1)}-${d(now.getDate())}-${d(now.getHours())}${d(now.getMinutes())}.json`;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  showFileMsg('ok', `Прогресс по грамматике успешно сохранен в файл «${a.download}». Файл сохранен в папку загрузок.`);
}
/* «Сохранить» нажата больше 3 раз за 2 секунды: каждое нажатие скачивает еще один файл, поэтому кнопка блокируется
   с предупреждением и отсчетом до 0 — 7 секунд первые два раза, 30 секунд потом. Число предупреждений
   забывается после спокойной минуты. Блокировка хранится в localStorage, поэтому перезагрузка страницы ее не снимает
   (ключ без префикса gk2-: он не попадает в копии). */
const SAVE_LOCKS = [7, 7, 30], SAVE_KEY = 'gk-save-lock';

let { until: saveUntil = 0, total: saveTotal = 0, strikes: saveStrikes = 0 } = store.get(SAVE_KEY, {}) || {};
/* неразрывный пробел держит число вместе со словом */
const seconds = n => `${n} ${plural(n, 'секунду', 'секунды', 'секунд')}`;
const saveLocked = () => Date.now() < saveUntil;
function saveWarning(n) {
  return (saveTotal > SAVE_LOCKS[0]
      ? `Вы снова нажимаете «Сохранить» слишком часто, поэтому кнопка выключена на ${seconds(saveTotal)}.`
      : 'Пожалуйста, не нажимайте «Сохранить» так часто: каждое нажатие скачивает еще один файл.'
        + (saveStrikes === SAVE_LOCKS.length - 1 ? ` Если это повторится, кнопка выключится на ${seconds(SAVE_LOCKS.at(-1))}.` : ''))
    + ` Кнопка снова заработает через ${seconds(n)}.`;
}
function saveClicked() {
  const now = Date.now();
  if (now < saveUntil) return;
  saveClicks = saveClicks.filter(t => now - t < 2000).concat(now);
  if (saveClicks.length <= 3) return exportBackup();
  saveClicks = [];
  if (now - saveUntil > 60000) saveStrikes = 0;
  saveTotal = SAVE_LOCKS[Math.min(saveStrikes, SAVE_LOCKS.length - 1)];
  saveStrikes++;
  saveUntil = now + saveTotal * 1000;
  store.set(SAVE_KEY, { until: saveUntil, total: saveTotal, strikes: saveStrikes });
  showFileMsg('bad', saveWarning(saveTotal));
  runSaveLock();
}
/* отсчет: меняется только текст, блок не пересобирается каждую секунду; на 0 кнопка возвращается */
function runSaveLock() {
  clearInterval(saveTick);
  saveShown = null;
  const tick = () => {
    const left = Math.max(0, Math.ceil((saveUntil - Date.now()) / 1000));
    if (left === saveShown) return;
    saveShown = left;
    fileMsg = ['bad', saveWarning(left)];
    document.querySelectorAll('.overall__file .overall__note').forEach(n => { n.textContent = fileMsg[1]; });
    if (left > 0) return;
    clearInterval(saveTick);
    setTimeout(() => { if (fileMsg && fileMsg[0] === 'bad') fileMsg = null; renderFold('prog'); }, 400);
  };
  tick();
  saveTick = setInterval(tick, 200);
}
if (saveLocked()) runSaveLock();
/* что хранит копия: изученные правила, выполненные упражнения без ошибок и с ошибками, избранное (темы, известные этой версии) и заметки */
function backupSummary(data) {

  let ex = 0, perfect = 0, wrong = 0;
  ids(data['gk2-progress']).forEach(id => {

const EX_TOTAL = TOPICS.reduce((n, t) => n + t.ex.length, 0);
/* копия, прочитанная из файла: ее данные и время сохранения или null, если файл не наш */
function readBackup(file) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onerror = () => resolve(null);
    reader.onload = () => {
      let b;
      try { b = JSON.parse(reader.result); } catch (e) { b = null; }
      resolve(isBackup(b) ? b : null);
    };
    reader.readAsText(file);
  });
}
/* «Отправить ссылкой»: та же копия, упакованная в сам адрес (#restore=…, deflate + base64url), поэтому файл не нужен.
   Открытие такой ссылки показывает окно импорта с этим прогрессом; данные сразу убираются из адресной строки. */
const LINK_KEY = 'restore=';
async function packLink(text) {
  const bytes = new Uint8Array(await new Response(new Blob([text]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer());
  let s = '';
  bytes.forEach(c => { s += String.fromCharCode(c); });
  return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
async function unpackLink(code) {
  const bytes = Uint8Array.from(atob(code.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
  return new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
}
async function shareLink() {
  let url;
  try { url = location.href.split('#')[0] + '#' + LINK_KEY + await packLink(JSON.stringify(backupObject(new Date()))) + '&theme=' + document.documentElement.dataset.theme; }
  catch (e) { return showFileMsg('bad', 'Этот браузер не умеет создавать ссылку. Сохраните прогресс в файл.'); }
  showLinkBox(url);
}
/* ссылка спрятана за словами «Прогресс по грамматике» (длинный адрес никогда не показывается); «Копировать» кладет ее
   в буфер обмена ссылкой с этим текстом плюс голый адрес для мест, которые принимают только простой текст */
const LINK_TEXT = 'Прогресс по грамматике';
function showLinkBox(url) {
  /* системное меню «Поделиться»; с локального файла не показываем: Яндекс Браузер на file:// роняет вкладку */
  const canShare = !!navigator.share && location.protocol !== 'file:';
  const d = el('dialog', 'modal');
  d.setAttribute('aria-labelledby', 'linkTitle');
  d.innerHTML = `<div class="modal__body">
    <h2 class="modal__title" id="linkTitle">Ссылка на ваш прогресс</h2>
    <p class="modal__text">Отправьте ссылку куда удобно: мессенджер, почта, заметки. Откройте ее на другом устройстве, чтобы загрузить текущий прогресс.</p>
    <div class="modal__share-box">
      <span class="modal__share">${LINK_TEXT}</span>
      <div class="modal__copied" role="status"><div class="modal__copied-clip"><span class="modal__copied-text"></span></div></div>
    </div>
    <div class="modal__foot${canShare ? ' modal__foot--three' : ''}">
      <button class="btn btn--primary" type="button" data-act="copy">Копировать</button>
      ${canShare ? '<button class="btn" type="button" data-act="share">Поделиться</button>' : ''}
      <button class="btn modal__close" type="button" data-act="cancel">Закрыть</button>
    </div>
  </div>`;
  const close = () => { clearTimeout(doneTimer); d.close(); d.remove(); };
  async function copy() {
    const html = `<a href="${esc(url)}">${LINK_TEXT}</a>`;
    try {
      /* браузер, который не разрешает и не запрещает (нет ответа на запрос разрешения), через секунду получает запасной способ */
      await Promise.race([
        navigator.clipboard.write([new ClipboardItem({ 'text/html': new Blob([html], { type: 'text/html' }), 'text/plain': new Blob([url], { type: 'text/plain' }) })]),
        new Promise((_, fail) => setTimeout(fail, 1000))]);
      return true;
    } catch (e) {}
    /* старые браузеры: команда копирования, а нашу ссылку кладет в буфер событие copy */
    const put = e => { e.clipboardData.setData('text/html', html); e.clipboardData.setData('text/plain', url); e.preventDefault(); };
    document.addEventListener('copy', put);
    try { return document.execCommand('copy'); } catch (e) { return false; } finally { document.removeEventListener('copy', put); }
  }
  /* «Ссылка скопирована» выезжает, и карточка на 3 секунды становится зеленой. Пока сообщение еще видно, новый клик только
     перезапускает 3 секунды — выезд играет, только когда сообщения нет */
  let doneTimer;

    const box = $('.modal__copied', d), share = $('.modal__share', d);
    clearTimeout(doneTimer);
    $('.modal__copied-text', d).textContent = text;
    box.classList.toggle('modal__copied--bad', !ok);
    box.classList.add('modal__copied--show');
    share.classList.toggle('modal__share--copied', ok);
    if (ok) doneTimer = setTimeout(() => { box.classList.remove('modal__copied--show'); share.classList.remove('modal__share--copied'); }, 3000);
  }
  d.addEventListener('click', async e => {
    if (e.target === d) return close();
    const act = e.target.closest('[data-act]')?.dataset.act;
    if (act === 'cancel') close();
    else if (act === 'copy') {
      if (await copy()) say('Ссылка скопирована', true);
      else say('Не получилось скопировать: браузер не дал доступ к буферу обмена. Разрешите его и попробуйте еще раз.', false);
    } else if (act === 'share') {
      /* AbortError — пользователь сам закрыл меню, это не ошибка */
      try { await navigator.share({ title: LINK_TEXT, url }); }
      catch (err) { if (err.name !== 'AbortError') say('Не получилось открыть меню «Поделиться». Скопируйте ссылку кнопкой «Копировать».', false); }
    }
  });
  d.addEventListener('cancel', e => { e.preventDefault(); close(); });
  document.body.append(d);
  d.showModal();
  $('[data-act=copy]', d).focus();
}
async function openLink(hash) {

/* «Загрузить» сразу открывает это окно: сначала красное предупреждение о перезаписи,

  /* ошибка исчезает через 15 секунд, как сообщение после сохранения; новая ошибка за это время только

    }
    const when = backup.saved && !isNaN(new Date(backup.saved)) ? new Date(backup.saved).toLocaleString('ru-RU', { dateStyle: 'long', timeStyle: 'short' }) : '';
    const sum = backupSummary(backup.data);
    box.innerHTML = `<p class="modal__name"><b>${name === null ? 'Прогресс из ссылки' : esc(name)}</b>${when ? `<span>сохранен ${esc(when)}</span>` : ''}</p>
      <div class="modal__stats">${row('Правил изучено', `${sum.studied} из ${TOPICS.length}`)}${row('Выполнено упражнений', `${sum.ex} из ${EX_TOTAL}`)}${sum.ex ? row('Без ошибок', sum.perfect) : ''}${sum.wrong ? row('С ошибками', sum.wrong) : ''}${row('«Избранное»', sum.bm)}${row('Заметки', sum.notes)}</div>`;
  }
  async function choose(file) { if (file) show(await readBackup(file), file.name); }
  input.addEventListener('change', () => { const f = input.files[0]; input.value = ''; choose(f); });
  d.addEventListener('click', e => {
    if (e.target === d) return close(); /* затемненный фон */
    const btn = e.target.closest('[data-act]');
    const act = btn && btn.dataset.act;
    if (act === 'cancel') close();
    else if (act === 'pick') input.click();
    else if (act === 'ok' && backup) {
      try {
        backupKeys().forEach(k => localStorage.removeItem(k));
        Object.entries(backup.data).forEach(([k, v]) => { if (v !== null && !OLD_KEYS.includes(k)) localStorage.setItem(k, JSON.stringify(v)); });
      } catch (err) { showError('Браузер не дал сохранить данные.'); return; }
      location.reload();
    }
  });
  d.addEventListener('cancel', e => { e.preventDefault(); close(); });
  /* ссылка приносит свои данные: выбора и перетаскивания файла там нет — у файлов свое окно («Загрузить») */
  const drop = $('.modal__drop', d);
  if (drop) {
    drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('modal__drop--over'); });
    drop.addEventListener('dragleave', e => { if (!drop.contains(e.relatedTarget)) drop.classList.remove('modal__drop--over'); });
    drop.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('modal__drop--over'); choose(e.dataTransfer.files[0]); });
  }
  document.body.append(d);
  d.showModal();
  if (fromLink) show(fromLink.backup, null);
  $(fromLink ? (fromLink.backup ? '[data-act=ok]' : '[data-act=cancel]') : '[data-act=pick]', d).focus();
}

function plural(n, one, few, many) {
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return one;
  if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
  return many;
}

/* ---------- Прогресс страницы: вся книга в «Содержании», текущий раздел на остальных ---------- */
function progressBlock(ch, curLevel) {
  const box = el('div', 'page-prog'); box.id = 'pageProg';
  box.dataset.scope = ch ? ch.id : '';
  box.dataset.level = curLevel || '';
  fillProgress(box);
  return box;
}
function fillProgress(box) {
  const ch = box.dataset.scope ? CHAPTERS.find(c => c.id === box.dataset.scope) : null;
  const topics = ch ? ch.topics : TOPICS;
  let s = 0, tot = 0, done = 0, exn = 0;
  topics.forEach(t => {
    const st = topicStats(t); s += st.s; tot += st.tot;
    t.ex.forEach((e, i) => { exn++; if (progress[t.id] && progress[t.id][i]) done++; });
  });
  /* вся книга: та же цифра, что в меню; раздел — баллы его тем (включая изученные правила) */
  const pct = ch ? pctOf(s, tot) : bookProgress().pct;
  /* разбивка по уровням, если охват больше одного уровня; уровень открытой темы залит */
  const levels = Object.keys(LEVELS).filter(l => topics.some(t => t.level === l));
  const rows = levels.length > 1 ? levels.map(l => {
    let ls = 0, lt = 0;
    topics.filter(t => t.level === l).forEach(t => { const st = topicStats(t); ls += st.s; lt += st.tot; });
    const p = pctOf(ls, lt);
    return `<div class="page-prog__level" title="${LEVELS[l]}"><span class="lvl-tag page-prog__tag${l === box.dataset.level ? ' lvl-tag--filled' : ''}">${l}</span><span class="bar bar--thin">${barFill(p)}</span>${pctLabel(p, 'page-prog__value')}</div>`;
  }).join('') : '';
  box.innerHTML = `<div class="page-prog__row"><span>${ch ? `Раздел ${ch.n} пройден на` : 'Тренажер пройден на'}</span>${pctLabel(pct, 'page-prog__value')}</div>
    <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}">${barFill(pct)}</div>
    <div class="page-prog__row"><span>Упражнений выполнено</span><b class="page-prog__value">${done} из ${exn}</b></div>` +
    (rows ? `<div class="page-prog__levels" aria-label="Прогресс по уровням">${rows}</div>` : '');
}

/* ---------- Страницы ---------- */
function crumbs(parts) {
  const c = el('div', 'crumbs');
  parts.forEach((p, i) => {
    if (i) { const s = el('span', 'crumbs__sep', '→'); s.setAttribute('aria-hidden', 'true'); c.append(s); }
    if (typeof p === 'string') c.append(el('span', null, p));
    else { const b = el('button', 'crumbs__link', p.label); b.type = 'button'; b.addEventListener('click', () => go(p.to)); c.append(b); }
  });
  return c;
}

/* что не так с упражнением: ошибки и пропуски из последней проверки */
function mistakeSummary(t, i, r) {
  const score = `<span class="mistakes__score">${r[0]} из ${r[1]}</span>`;
  const m = answers[t.id] && answers[t.id][i] && answers[t.id][i].m;
  if (!m) return score; /* проверено до того, как стали хранить номера пунктов */
  /* «ошибки в № 3, 5, 7», «не заполнены № 8–10»; в упражнении с текстом пункты — это пропуски */
  const gaps = t.ex[i].type === 'text';
  const [w, b] = m, parts = [];
  if (w.length) parts.push(`<span class="mistakes__score">${w.length > 1 ? 'ошибки' : 'ошибка'} в ${gaps ? (w.length > 1 ? 'пропусках ' : 'пропуске ') : '№ '}${numList(w)}</span>`);
  if (b.length) parts.push(`<span class="mistakes__note">${b.length > 1 ? 'не заполнены' : 'не заполнен'} ${gaps ? (b.length > 1 ? 'пропуски ' : 'пропуск ') : '№ '}${numList(b)}</span>`);
  return parts.join(' · ') || score;
}
/* 1, 2, 3, 5, 8, 9 → «1–3, 5, 8, 9»; подряд от трех и больше становятся диапазоном */
function numList(nums) {
  const out = [];
  for (let k = 0; k < nums.length;) {
    let e = k; while (e + 1 < nums.length && nums[e + 1] === nums[e] + 1) e++;
    if (e - k >= 2) out.push(`${nums[k]}–${nums[e]}`); else for (let j = k; j <= e; j++) out.push(nums[j]);
    k = e + 1;
  }
  return out.join(', ');
}

const aboutPage = id => ABOUT.find(p => 'about-' + p.id === id);
const isAbout = id => id === 'about' || !!aboutPage(id);

const ABOUT_FOLD = 347, FADE_WORDS = 3, aboutNarrow = matchMedia('(max-width: 998px)');
let aboutOpen = false; /* хранится только пока открыта страница */
aboutNarrow.addEventListener('change', () => { if (route === 'about') go('about', false, false); });
function renderAboutPage(wrap) {
  wrap.append(el('h1', 'sheet__title', 'Информация'));
  const mail = el('a', 'sheet__link', 'pegasusgamesru@gmail.com');
  mail.href = 'mailto:pegasusgamesru@gmail.com';
  const contact = el('p', 'sheet__intro sheet__intro--contact', 'Если у вас есть замечания или пожелания, можете направить их на почту: ');
  contact.append(mail);
  /* статичный текст с метками <b>, поэтому innerHTML здесь безопасен */
  const para = html => { const p = el('p', 'sheet__intro'); p.innerHTML = html; return p; };
  const paras = [
    '«Грамматика онлайн» — некоммерческий и независимый проект. Идея его создания появилась во время занятий по книге Ю. Б. Голицынского «Грамматика. Сборник упражнений».',
    'Работать с бумажным сборником не всегда удобно: ответы нужно сверять вручную, из-за чего легко пропустить ошибку, да и сам учебник не самый мобильный предмет. Хотелось сразу видеть, где допущена ошибка, и в любой момент быстро возвращаться к сложной/интересной теме. Поиски бесплатных тренажеров со схожим подходом не привели к удовлетворительному результату (возможно, я плохо искал), поэтому и возникла идея создать его самостоятельно.',
    'За основу взята <b>только структура сборника</b>: разделы и темы расположены в той же последовательности. При этом все правила, примеры и упражнения написаны заново и <b>не дублируют текст книги</b>, а также добавлен дополнительный раздел (№19). Тренажер не является электронной версией какого-либо издания книги — это самостоятельная разработка, созданная по ее мотивам.',
    'В тренажере нет регистрации, платных разделов или ограничений по функционалу — весь функционал доступен сразу, без каких-либо условий. Если тренажер вам понравился, вы можете выразить благодарность автору, нажав кнопку <b class="sheet__donate">«Поддержать автора»</b> внизу меню.'];
  /* уже 999px текст сворачивается после ABOUT_FOLD символов, как длинная заметка */
  const intro = el('div', 'info-intro');
  const fill = () => {
    const ps = paras.map(para);
    const more = el('button', 'overall__more-btn', aboutOpen ? 'Скрыть' : 'Показать еще'); more.type = 'button';
    more.setAttribute('aria-expanded', String(aboutOpen));
    more.addEventListener('click', () => { aboutOpen = !aboutOpen; fill(); $('.overall__more-btn', intro).focus({ preventScroll: aboutOpen }); });
    if (!aboutNarrow.matches) { intro.replaceChildren(...ps); return; }
    if (aboutOpen) { ps.at(-1).append(' ', more); intro.replaceChildren(...ps); return; }
    let left = ABOUT_FOLD;
    const shown = [];
    for (const p of ps) {
      shown.push(p);
      if (p.textContent.length < left) { left -= p.textContent.length; continue; }
      /* текст до предела с обрывом по слову; его последние FADE_WORDS слов угасают перед кнопкой («Хотелось сразу видеть,») */
      const full = p.textContent, head = full.slice(0, left).replace(/\s+\S*$/, '');
      const words = head.split(/(\s+)/), k = Math.max(0, words.length - 2 * FADE_WORDS + 1);
      const plain = words.slice(0, k).join(''), fade = words.slice(k).join('');
      fadeTokens = words.slice(k);
      restTokens = full.slice(head.length).split(/(\s+)/).filter(Boolean);
      const row = el('span', 'overall__fade-row');
      row.append(el('span', 'overall__fade', fade), ' ', more);
      p.replaceChildren(plain, row); break;
    }
    intro.replaceChildren(...shown);
    fitFade();
  };
  /* угасающие слова и скрытый текст после них, словами и пробелами */
  let fadeTokens = [], restTokens = [];
  /* угасают только слова на строке кнопки: те, что перенос оставил на строке выше, остаются обычным текстом;
     если на строке кнопки меньше FADE_WORDS слов, к ней добавляются следующие слова скрытого текста */
  const fitFade = () => {
    const fade = $('.overall__fade', intro);
    if (!fade || !intro.isConnected) return;
    const row = fade.parentNode, btn = $('.overall__more-btn', row);
    const tokens = fadeTokens.slice();
    let words, i, extra = 0;
    const lay = () => {
      while (row.firstChild !== btn) row.firstChild.remove(); /* кнопка остается на месте, поэтому сохраняет фокус */
      words = tokens.map(w => el('span', '', w));
      btn.before(...words, ' ');
      const r = btn.getBoundingClientRect(), y = (r.top + r.bottom) / 2;
      i = words.findIndex(w => { const q = w.getBoundingClientRect(); return q.top <= y && q.bottom >= y; });
      if (i < 0) i = words.length;
    };
    const onLine = () => words.slice(i).filter(w => /\S/.test(w.textContent)).length;
    lay();
    /* на узкой строке кнопка может снова и снова переноситься: добавляется не больше шести слов, и побеждает попытка с наибольшим числом слов у кнопки */
    let best = [onLine(), 0];
    while (best[0] < FADE_WORDS && extra < Math.min(restTokens.length, 12)) {
      tokens.push(...restTokens.slice(extra, extra + 2)); extra += 2; /* пробел и слово */
      lay();
      if (onLine() > best[0]) best = [onLine(), extra];
    }
    if (extra !== best[1]) { tokens.length = fadeTokens.length + best[1]; lay(); }
    const text = ws => ws.map(w => w.textContent).join('');
    words.forEach(w => w.remove());
    btn.previousSibling.before(text(words.slice(0, i)), el('span', 'overall__fade', text(words.slice(i))));
  };
  new ResizeObserver(fitFade).observe(intro);
  fill();
  wrap.append(intro, el('div', 'sheet__section sheet__section--about', 'Как устроен тренажер'));
  const ol = el('ol', 'contents contents--about');
  ABOUT.forEach((p, i) => {
    const li = el('li', 'contents__item'); const b = el('button', 'contents__row'); b.type = 'button';
    b.innerHTML = `<span class="contents__num">${i + 1}</span><span class="contents__title">${esc(p.title)}</span><span class="contents__meta">${esc(p.sub)}</span>`;
    b.addEventListener('click', () => go('about-' + p.id));
    li.append(b); ol.append(li);
  });
  wrap.append(ol, contact);
}

function renderMistakesPage(wrap) {
  /* без хлебных крошек: страница открывается из «Прогресса», а не из «Содержания» */
  wrap.append(el('h1', 'sheet__title', 'Работа над ошибками'));
  const all = mistakes();
  const level = mistakesFilter();
  const list = level ? all.filter(m => m.t.level === level) : all;
  const exCount = ms => ms.reduce((n, m) => n + m.exs.length, 0);
  const count = exCount(list);
  /* с ошибками: только примечание о том, как меняется список; без ошибок — что здесь появится */
  const p = count
    ? el('p', 'sheet__intro', 'Задание исчезнет из списка, если вы выполните его без ошибок либо нажмете кнопку «Заново». Оно снова появится, если при следующей проверке будут ошибки или незаполненные данные.')
    : el('p', 'sheet__intro', 'Здесь появятся упражнения, в которых при проверке были ошибки или незаполненные строки.');
  wrap.append(p);
  if (!count) { wrap.append(el('p', 'mistakes__empty', 'Сейчас таких упражнений нет.')); return; }
  const tools = el('div', 'mistakes__tools');
  /* фильтр уровня: только уровни с ошибками, у каждого число упражнений; при одном уровне не нужен */
  const levels = Object.keys(LEVELS).filter(l => all.some(m => m.t.level === l));
  if (levels.length > 1) {
    const bar = el('div', 'mistakes__levels'); bar.setAttribute('role', 'group'); bar.setAttribute('aria-label', 'Уровень сложности');
    [['', 'Все', exCount(all)], ...levels.map(l => [l, l, exCount(all.filter(m => m.t.level === l))])].forEach(([v, label, n]) => {
      const b = el('button', 'mistakes__level'); b.type = 'button';
      b.innerHTML = `${label}<span class="mistakes__level-count">${n}</span>`;
      if (v) b.title = LEVELS[v];
      b.setAttribute('aria-pressed', String(v === level));
      b.addEventListener('click', () => { mistakesLevel = v; mistakesPage = 0; store.set('gk2-mistakes-level', v); go('mistakes', false); });
      bar.append(b);
    });
    tools.append(bar);
  }
  /* первое упражнение (отфильтрованного) списка; «Следующее» под каждым упражнением дальше ведет по остальным в пределах того же
     фильтра уровня, поэтому подпись его называет. При одном упражнении идти не по чему: кнопка выключена */
  const start = el('button', 'mistakes__start'); start.type = 'button';
  start.innerHTML = `Начать по порядку: ${level ? 'уровень ' + level : 'все уровни'} ${arrowHtml('next')}`;
  start.disabled = count < 2;
  start.addEventListener('click', () => openExercise(list[0].t.id, list[0].exs[0][0]));
  tools.append(start);
  wrap.append(tools);
  /* в столбик, когда кнопку выталкивает из ряда чипов: замер без класса, затем класс возвращается, если нужно */
  new ResizeObserver(() => {
    tools.classList.remove('mistakes__tools--stacked');
    tools.classList.toggle('mistakes__tools--stacked', !!tools.firstChild && start.offsetTop > tools.firstChild.offsetTop + 4);
  }).observe(tools);
  const ol = el('ol', 'mistakes');
  /* MISTAKES_PAGE тем на странице; страница хранится, пока сайт открыт, поэтому «К работе над ошибками» возвращает на нее */
  const pageCount = Math.ceil(list.length / MISTAKES_PAGE);
  mistakesPage = Math.min(mistakesPage, Math.max(0, pageCount - 1));
  list.slice(mistakesPage * MISTAKES_PAGE, (mistakesPage + 1) * MISTAKES_PAGE).forEach(({ t, exs }) => {
    const li = el('li', 'mistakes__item');
    const head = el('div', 'mistakes__head');
    const title = el('button', 'mistakes__title', t.title); title.type = 'button';
    title.insertAdjacentHTML('beforeend', `<span class="lvl-tag" title="${LEVELS[t.level]}">${t.level}</span>`);
    title.addEventListener('click', () => go(t.id));
    head.append(el('span', 'mistakes__num', t.num), title);
    head.insertAdjacentHTML('beforeend', `<span class="mistakes__chapter">Раздел ${t.ch.n} · ${esc(t.ch.title)}</span>`);
    const chips = el('div', 'mistakes__exs');
    exs.forEach(([i, r]) => {
      const b = el('button', 'mistakes__ex'); b.type = 'button';
      b.innerHTML = `Упр. ${exNo(t, i)} · ${mistakeSummary(t, i, r)}`;
      b.addEventListener('click', () => openExercise(t.id, i));
      chips.append(b);
    });
    li.append(head, chips); ol.append(li);
  });
  const pages = el('nav', 'paging'); pages.setAttribute('aria-label', 'Страницы списка');
  fillPaging(pages, mistakesPage, pageCount, k => { mistakesPage = k; go('mistakes', false); $('.mistakes__tools').scrollIntoView({ block: 'start' }); });
  wrap.append(ol, pages);
}

  search.placeholder = 'Поиск по заметкам'; search.setAttribute('aria-label', 'Поиск по заметкам'); search.autocomplete = 'off';
  const searchClose = el('button', 'notes-search__close'); searchClose.type = 'button'; searchClose.setAttribute('aria-label', 'Закрыть поиск');
  searchClose.innerHTML = '<svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg>';
  searchBox.append(search, searchClose);
  searchWrap.append(searchOpen, searchBox);
  tools.append(add, searchWrap);
  const ol = el('ol', 'notes-list');
  const none = el('p', 'notes-list__none', 'Ничего не нашлось. Попробуйте другое слово.');
  /* больше NOTES_PAGE заметок (при поиске — найденных) делятся на страницы */
  const pages = el('nav', 'paging'); pages.setAttribute('aria-label', 'Страницы заметок');
  wrap.append(tools, ol, none, pages);
  let page = 0;
  const filter = () => {
    const q = search.value.trim().toLowerCase();
    const shown = [...ol.children].filter(li => !q || li.classList.contains('notes-list__item--edit') || li.note.text.toLowerCase().includes(q));
    const count = Math.ceil(shown.length / NOTES_PAGE);
    page = Math.min(page, Math.max(0, count - 1));
    [...ol.children].forEach(li => { const i = shown.indexOf(li); li.hidden = i < 0 || Math.floor(i / NOTES_PAGE) !== page; });
    none.hidden = !q || shown.length > 0;
    fillPaging(pages, page, count, k => { page = k; filter(); tools.scrollIntoView({ block: 'start' }); });
  };
  search.addEventListener('input', () => { page = 0; filter(); });
  const setSearch = on => { searchWrap.classList.toggle('notes-search--open', on); searchOpen.setAttribute('aria-expanded', String(on)); };
  /* закрытие очищает запрос: свернутый поиск не должен незаметно прятать заметки */
  const closeSearch = focusBtn => {
    if (search.value) { search.value = ''; page = 0; filter(); }
    setSearch(false);
    if (focusBtn) searchOpen.focus();
  };
  searchOpen.addEventListener('click', () => { setSearch(true); search.focus(); });
  searchClose.addEventListener('click', () => closeSearch(true));
  search.addEventListener('keydown', e => { if (e.key === 'Escape') { e.preventDefault(); closeSearch(true); } });
  /* пустое поле сворачивается, когда фокус уходит за его пределы */
  searchBox.addEventListener('focusout', e => { if (!searchBox.contains(e.relatedTarget) && !search.value.trim()) closeSearch(false); });
  const syncAdd = () => {
    const blocked = !!$('.notes-list__item--edit', ol);
    add.disabled = blocked;
    addLabel.textContent = blocked ? 'Сохраните заметку' : 'Новая заметка';
    add.title = blocked ? 'Сохраните изменения в открытой заметке, чтобы создать новую.' : '';
    searchWrap.hidden = !notes.length;
    if (!notes.length) closeSearch(false);
  };
  const btn = (text, mod) => { const b = el('button', 'notes-list__btn' + (mod ? ' notes-list__btn--' + mod : ''), text); b.type = 'button'; return b; };
  function card(n, editing = false) {
    const li = el('li', 'notes-list__item'); li.note = n;
    const foot = el('div', 'notes-list__foot');
    const date = () => el('span', 'notes-list__date', notes.includes(n) ? 'Изменена ' + noteDate(n.at) : 'Новая заметка');
    let open = false; /* длинная заметка показывается свернутой до «Показать еще» */
    const fillText = p => {
      if (n.text.length <= NOTE_FOLD) { p.textContent = n.text; return; }
      const more = el('button', 'overall__more-btn', open ? 'Скрыть' : 'Показать еще'); more.type = 'button';
      more.setAttribute('aria-expanded', String(open));
      more.addEventListener('click', () => { open = !open; fillText(p); $('.overall__more-btn', p).focus(); });
      if (open) { p.replaceChildren(n.text, ' ', more); return; }
      /* свернута, как заметки в «Прогрессе»: текст до предела, его последние слова угасают, затем кнопка */
      const head = n.text.slice(0, NOTE_FOLD).replace(/\s+\S*$/, '');
      const words = head.split(/(\s+)/), k = Math.max(0, words.length - 5);
      const row = el('span', 'overall__fade-row');
      row.append(el('span', 'overall__fade', words.slice(k).join('')), ' ', more);
      p.replaceChildren(words.slice(0, k).join(''), row);
    };
    const view = () => {
      const text = el('p', 'notes-list__text'); fillText(text);
      const edit = btn('Редактировать'), del = btn('Удалить', 'del');
      edit.addEventListener('click', () => { render(true); $('textarea', li).focus(); });
      del.addEventListener('click', ask);
      foot.replaceChildren(date(), edit, del);
      li.replaceChildren(text, foot);
    };
    const editor = () => {
      const area = el('textarea', 'notes-list__field'); area.rows = 3;
      area.setAttribute('aria-label', 'Текст заметки');
      area.placeholder = 'Текст заметки…';
      area.value = n.text;
      const save = btn('Сохранить');
      save.addEventListener('click', () => {
        /* очищенная заметка сохраняет последний текст: заметка уходит только через «Удалить»; новая без текста не сохраняется */
        if (area.value.trim()) {
          n.text = area.value; n.at = Date.now();
          if (!notes.includes(n)) notes.unshift(n);
          saveNotes();
        }
        if (!notes.includes(n)) li.remove(); else render(false);
        syncAdd();
      });
      foot.replaceChildren(date(), save);
      li.replaceChildren(area, foot);
    };
    /* второй шаг «Удалить»: нижняя строка просит подтвердить, «Отмена» возвращает кнопки */
    function ask() {
      const yes = btn('Да, удалить', 'confirm'), no = btn('Отмена');
      yes.addEventListener('click', () => {
        const i = notes.indexOf(n);
        if (i >= 0) { notes.splice(i, 1); saveNotes(); }
        li.remove(); syncAdd(); filter();
      });
      no.addEventListener('click', () => { render(false); $('.notes-list__btn--del', li).focus(); });
      foot.replaceChildren(el('span', 'notes-list__ask', 'Удалить эту заметку?'), yes, no);
      no.focus();
    }
    const render = e => { li.classList.toggle('notes-list__item--edit', e); if (e) editor(); else view(); syncAdd(); };
    render(editing);
    return li;
  }
  add.addEventListener('click', () => {
    const li = card({ id: Date.now().toString(36), text: '', c: Date.now(), at: Date.now() }, true);
    ol.prepend(li); page = 0; syncAdd(); filter(); $('textarea', li).focus();
  });
  ol.append(...notes.map(n => card(n)));
  syncAdd(); filter();
}

function pager(idx, arr, idOf, titleOf, noun) {
  const nav = el('nav', 'pager'); nav.setAttribute('aria-label', 'Соседние страницы');
  const levelsOf = item => item.level ? [item.level] : [...new Set(item.topics.map(x => x.level))].sort();
  const curLv = levelsOf(arr[idx]);
  /* уровень, который есть у соседа и нет у текущей страницы, залит */
  const mk = (item, dir, label) => {
    const b = el('button', 'pager__btn pager__btn--' + dir); b.type = 'button';
    const tags = levelsOf(item).map(l => `<span class="lvl-tag lvl-tag--sm${curLv.includes(l) ? '' : ' lvl-tag--filled'}" title="${LEVELS[l]}">${l}</span>`).join('');
    /* уровни — с внешней стороны подписи: у «Предыдущей» справа, у «Следующей» слева, стрелки остаются по краям */
    const lbl = `<span>${label}</span>`, lv = `<span class="pager__levels">${tags}</span>`;
    b.innerHTML = `<small class="pager__label">${dir === 'next' ? lv + lbl : lbl + lv}</small><span>${esc(titleOf(item))}</span>`;
    b.addEventListener('click', () => go(idOf(item)));
    nav.append(b);
  };
  const prevLabel = `${arrowHtml('prev')} ${noun === 'тема' ? 'Предыдущая тема' : 'Предыдущий раздел'}`;
  const nextLabel = `${noun === 'тема' ? 'Следующая тема' : 'Следующий раздел'} ${arrowHtml('next')}`;
  if (idx > 0) mk(arr[idx - 1], 'prev', prevLabel);
  if (idx < arr.length - 1) mk(arr[idx + 1], 'next', nextLabel);
  const here = el('div', 'pager-current');
  const cur = arr[idx];
  here.innerHTML = `<span>${noun === 'тема' ? 'Текущая тема' : 'Текущий раздел'}</span>` +
    `<span class="pager-current__title">${esc(noun === 'тема' ? titleOf(cur) : `${cur.n}. ${cur.title}`)}</span>` +
    /* «· уровень» и метки — одним блоком: при переносе уходят на новую строку вместе */
    `<span class="pager-current__levels"><span>· ${noun === 'тема' ? 'уровень' : 'уровни'}</span>` +
    curLv.map(l => `<span class="lvl-tag" title="${LEVELS[l]}">${l}</span>`).join('') + '</span>';
  const frag = document.createDocumentFragment(); frag.append(here, nav);
  if (noun === 'тема') { const lv = levelPager(idx, arr, idOf, titleOf); if (lv) frag.append(lv); }
  return frag;
}

/* Компактный ряд под навигацией: ближайшие темы уровня открытой темы назад и вперед, показывается, только когда
   сосед по порядку книги другого уровня (и обычная навигация увела бы читателя с его уровня). */
function levelPager(idx, arr, idOf, titleOf) {
  const level = arr[idx].level;
  const before = arr.slice(0, idx).reverse().find(x => x.level === level);
  const after = arr.slice(idx + 1).find(x => x.level === level);
  const prev = before && before !== arr[idx - 1] ? before : null;
  const next = after && after !== arr[idx + 1] ? after : null;
  if (!prev && !next) return null;
  const box = el('nav', 'pager-level'); box.setAttribute('aria-label', `Темы уровня ${level}`);
  box.innerHTML = `<span class="pager-level__label">Идти только по темам уровня <span class="lvl-tag lvl-tag--sm" title="${LEVELS[level]}">${level}</span></span>`;
  const link = (item, dir) => {
    const b = el('button', 'pager-level__link pager-level__link--' + dir); b.type = 'button';
    b.innerHTML = `<small class="pager-level__dir">${dir === 'prev' ? arrowHtml('prev') + ' Предыдущая' : 'Следующая ' + arrowHtml('next')}</small><span>${esc(titleOf(item))}</span>`;
    b.addEventListener('click', () => go(idOf(item)));
    box.append(b);
  };
  if (prev) link(prev, 'prev');
  if (next) link(next, 'next');
  return box;
}
