const FIELD_MARKS = ['ex__field--ok', 'ex__field--bad', 'ex__field--miss'];
const OPT_MARKS = ['ex__opt--ok', 'ex__opt--bad'];
const LINE_MARKS = ['listen__line--ok', 'listen__line--bad', 'listen__line--miss'];

function makeGap(answers, id, label) {
  const inp = el('input', 'ex__field ex__gap');
  inp.type = 'text'; inp.id = id; inp.autocomplete = 'off'; inp.spellcheck = false;
  inp.setAttribute('autocapitalize', 'off'); inp.setAttribute('aria-label', label);
  const longest = Math.max(...answers.split('|').map(s => s.length));
  inp.style.width = Math.max(4, Math.min(longest + 2, 24)) + 'ch';
  return inp;
}

function fillGaps(container, text, answers, idBase, label) {
  const parts = text.split('___');
  const inputs = [];
  parts.forEach((part, k) => {
    container.append(fmt(part));
    if (k < parts.length - 1) {
      const inp = makeGap(answers[k] || '', `${idBase}-${k}`, `${label}, пропуск ${k + 1}`);
      container.append(inp); inputs.push(inp);
    }
  });
  return inputs;
}

/* «На слух»: запись mp3 из audio/ (tools/make_audio.py), а если ее нет — озвучка браузером (Web Speech API), британский
   голос, если он есть. Каждое предложение — свой плеер: кнопка и полоса прогресса */
const AUDIO = window.AUDIO || {}; /* текст предложения → имя mp3, audio/index.js */
const speech = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
const SPEECH_RATE = 1; /* обычная скорость голоса */
let speaking = null; /* плеер, который сейчас звучит */
const spokenSec = new Map(); /* текст → длительность, измеренная при прослушивании */
/* из нескольких измерений берется наименьшее: событие конца речи браузер присылает с задержкой, и у некоторых голосов
   она растет от раза к разу — если запоминать последнее измерение, полоса с каждым прослушиванием ехала бы медленнее */
const rememberSec = (text, sec) => spokenSec.set(text, Math.min(spokenSec.get(text) ?? Infinity, sec));
function enVoice() {
  const vs = speechSynthesis.getVoices();
  return vs.find(v => /^en[-_]GB/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null;
}
function stopSpeech() {
  const p = speaking; speaking = null;
  if (speech) speechSynthesis.cancel();
  if (p) p.idle();
}
/* буквы фразы: звучат только они, пробелы и знаки препинания времени почти не занимают */
const letters = s => (s.match(/[a-z0-9']/gi) || []).length;
/* длительность оценивается по буквам — около 0,07 с на букву при обычной скорости (так говорят голоса Windows и Android) */
/* измерение по событию конца речи включает задержку браузера, поэтому длиннее оценки оно не берется: полосе лучше
   дойти до конца чуть раньше звука, чем отставать от него */
const speechSec = text => Math.min(.2 + letters(text) * .07 / SPEECH_RATE, spokenSec.get(text) ?? Infinity);
const PLAY_ICON = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3.2v9.6c0 .5.5.8.9.5l7.2-4.8a.6.6 0 0 0 0-1L5.9 2.7c-.4-.3-.9 0-.9.5Z" fill="currentColor"/></svg>';
const STOP_ICON = '<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="4" y="4" width="8" height="8" rx="1.5" fill="currentColor"/></svg>';
function makePlayer(text, label) {
  const box = el('div', 'listen__player');
  const btn = el('button', 'listen__play'); btn.type = 'button';
  const track = el('span', 'bar listen__track'); track.setAttribute('aria-hidden', 'true');
  const fill = el('i', 'listen__fill'); track.append(fill);
  /* полоса едет непрерывно: каждый кадр со скоростью, при которой она подойдет к концу как раз к ожидаемому концу звука.
     dur — ожидаемая длительность (измеренная раньше или оценка); события «началось слово» уточняют ее, поэтому полоса
     может ускориться или замедлиться, но не встает и не прыгает. Событие конца речи браузер присылает с задержкой
     после того, как звук стих, поэтому полоса его не ждет: к концу звука она уже полная. heard — когда, по последнему
     слову, звук кончился; это время запоминается как длительность фразы для следующего прослушивания */
  /* utter — текущий запуск: события запусков, которые уже остановлены или закончились, ни на что не влияют */
  let frame = 0, hold = null, t0 = 0, last = 0, share = 0, dur = 0, heard = 0, ended = false, utter = null;
  const paint = () => fill.style.setProperty('--p', share);
  /* запись: файл загружается при первом нажатии. Полоса идет просто по часам: с момента, когда звук пошел, ровно столько,
     сколько длится файл, — равномерно, без подстройки под время проигрывания (тишина до и после голоса из файлов
     вырезана при генерации) */
  const file = AUDIO[text];
  let audio = null;
  const finishAudio = () => {
    if (ended) return;
    if (speaking === player) speaking = null;
    cancelAnimationFrame(frame); frame = 0;
    audio.pause(); share = 1; paint(); ended = true;
    hold = setTimeout(player.idle, 300);
  };
  const stepAudio = now => {
    const sec = (now - t0) / 1000;
    if (sec >= audio.duration) return finishAudio();
    share = sec / audio.duration; paint();
    frame = requestAnimationFrame(stepAudio);
  };
  const playAudio = () => {
    if (!audio) {
      audio = new Audio(`audio/${file}.mp3`);
      /* отсчет — с момента, когда звук действительно начался (после загрузки и перемотки к началу) */
      audio.addEventListener('playing', () => {
        if (speaking !== player || t0) return;
        t0 = performance.now(); frame = requestAnimationFrame(stepAudio);
      });
      /* файл не загрузился (нет сети) — плеер возвращается в покой */
      audio.addEventListener('error', () => { if (speaking === player) speaking = null; player.idle(); });
    }
    audio.currentTime = 0;
    audio.play().catch(() => {});
  };
  const step = now => {
    const dt = (now - last) / 1000, sec = (now - t0) / 1000; last = now;
    /* звук по последнему слову уже кончился — плеер завершается, не дожидаясь запоздалого события конца
       (speaking = null, чтобы оно потом ничего не делало) */
    if (!ended && heard && sec > heard + .15) { if (speaking === player) speaking = null; ended = true; utter = null; rememberSec(text, heard); }
    if (ended) share += (1 - share) * Math.min(1, dt * 12);
    else share += (1 - share) * Math.min(1, dt / Math.max(.05, dur - sec));
    if (ended && share > .995) {
      share = 1; paint(); frame = 0;
      /* полная полоса держится мгновение, затем плеер возвращается в покой */
      hold = setTimeout(player.idle, 300);
      return;
    }
    paint();
    frame = requestAnimationFrame(step);
  };
  const player = {
    /* покой: полоса пустая */
    idle() {
      cancelAnimationFrame(frame); clearTimeout(hold); frame = 0; hold = null;
      share = t0 = heard = 0; ended = false; utter = null; paint();
      if (audio) audio.pause();
      btn.innerHTML = PLAY_ICON; btn.setAttribute('aria-label', `Прослушать ${label}`);
      box.classList.remove('listen__player--on');
    },
    play() {
      stopSpeech();
      player.idle();
      speaking = player;
      btn.innerHTML = STOP_ICON; btn.setAttribute('aria-label', `Остановить ${label}`);
      box.classList.add('listen__player--on');
      if (file) return playAudio();
      const u = new SpeechSynthesisUtterance(text), voice = enVoice();
      utter = u;
      u.lang = voice ? voice.lang : 'en-GB'; if (voice) u.voice = voice; u.rate = SPEECH_RATE;
      u.onstart = () => {
        if (utter !== u) return;
        t0 = last = performance.now(); dur = speechSec(text); frame = requestAnimationFrame(step);
      };
      /* темп — секунд на букву уже сказанного (знаки препинания и пробелы не звучат); оставшиеся буквы в этом темпе дают
         конец звука. Оценка смешивается с прежней, чтобы скорость менялась мягко; на последнем слове берется как есть */
      u.onboundary = e => {
        if (utter !== u || e.name !== 'word' || !t0) return;
        const sec = (performance.now() - t0) / 1000, said = letters(text.slice(0, e.charIndex)), rest = text.slice(e.charIndex);
        if (sec < .3 || !said) return;
        const end = sec + letters(rest) * sec / said;
        if (/\s\S/.test(rest.trim())) dur = (dur + end) / 2; else dur = heard = end;
      };
      u.onend = () => {
        if (utter !== u) return;
        if (t0) rememberSec(text, heard || (performance.now() - t0) / 1000);
        if (speaking === player) speaking = null;
        ended = true; utter = null;
        if (!frame) { last = performance.now(); frame = requestAnimationFrame(step); }
      };
      u.onerror = () => { if (utter !== u) return; if (speaking === player) speaking = null; player.idle(); };
      speechSynthesis.speak(u);
    }
  };
  /* остановить можно и во время дотягивания полосы после конца речи */
  const toggle = () => { if (speaking === player || ended) { stopSpeech(); player.idle(); } else player.play(); };
  btn.addEventListener('click', toggle);
  if (!file && !speech) { btn.disabled = true; btn.title = 'Этот браузер не умеет озвучивать текст'; }
  player.idle();
  box.append(btn, track);
  return box;
}

function renderEx(t, ex, ei) {
  const box = el('section', 'ex' + (ex.type === 'listen' ? ' ex--listen' : ''));
  box.dataset.ei = ei;
  box.innerHTML = `<div class="ex__head"><span class="ex__num">Упражнение ${exNo(t, ei)}</span><p class="ex__task">${ex.task}</p></div>`;
  const rows = [];
  const idBase = `x-${t.id}-${ei}`;

  /* показанные ответы остаются до «Скрыть ответы» (или перезагрузки страницы): ввод, проверка и сброс их сохраняют */
  let keysShown = false;
  const clearRow = row => {
    row.li.querySelectorAll('.ex__verdict').forEach(v => v.remove());
    if (row.selfBtn) row.selfBtn.hidden = true;
  };

  if (ex.type === 'text') {
    const div = el('div', 'ex__text');
    const row = { li: div, q: div, inputs: fillGaps(div, ex.text, ex.answers, idBase, 'Текст') };
    rows.push(row); box.append(div);
  } else {
    const ol = el('ol', 'ex__items');
    ex.items.forEach((it, ii) => {
      const li = el('li', 'ex__item'); const row = { it, li };
      if (ex.type === 'gap') {
        const q = el('div', 'ex__q');
        row.q = q; row.inputs = fillGaps(q, it[0], gapAnswers(it), `${idBase}-${ii}`, `Предложение ${ii + 1}`);
        li.append(q);
      } else if (ex.type === 'choice') {
        const q = el('div', 'ex__q');
        const [before, after = ''] = it[0].split('___');
        const blank = el('span', 'ex__blank', ' ');
        q.append(fmt(before), blank, fmt(after));
        const opts = el('div', 'ex__opts'); opts.setAttribute('role', 'group');
        shuffled(it[1], it[0]).forEach(o => {
          const b = el('button', 'ex__opt', o); b.type = 'button'; b.setAttribute('aria-pressed', 'false');
          b.addEventListener('click', () => {
            if (row.sel === o) return; /* тот же вариант — ответ не изменился */
            opts.querySelectorAll('.ex__opt').forEach(x => { x.setAttribute('aria-pressed', String(x === b)); x.classList.remove(...OPT_MARKS); });
            row.sel = o; blank.textContent = o; blank.classList.remove('ex__blank--miss'); clearRow(row); if (keysShown) showKey(row); unlock(); save();
          });
          opts.append(b);
        });
        Object.assign(row, { q, blank, opts });
        li.append(q, opts);
      } else if (ex.type === 'translate') {
        const q = el('div', 'ex__q ex__q--ru', it[0]);
        const inp = el('input', 'ex__field ex__tr');
        inp.type = 'text'; inp.id = `${idBase}-${ii}`; inp.autocomplete = 'off'; inp.spellcheck = false;
        inp.setAttribute('autocapitalize', 'off'); inp.setAttribute('aria-label', `Перевод предложения ${ii + 1}`);
        inp.placeholder = 'Ваш перевод';
        const selfBtn = el('button', 'ex__self-ok', 'Мой вариант тоже верен'); selfBtn.type = 'button'; selfBtn.hidden = true;
        Object.assign(row, { q, inputs: [inp], selfBtn });
        li.append(q, inp);
      } else if (ex.type === 'listen') {
        /* предложение собирается из слов-плиток: слово из набора встает в конец строки, слово из строки возвращается
           в набор; знаки препинания не нужны — проверка их не учитывает */
        const words = it[0].split(/\s+/).map(w => w.replace(/^[^\w']+|[^\w']+$/g, '')).filter(Boolean);
        let order = shuffled(words.map((w, k) => k), it[0]);
        if (order.every((k, i) => k === i)) order = order.reverse();
        const line = el('div', 'listen__line'), picked = el('span', 'listen__picked');
        line.append(picked);
        const bank = el('div', 'listen__bank'); bank.setAttribute('role', 'group'); bank.setAttribute('aria-label', `Слова предложения ${ii + 1}`);
        const tiles = order.map(k => { const b = el('button', 'ex__opt listen__word', words[k]); b.type = 'button'; bank.append(b); return b; });
        const changed = () => { line.classList.remove(...LINE_MARKS); clearRow(row); row.draw(); if (keysShown) showKey(row); unlock(); save(); };
        tiles.forEach(b => b.addEventListener('click', () => {
          if (row.pick.includes(b)) return;
          row.pick.push(b); changed();
          /* нажатое слово становится неактивным — фокус переходит к следующему свободному */
          (tiles.find(x => !row.pick.includes(x)) || bCheck).focus();
        }));
        Object.assign(row, {
          q: line, line, tiles, pick: [],
          value: () => row.pick.map(b => b.textContent).join(' '),
          draw() {
            picked.replaceChildren(...row.pick.map(b => {
              const c = el('button', 'ex__opt listen__word', b.textContent); c.type = 'button';
              c.setAttribute('aria-label', `Убрать «${b.textContent}»`);
              c.addEventListener('click', () => { row.pick.splice(row.pick.indexOf(b), 1); changed(); });
              return c;
            }));
            tiles.forEach(b => { const used = row.pick.includes(b); b.disabled = used; b.classList.toggle('listen__word--used', used); });
            line.classList.toggle('listen__line--empty', !row.pick.length);
          }
        });
        row.draw();
        li.append(makePlayer(it[0], `предложение ${ii + 1}`), line, bank);
      }
      /* строка «Ответ: …»: есть у перевода и «На слух»; выбор показывает свой ответ на самом варианте */
      if (ex.type === 'translate' || ex.type === 'listen') { row.key = el('div', 'ex__key'); row.key.hidden = true; li.append(row.key); }
      if (row.selfBtn) li.append(row.selfBtn);
      ol.append(li); rows.push(row);
    });
    box.append(ol);
  }

  /* ввод снимает отметки; Enter переходит к следующему полю */
  rows.forEach(row => (row.inputs || []).forEach(inp => {
    inp.addEventListener('input', () => { inp.classList.remove(...FIELD_MARKS); row.credited = false; clearRow(row); unlock(); save(); });
    inp.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      const all = [...box.querySelectorAll('input')];
      const next = all[all.indexOf(inp) + 1];
      if (next) next.focus(); else if (!bCheck.disabled) check();
    });
  }));

  const foot = el('div', 'ex__foot');
  const bCheck = el('button', 'btn btn--primary ex__btn', 'Проверить'); bCheck.type = 'button';
  const bShow = el('button', 'btn ex__btn', 'Показать ответы'); bShow.type = 'button'; bShow.setAttribute('aria-pressed', 'false');
  /* проверять нечего, пока не дан хотя бы один ответ */
  const blank = () => rows.every(r => ex.type === 'choice' ? !r.sel : ex.type === 'listen' ? !r.pick.length : r.inputs.every(i => !i.value.trim()));
  const syncBlank = () => { const b = blank(); bCheck.disabled = b; bCheck.title = b ? 'Сначала введите хотя бы один ответ' : ''; };
  /* любое изменение ответа снова делает доступными «Проверить» и «Показать ответы» */
  const unlock = () => { syncBlank(); bShow.hidden = false; };
  const bReset = el('button', 'btn ex__btn', 'Заново'); bReset.type = 'button';
  const score = el('span', 'ex__score'); score.setAttribute('aria-live', 'polite');
  foot.append(bCheck, bShow, bReset, score);
  if (ex.type === 'listen' && !speech && ex.items.some(it => !AUDIO[it[0]])) foot.append(el('span', 'listen__note', 'Озвучка недоступна в этом браузере'));
  box.append(foot);

  const answerOf = (row, k) => ex.type === 'text' ? ex.answers[k] : ex.type === 'gap' ? gapAnswers(row.it)[k] : row.it[1];
  const total = units(ex);
  let checked = false;
  /* когда все ответы верны, «Показать ответы» есть что показать только в переводах: другие принимаемые варианты
     или эталонная формулировка строки, засчитанной по «Мой вариант тоже верен» */
  const hasAlternatives = ex.type === 'translate' && ex.items.some(it => it[1].includes('|'));
  /* последняя проверка для «Работы над ошибками»: [номера неверных пунктов, номера пустых пунктов];
     пункт — предложение (пропуск в упражнении «text»), неверен, если неверен любой его пропуск, пуст, если остальные пусты */
  let marks = null;
  function countMarks() {
    const wrong = [], blank = [];
    const mark = (n, state) => { if (state === 'wrong') wrong.push(n); else if (state === 'blank') blank.push(n); };
    const stateOf = (ok, value) => ok ? 'ok' : value.trim() ? 'wrong' : 'blank';
    rows.forEach((row, ri) => {
      if (ex.type === 'choice') { mark(ri + 1, !row.sel ? 'blank' : row.sel === row.it[1][0] ? 'ok' : 'wrong'); return; }
      if (ex.type === 'translate') { const v = row.inputs[0].value; mark(ri + 1, stateOf(row.credited || accepts(row.it[1], v), v)); return; }
      if (ex.type === 'listen') { const v = row.value(); mark(ri + 1, stateOf(accepts(row.it[0], v), v)); return; }
      const res = row.inputs.map((inp, k) => stateOf(accepts(answerOf(row, k), inp.value), inp.value));
      if (ex.type === 'text') res.forEach((r, k) => mark(k + 1, r));
      else mark(ri + 1, res.includes('wrong') ? 'wrong' : res.includes('blank') ? 'blank' : 'ok');
    });
    return [wrong, blank];
  }

  /* ответы хранятся в localStorage: gk2-answers[тема][упражнение] = { v: значения по строкам, c: засчитанные строки, k: проверено, m: отметки } */
  function save() {
    const v = rows.map(r => ex.type === 'choice' ? (r.sel ?? null) : ex.type === 'listen' ? r.pick.map(b => b.textContent) : r.inputs.map(i => i.value));
    const empty = v.every(x => x == null || (Array.isArray(x) && x.every(s => !s)));
    answers[t.id] = answers[t.id] || {};
    if (empty) { delete answers[t.id][ei]; if (!Object.keys(answers[t.id]).length) delete answers[t.id]; }
    else answers[t.id][ei] = { v, c: rows.map((r, i) => r.credited ? i : -1).filter(i => i >= 0), k: checked, ...(checked && marks ? { m: marks } : {}) };
    store.set('gk2-answers', answers);
  }

  function rowScore(row) {
    if (ex.type === 'choice') return row.sel === row.it[1][0] ? 1 : 0;
    if (ex.type === 'translate') return row.credited || accepts(row.it[1], row.inputs[0].value) ? 1 : 0;
    if (ex.type === 'listen') return accepts(row.it[0], row.value()) ? 1 : 0;
    return row.inputs.reduce((n, inp, k) => n + (accepts(answerOf(row, k), inp.value) ? 1 : 0), 0);
  }

  function showScore() {
    const ok = rows.reduce((n, r) => n + rowScore(r), 0);
    /* после проверки «Проверить» ждет изменения ответа: повторная проверка тех же ответов ничего не даст.
       Любая правка снова включает кнопку (unlock) */
    bCheck.disabled = true;
    bCheck.title = ok === total ? '' : 'Измените ответ, чтобы проверить снова';
    bShow.hidden = ok === total && !hasAlternatives && !rows.some(r => r.credited);
    if (bShow.hidden && keysShown) hideKeys();
    score.textContent = `${ok} из ${total}` + (ok === total ? ' · без ошибок' : '');
    score.className = 'ex__score' + (ok === total ? ' ex__score--good' : ok / total < .5 ? ' ex__score--low' : '');
    return ok;
  }

  function updateScore() {
    const ok = showScore();
    /* считается последняя проверка, а не лучшая: счет под упражнением, прогресс и «С ошибками» всегда согласованы */
    progress[t.id] = progress[t.id] || {};
    progress[t.id][ei] = [ok, total]; store.set('gk2-progress', progress);
    renderToc(); renderOverall(); renderRedoBar();
    const pp = $('#pageProg'); if (pp) fillProgress(pp);
  }

  function check(silent) {
    rows.forEach(row => {
      clearRow(row);
      let good;
      if (ex.type === 'choice') {
        good = row.sel === row.it[1][0];
        row.opts.querySelectorAll('.ex__opt').forEach(b => { b.classList.remove(...OPT_MARKS); if (b.textContent === row.sel) b.classList.add(good ? 'ex__opt--ok' : 'ex__opt--bad'); });
        if (!row.sel) row.blank.classList.add('ex__blank--miss');
      } else if (ex.type === 'listen') {
        good = accepts(row.it[0], row.value());
        row.line.classList.remove(...LINE_MARKS);
        row.line.classList.add(good ? 'listen__line--ok' : row.pick.length ? 'listen__line--bad' : 'listen__line--miss');
      } else {
        good = true;
        row.inputs.forEach((inp, k) => {
          const g = ex.type === 'translate' ? (row.credited || accepts(row.it[1], inp.value)) : accepts(answerOf(row, k), inp.value);
          inp.classList.remove(...FIELD_MARKS);
          inp.classList.add(g ? 'ex__field--ok' : inp.value.trim() ? 'ex__field--bad' : 'ex__field--miss');
          if (!g) good = false;
        });
        if (ex.type === 'translate' && !good && row.inputs[0].value.trim()) row.selfBtn.hidden = false;
      }
      if (ex.type !== 'text') {
        const v = el('span', 'ex__verdict ex__verdict--' + (good ? 'ok' : 'bad'), good ? '✓' : '✗');
        v.setAttribute('aria-label', good ? 'верно' : 'ошибка');
        row.q.append(v);
      }
    });
    checked = true; marks = countMarks();
    if (keysShown) rows.forEach(showKey);
    if (!silent) { updateScore(); save(); }
  }

  rows.forEach(row => {
    if (!row.selfBtn) return;
    row.selfBtn.addEventListener('click', () => {
      row.credited = true;
      row.inputs[0].classList.remove(...FIELD_MARKS); row.inputs[0].classList.add('ex__field--ok');
      row.selfBtn.hidden = true;
      const v = row.q.querySelector('.ex__verdict'); if (v) { v.className = 'ex__verdict ex__verdict--ok'; v.textContent = '✓'; }
      marks = countMarks();
      updateScore(); save();
    });
  });

  bCheck.addEventListener('click', () => check());
  /* «Показать ответы» переключается; пока включено, ввод сохраняет подсказки на месте, а выбор варианта обновляет его строку ответа */
  function setKeysShown(on) {
    keysShown = on;
    bShow.textContent = on ? 'Скрыть ответы' : 'Показать ответы';
    bShow.setAttribute('aria-pressed', String(on));
  }
  function showKey(row) {
    if (ex.type === 'choice') {
      /* без строки текста: зеленым становится сам верный вариант */
      row.opts.querySelectorAll('.ex__opt').forEach(b => b.classList.toggle('ex__opt--key', b.textContent === row.it[1][0]));
    } else if (ex.type === 'translate') {
      const alts = row.it[1].split('|');
      row.key.textContent = 'Ответ: ' + alts[0] + (alts.length > 1 ? '  (или: ' + alts.slice(1, 3).join('; ') + ')' : '');
      row.key.hidden = false;
    } else if (ex.type === 'listen') {
      row.key.innerHTML = `Ответ: ${esc(row.it[0])}<span class="listen__ru">${esc(row.it[1])}</span>`;
      row.key.hidden = false;
    } else {
      row.li.querySelectorAll('.ex__inline-key').forEach(k => k.remove());
      row.inputs.forEach((inp, k) => {
        const a = answerOf(row, k);
        if (accepts(a, inp.value)) return;
        inp.after(el('span', 'ex__inline-key', firstAnswer(a)));
      });
    }
  }
  function hideKeys() {
    rows.forEach(row => {
      row.li.querySelectorAll('.ex__inline-key').forEach(k => k.remove());
      if (row.opts) row.opts.querySelectorAll('.ex__opt').forEach(b => b.classList.remove('ex__opt--key'));
      if (row.key) row.key.hidden = true;
    });
    setKeysShown(false);
  }
  bShow.addEventListener('click', () => {
    if (keysShown) { hideKeys(); return; }
    rows.forEach(showKey);
    setKeysShown(true);
  });
  bReset.addEventListener('click', () => {
    rows.forEach(row => {
      clearRow(row); row.credited = false;
      (row.inputs || []).forEach(inp => { inp.value = ''; inp.classList.remove(...FIELD_MARKS); });
      if (row.opts) {
        row.sel = undefined; row.blank.textContent = ' '; row.blank.classList.remove('ex__blank--miss');
        row.opts.querySelectorAll('.ex__opt').forEach(b => { b.setAttribute('aria-pressed', 'false'); b.classList.remove(...OPT_MARKS); });
      }
      if (row.line) { row.pick = []; row.line.classList.remove(...LINE_MARKS); row.draw(); }
      if (keysShown) showKey(row);
    });
    score.textContent = ''; score.className = 'ex__score';
    unlock();
    checked = false; marks = null; save();
    /* сброшенное упражнение больше не учитывается в прогрессе (и в «С ошибками»), пока его не проверят снова */
    if (progress[t.id] && progress[t.id][ei]) {
      delete progress[t.id][ei];
      if (!Object.keys(progress[t.id]).length) delete progress[t.id];
      store.set('gk2-progress', progress);
      renderToc(); renderOverall(); renderRedoBar();
      const pp = $('#pageProg'); if (pp) fillProgress(pp);
    }
  });

  /* открыто из «Работы над ошибками»: назад к списку, дальше к следующему упражнению; зеленеет, когда решено полностью */
  const redoBar = mistakeFocus && mistakeFocus.t === t.id && mistakeFocus.ei === ei ? el('nav', 'ex__redo') : null;
  if (redoBar) { redoBar.setAttribute('aria-label', 'Работа над ошибками'); box.append(redoBar); }
  function renderRedoBar() {
    if (!redoBar) return;
    const r = progress[t.id] && progress[t.id][ei];
    const fixed = !!r && r[0] === r[1];
    const next = nextMistake(t, ei);
    redoBar.classList.toggle('ex__redo--done', fixed);
    redoBar.innerHTML = '';
    if (fixed) redoBar.append(el('p', 'ex__redo-status', next ? '✓ Исправлено — упражнение убрано из «Работы над ошибками»' : '✓ Исправлено — это было последнее упражнение с ошибками'));
    /* список «Работы над ошибками» пуст (исправлено последнее упражнение или оно сброшено «Заново») — возвращаться
       незачем: остается только отметка «Исправлено», а без нее плашка скрывается целиком */
    const empty = !mistakeCount();
    redoBar.hidden = empty && !fixed;
    if (empty) return;
    const back = el('button', 'ex__redo-link'); back.type = 'button';
    back.innerHTML = `${arrowHtml('prev')} К работе над ошибками`;
    back.addEventListener('click', () => go('mistakes'));
    redoBar.append(back);
    if (next) {
      const b = el('button', 'ex__redo-link ex__redo-link--next'); b.type = 'button';
      /* следующее — другого уровня (на этом уровне ошибок больше нет или список не отфильтрован): кнопка его называет */
      const lvl = next.t.level !== t.level ? ` · уровень <span class="lvl-tag lvl-tag--sm" title="${LEVELS[next.t.level]}">${next.t.level}</span>` : '';
      b.innerHTML = `<span class="ex__redo-text">Следующее: ${esc(next.t.num)} · Упр. ${exNo(next.t, next.i)}${lvl}</span>${arrowHtml('next')}`;
      b.title = next.t.title;
      b.addEventListener('click', () => openExercise(next.t.id, next.i));
      redoBar.append(b);
    }
  }
  renderRedoBar();

  /* восстановить сохраненные ответы */
  const saved = answers[t.id] && answers[t.id][ei];
  if (saved && saved.v.length === rows.length) {
    rows.forEach((row, i) => {
      const val = saved.v[i];
      if (ex.type === 'choice') {
        const b = val != null && [...row.opts.querySelectorAll('.ex__opt')].find(x => x.textContent === val);
        if (b) { row.sel = val; row.blank.textContent = val; b.setAttribute('aria-pressed', 'true'); }
      } else if (ex.type === 'listen') {
        /* слова строки возвращаются на свои плитки; повторяющееся слово берет первую еще свободную */
        (val || []).forEach(w => { const b = row.tiles.find(x => x.textContent === w && !row.pick.includes(x)); if (b) row.pick.push(b); });
        row.draw();
      } else if (Array.isArray(val)) row.inputs.forEach((inp, k) => { inp.value = val[k] || ''; });
    });
    (saved.c || []).forEach(i => { if (rows[i]) rows[i].credited = true; });
    if (saved.k) {
      check(true);
      showScore();
    }
  }
  if (!checked) syncBlank();
  return box;
}

/* ---------- Маршрутизация ---------- */
/* syncToc = false при загрузке страницы: аккордеон сохраняет свое сохраненное состояние, а не следует за маршрутом */
const PAGES = ['contents', 'mistakes', 'notes', 'about',...ABOUT.map(p => 'about-' + p.id)];
function go(id, scroll = true, syncToc = true, fromBookmarks = false) {
  if (!(PAGES.includes(id) || topicById[id] || chapById[id])) id = 'contents';
  route = id;
  stopSpeech();
  viaBookmarks = fromBookmarks;
  mistakeFocus = pendingFocus; pendingFocus = null;
  const curCh = topicById[id] ? topicById[id].ch : chapById[id];
  /* «Избранное» и список содержания независимы: тема, открытая из избранного, не трогает список содержания (открытый раздел, фильтр уровня) */
  if (syncToc && !fromBookmarks && curCh && curCh.id !== openChap) { justToggled = curCh.id; setOpenChap(curCh.id); }
  const main = $('#main'); main.innerHTML = '';
  const wrap = el('div', 'sheet__inner');
  if (topicById[id]) {
    const t = topicById[id];
    /* чипы уровней следуют за открытым уроком, кроме открытого из «Избранного» */
    if (!fromBookmarks && levelFilter !== t.level) { levelFilter = t.level; store.set('gk2-level', levelFilter); renderLevels(); }
    renderTopic(t, wrap);
  }
  else if (chapById[id]) renderChapter(chapById[id], wrap);
  else if (id === 'mistakes') renderMistakesPage(wrap);
  else if (id === 'notes') renderNotesPage(wrap);
  else if (id === 'about') renderAboutPage(wrap);
  else if (aboutPage(id)) renderAboutTopic(aboutPage(id), wrap);
  else renderContents(wrap);
  main.append(wrap);
  document.documentElement.classList.toggle('page--glow', isAbout(id));
  /* переход на другую страницу добавляет запись в историю, поэтому работают «Назад» / «Вперед» браузера; первая отрисовка и перерисовки той же страницы только заменяют ее */
  try { if (booted && location.hash.slice(1) !== id) history.pushState(null, '', '#' + id); else history.replaceState(null, '', '#' + id); } catch (e) {}
  store.set('gk2-last', id);
  renderToc();
  renderOverall();
  setDrawer(false);
  if (scroll) window.scrollTo(0, 0);
}

$('#tocContents').addEventListener('click', () => go('contents'));
$('#infoBtn').addEventListener('click', () => go('about'));
$('#notesBtn').addEventListener('click', () => go('notes'));
$('#brandLink').addEventListener('click', e => { e.preventDefault(); go('contents'); });

/* Скрыть / показать меню на десктопе; выбор запоминается. */
function setSide(collapsed, focus) {
  $('#app').classList.toggle('app--side-collapsed', collapsed);
  $('#floatTools').hidden = !collapsed;
  $('#sideShow').setAttribute('aria-expanded', String(!collapsed));
  $('#sideHide').setAttribute('aria-expanded', String(!collapsed));
  store.set('gk2-side-collapsed', collapsed);
  if (focus) (collapsed ? $('#sideShow') : $('#sideHide')).focus();
}
$('#sideHide').addEventListener('click', () => setSide(true, true));

/* ---------- Тема ---------- */
let themeTimer;
/* при каждом наведении звезды кнопки темы получают новый случайный порядок, а лучи центрируются по значку */
document.querySelectorAll('.theme-toggle').forEach(b => {
  const shuffle = () => {
    b.querySelectorAll('.theme-toggle__stars i').forEach(s => { s.style.transitionDelay = (Math.random() * .3).toFixed(2) + 's'; });
    /* лучи начинаются из центра видимого значка */
    const icon = [...b.querySelectorAll('svg')].find(s => s.getClientRects().length), r = b.getBoundingClientRect();
    if (icon) { const i = icon.getBoundingClientRect(); b.style.setProperty('--cx', i.left - r.left + i.width / 2 + 'px'); b.style.setProperty('--cy', i.top - r.top + i.height / 2 + 'px'); }
  };
  /* солнце: один оборот за 12 с, пока наведено; при уходе плавно доворачивается до следующего шага в 45°, где восемь лучей выглядят как в покое */
  const sun = b.querySelector('.theme-toggle__sun');
  let spin = null;
  const spinStart = () => {
    /* запускают и наведение, и фокус (клик ставит фокус на кнопку под курсором): вторая анимация потеряла бы первую, и та осталась бы крутиться */
    if (spin || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    sun.style.transition = 'none'; sun.style.transform = '';
    spin = sun.animate([{ transform: 'rotate(0deg)' }, { transform: 'rotate(360deg)' }], { duration: 12000, iterations: Infinity });
  };
  const spinStop = () => {
    if (!spin) return;
    const angle = (spin.currentTime % 12000) / 12000 * 360;
    spin.cancel(); spin = null;
    sun.style.transform = `rotate(${angle}deg)`;
    void sun.getBoundingClientRect();
    sun.style.transition = 'transform .5s ease-out';
    sun.style.transform = `rotate(${Math.ceil(angle / 45) * 45}deg)`;
  };
  b.addEventListener('pointerenter', () => { shuffle(); spinStart(); });
  b.addEventListener('focus', () => { shuffle(); spinStart(); });
  b.addEventListener('pointerleave', spinStop);
  b.addEventListener('blur', spinStop);
});
document.querySelectorAll('.theme-toggle').forEach(b => b.addEventListener('click', () => {
  const root = document.documentElement;
  const next = root.dataset.theme === 'light' ? 'dark' : 'light';
  const apply = () => { root.dataset.theme = next; store.set('gk2-theme', next); syncThemeBtn(); };
  if (document.startViewTransition && !matchMedia('(prefers-reduced-motion: reduce)').matches) { document.startViewTransition(apply); return; }
  root.classList.add('theme-anim');
  apply();
  clearTimeout(themeTimer);
  themeTimer = setTimeout(() => root.classList.remove('theme-anim'), 150);
}));
$('#sideShow').addEventListener('click', () => setSide(false, true));
setSide(!!store.get('gk2-side-collapsed', false), false);
$('#search').addEventListener('input', renderToc);
/* ---------- Мобильный drawer ---------- */
function setDrawer(open, focus) {
  $('#drawer').classList.toggle('drawer--open', open);
  $('#drawerBackdrop').classList.toggle('drawer-backdrop--open', open);
  document.documentElement.style.overflow = open ? 'hidden' : '';
  $('#menuBtn').setAttribute('aria-expanded', String(open));
  /* кнопка закрытия шириной с «Меню» в шапке, которую она заменяет под пальцем */
  if (open) $('#drawerClose').style.width = $('#menuBtn').getBoundingClientRect().width + 'px'; /* точно, без округления, как у offsetWidth */
  if (focus) (open ? $('#drawerClose') : $('#menuBtn')).focus();
}
$('#menuBtn').addEventListener('click', () => setDrawer(true, true));
$('#drawerClose').addEventListener('click', () => setDrawer(false, true));
$('#drawerBackdrop').addEventListener('click', () => setDrawer(false));
addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if ($('#drawer').classList.contains('drawer--open')) setDrawer(false, true);
});
matchMedia('(max-width: 880px)').addEventListener('change', () => setDrawer(false));
/* «Назад» / «Вперед» (popstate) и hash, набранный в адресной строке (hashchange), открывают эту страницу */
/* ссылка «restore», вставленная в открытую вкладку: вернуть собственный адрес страницы и предложить импорт */
const followHash = () => {
  const id = location.hash.slice(1);
  if (id.startsWith(LINK_KEY)) { history.replaceState(null, '', '#' + route); openLink(id); }
  else if (id && id !== route) go(id);
};
window.addEventListener('popstate', followHash);
window.addEventListener('hashchange', followHash);
let booted = false;
renderLevels();
const startId = location.hash.slice(1);
go(startId && (PAGES.includes(startId) || topicById[startId] || chapById[startId]) ? startId : store.get('gk2-last', 'contents'), false, false);
booted = true;
/* открыто по ссылке «restore»: go() уже заменила адрес на собственный адрес страницы */
if (startId.startsWith(LINK_KEY)) openLink(startId);
renderOverall();
$('#tocToggle').insertAdjacentHTML('beforeend', FOLD_ARROW);

/* «Поддержать автора»: банкноты для дождя при наведении, у каждой своя скорость, начало и качание; каждая держится своей полосы
   кнопки, поэтому дождь покрывает ее от края до края, включая углы; при каждом новом падении она получает новое место в полосе,
   качание, наклон и переворот, поэтому дождь никогда не повторяется */
(function () {
  if (!matchMedia('(hover: hover)').matches) return; /* у сенсорных экранов нет наведения — и дождя нет */
  const box = $('#donateBills'), N = 16, rnd = (a, b) => a + Math.random() * (b - a);
  const shuffle = b => {
    b.style.setProperty('--x', (2 + (+b.dataset.slot + Math.random()) * 96 / N).toFixed(1) + '%');
    b.style.setProperty('--sw', rnd(3, 8).toFixed(1) + 'px');
    b.style.setProperty('--r', rnd(10, 40).toFixed(0) + 'deg');
    b.style.setProperty('--fl', rnd(30, 160).toFixed(0) + 'deg');
  };
  /* полосы раздаются в случайном порядке, чтобы соседние по времени не падали рядом */
  const slots = [...Array(N).keys()].sort(() => Math.random() - .5);
  for (let n = 0; n < N; n++) {
    const b = document.createElement('i');
    b.dataset.slot = slots[n];
    b.style.setProperty('--t', rnd(1.6, 2.4).toFixed(2) + 's');
    b.style.setProperty('--d', (n * .13 + rnd(0, .1)).toFixed(2) + 's');
    b.style.setProperty('--s', rnd(.5, .85).toFixed(2) + 's');
    b.style.setProperty('--sd', (-rnd(0, .8)).toFixed(2) + 's');
    shuffle(b); b.append(document.createElement('b')); box.append(b);
  }
  box.addEventListener('animationiteration', e => { if (e.animationName === 'bill-fall') shuffle(e.target); });
})();
$('#tocToggle').addEventListener('click', () => {
  /* во время поиска список принудительно открыт; переключатель тогда очищает поиск и сворачивает список */
  if ($('#search').value.trim()) { $('#search').value = ''; tocFolded = true; }
  else tocFolded = !tocFolded;
  store.set('gk2-toc-folded', tocFolded);
  renderToc();
});
Object.keys(FOLD).forEach(k => { $(FOLD[k][0]).addEventListener('click', () => setFold(k, !folds[k])); setFold(k, !!folds[k]); });
</script>
