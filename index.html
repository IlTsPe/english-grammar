<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script>
/* theme: saved choice, dark by default; set before first paint */
(function () {
  var t; try { t = JSON.parse(localStorage.getItem('gk2-theme')); } catch (e) {}
  if (t !== 'light') t = 'dark';
  document.documentElement.dataset.theme = t;
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@500&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Unbounded:wght@600;700&display=swap">
<style>
/* Layout: school workbook — book contents on the left, a graph-paper sheet with the rule and exercises on the right.
   Answers are written in the accent colour, corrections in red. Two themes: data-theme="dark" (default) and "light".
   Class names follow BEM: block, block__element, block--modifier. States that have an ARIA or HTML attribute use it
   (aria-pressed, aria-current, hidden). Rule text comes from the data files with plain tags (p, h3, i, b),
   so .rule, .formula and .examples__en style their content through tag selectors. */
:root {
  /* light theme: pale grey paper, light grey sheet, electric-blue accent */
  --paper: #E1E5F0; /* a cool tint, so the sidebar reads apart from the neutral sheet */
  --sheet: #EBEBEB; /* a soft neutral grey; darker would push green and red text below 4.5:1 */
  --ink: #141B3A;
  --muted: #10193c; /* secondary text */
  --line: #C9D1E2;
  --border: #a7bae2; /* borders only; --line still draws dividers, bar tracks and fills */
  --well: #E6E7EA; /* inset blocks inside the sheet: progress, table heads, answer options */
  --grid: rgba(37, 71, 208, .07);
  --accent: #2547D0; /* a calm blue; text in it stays at 4.7:1 or more on every light background */
  --accent-soft: #DFE4F8;
  --hover: #CBD3F3; /* hover in the contents list: must stand out on the paper background */
  --on-accent: #FFFFFF;
  --hl: rgb(37 71 208 / 45%); /* highlight under key words in rules */
  --ok: #0a7a24; /* dark enough to read on the light sheet (4.9:1) */
  --ok-soft: #DDF2E1;
  --bad: #BE3A2F;
  --bad-soft: #F3DFDA;
  --mid: #E0A800; /* yellow of a half-done progress pill */
  --gold: #F0C048; /* bookmarks: the ribbon, the same in both themes */
  --gold-soft: #fdedbb; /* fill of gold states: pressed «В избранном», the active topic in «Избранное» */
  --gold-ink: #b38b27; /* gold for text and frames, darker in the light theme to stay readable */
  --f-display: 'Unbounded', 'Arial Black', system-ui, sans-serif;
  --f-body: 'Golos Text', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-en: 'Literata', Georgia, 'Times New Roman', serif;
  --f-mono: 'JetBrains Mono', ui-monospace, Consolas, monospace;
}
:root[data-theme="dark"] {
  --paper: #11131D; --border: #373e63; --well: #11131D; --hover: #352C6E; --sheet: #191C29; --hl: rgb(170 98 255 / 71%); --ink: #E7E9F2; --muted: #9AA1B8; --line: #2D3145;
  --grid: rgba(169, 156, 255, .07); --accent: #ADA2FF; --accent-soft: #29254A; --on-accent: #16132E;
  --ok: #5CD192; --ok-soft: #16301F; --bad: #FF7F73; --bad-soft: #3A1E1D; --mid: #F0C048;
  --gold-soft: #352B12; --gold-ink: #F0C048;
  color-scheme: dark;
}

* { box-sizing: border-box; }
/* applied only while the theme switches, so it does not interfere with other transitions */
:root.theme-anim, :root.theme-anim *, :root.theme-anim *::before, :root.theme-anim *::after {
  transition: background-color .1s linear, color .1s linear, border-color .1s linear, fill .1s linear, stroke .1s linear, box-shadow .1s linear !important;
}
body { background: var(--paper); color: var(--ink); font: 16px/1.6 var(--f-body); }
button { font: inherit; transition: linear 0.15s; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { display: grid; grid-template-columns: 310px minmax(0, 1fr); gap: 15px; padding-inline: 16px 0; }

/* ---------- Buttons ---------- */
.btn { padding: 8px 16px; border: 1px solid var(--border); border-radius: 8px; background: var(--sheet); color: var(--ink); font-size: 14.5px; font-weight: 600; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn--primary { border-color: var(--accent); background: var(--accent); color: var(--on-accent); opacity: .7; }
.btn--primary:hover { opacity: 1; }
.btn--primary:disabled, .btn--primary:disabled:hover { opacity: .35; cursor: default; }
.icon-btn { display: grid; place-items: center; width: 32px; height: 32px; padding: 0; border: 1px solid var(--border); border-radius: 8px; background: var(--sheet); color: var(--muted); cursor: pointer; }
.icon-btn:hover { border-color: var(--accent); color: var(--accent); }
.icon-btn__icon { width: 16px; height: 16px; }
/* a labelled button for sidebar actions: theme, hide / show the menu, open the sections on mobile */
.action-btn { display: flex; align-items: center; justify-content: center; gap: 7px; min-height: 40px; padding: 6px 10px; border: 1.5px solid color-mix(in srgb, var(--accent) 55%, transparent); border-radius: 10px;
  background: var(--sheet); color: var(--accent); font-size: 13px; font-weight: 600; line-height: 1.2; white-space: nowrap; cursor: pointer; }
.action-btn:hover { border-color: var(--accent); background: var(--accent-soft); }
.action-btn__icon { flex: none; width: 18px; height: 18px; }
/* the theme button shows the theme it switches to: a sun in the dark theme, a moon in the light one */
.theme-toggle__moon { display: none; }
:root[data-theme="light"] .theme-toggle__moon { display: block; }
:root[data-theme="light"] .theme-toggle__sun { display: none; }
/* on hover the sun spins with its rays (below); the moon swings with a little overshoot
   and three stars come out from behind it one after another */
/* the sun turns together with its rays, one turn in 12s like ray-turn; the script runs it so it can ease to a stop when the pointer leaves */
/* the moon rests turned 15° clockwise and swings 25° back on hover, so it ends slightly tilted instead of lying with the cut on top */
.theme-toggle__moon-body { transform-box: fill-box; transform-origin: center; transform: rotate(15deg); transition: transform .7s cubic-bezier(.34, 1.8, .64, 1); }
.theme-toggle:is(:hover, :focus-visible) .theme-toggle__moon-body { transform: rotate(-10deg); }
/* «Темная тема»: on hover small stars light up across the button, under the label, one after another */
.theme-toggle { position: relative; overflow: hidden; }
.theme-toggle > :not(.theme-toggle__stars, .theme-toggle__rays) { position: relative; }
.theme-toggle__stars, .theme-toggle__rays { position: absolute; inset: 0; pointer-events: none; }
/* «Светлая тема»: a fan of pale rays centred on the sun (--cx/--cy, set by the script) spreads out to the edges of the button
   and turns slowly while it is hovered */
@property --ray-r { syntax: '<length>'; inherits: false; initial-value: 0px; }
@property --ray-a { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
.theme-toggle__rays { --ray-r: 0px; opacity: 0;
  background: repeating-conic-gradient(from var(--ray-a) at var(--cx, 30px) var(--cy, 50%), color-mix(in srgb, currentColor 30%, transparent) 0deg 4deg, transparent 4deg 24deg);
  mask: radial-gradient(circle at var(--cx, 30px) var(--cy, 50%), transparent 11px, #000 16px, #000 calc(var(--ray-r) * .55), transparent var(--ray-r));
  transition: --ray-r .6s ease-out, opacity .3s ease; }
@keyframes ray-turn { to { --ray-a: 360deg; } }
:root:not([data-theme="light"]) .theme-toggle:is(:hover, :focus-visible) .theme-toggle__rays { --ray-r: 220px; opacity: 1; animation: ray-turn 12s linear infinite; }
.theme-toggle__stars i { position: absolute; width: var(--s); height: var(--s); background: currentColor; opacity: 0; transform: scale(.2) rotate(-45deg);
  clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%); transition: opacity .2s ease, transform .35s cubic-bezier(.3, 1.5, .6, 1); }
/* an uneven scatter; the order they light up in is re-rolled on every hover by the script */
.theme-toggle__stars i:nth-child(1) { --s: 7px; left: 5%; top: 24%; }
.theme-toggle__stars i:nth-child(2) { --s: 5px; left: 15%; top: 72%; }
.theme-toggle__stars i:nth-child(3) { --s: 5px; left: 24%; top: 6%; }
.theme-toggle__stars i:nth-child(4) { --s: 6px; left: 38%; top: 82%; }
.theme-toggle__stars i:nth-child(5) { --s: 4px; left: 51%; top: 4%; }
.theme-toggle__stars i:nth-child(6) { --s: 7px; left: 62%; top: 68%; }
.theme-toggle__stars i:nth-child(7) { --s: 5px; left: 75%; top: 14%; }
.theme-toggle__stars i:nth-child(8) { --s: 6px; left: 94%; top: 28%; }
:root[data-theme="light"] .theme-toggle:is(:hover, :focus-visible) .theme-toggle__stars i { opacity: .7; transform: none; }

/* ---------- Sidebar ---------- */
.side { position: sticky; top: env(safe-area-inset-top, 0px); align-self: start; max-height: calc(100vh - 16px); overflow-y: auto; scrollbar-gutter: stable; padding-block: 28px 24px; padding-inline: 5px 12px; } /* the wider right side keeps the scrollbar off the frames */
/* the gutter is always reserved: otherwise the scrollbar narrows the panel, titles rewrap and the panel keeps a scrollbar it no longer needs */
.side__head { display: flex; align-items: flex-start; gap: 8px; }
.side__actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 16px; }
/* «Скрыть меню»: two chevrons slide left on hover, the leading one faster, the second catching up */
.side__hide-chev { transition: transform .32s ease; }
.side__hide-chev--lead { transition-duration: .16s; }
.side__hide:is(:hover, :focus-visible) .side__hide-chev { transform: translateX(-3px); }
/* shown while the sidebar is collapsed: the menu button with the theme toggle under it, both the same width */
.float-tools { position: fixed; z-index: 5; top: calc(env(safe-area-inset-top, 0px) + 16px); left: 35px; display: grid; gap: 6px; }
.float-tools[hidden] { display: none; }
.float-tools__btn { justify-content: flex-start; padding-inline: 12px 14px; box-shadow: 0 2px 8px rgba(0, 0, 0, .12); }
@media (min-width: 881px) {
  /* collapse animates the sidebar track to zero while the panel fades and slides out */
  .app { transition: grid-template-columns .15s linear, gap .15s linear; }
  .app__side { transition: opacity .15s linear, transform .15s linear, visibility .15s linear; }
  .app__sheet { transition: padding-top .15s linear; }
  .app--side-collapsed { grid-template-columns: 0px minmax(0, 1fr); gap: 0; }
  .app--side-collapsed .app__side { min-width: 300px; opacity: 0; visibility: hidden; transform: translateX(-24px); pointer-events: none; }
  .app--side-collapsed .app__sheet { border-left-color: transparent; padding-top: 112px; }
}
/* from 1300px the centred text column starts right of the floating buttons, so the sheet keeps its usual top padding */
@media (min-width: 1300px) {
  .app--side-collapsed .app__sheet { padding-top: 36px; }
}
@media (max-width: 880px) {
  .side__hide, .float-tools { display: none; }
}
.brand { flex: 1; min-width: 0; }
/* the favicon sits left of the title, centred on its lines */
.brand__title { display: flex; align-items: center; gap: 7px; font-family: var(--f-display); font-weight: 700; font-size: 21px; line-height: 1.15; letter-spacing: -.01em; }
/* the favicon drawing, inline so it follows the theme (2px lower than the line-box centre — the visible text sits lower): a blue plate with a pale cap in the light theme, a violet plate with a dark cap in the dark one */
/* the tassel: gold in both themes (#F0C048 dark, #E0A800 light) */
.brand__logo { flex: none; position: relative; top: 2px; width: 42px; height: 42px; --logo-plate: #ADA2FF; --logo-ink: #16132E; --logo-tassel: #F0C048; }
:root[data-theme="light"] .brand__logo { --logo-plate: #2547D0; --logo-ink: #E2DDFF; --logo-tassel: #E0A800; }
.brand__logo-plate { fill: var(--logo-plate); }
.brand__logo-ink { fill: var(--logo-ink); }
.brand__logo-tassel { stroke: var(--logo-tassel); }
.brand__logo-pad { fill: var(--logo-tassel); }
.brand__logo-marks { stroke: var(--logo-ink); stroke-width: 1.6; }
.brand__mark {
  padding: 0 4px; border-radius: 4px; color: var(--accent);
  background-color: var(--sheet);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 7px 7px; box-shadow: inset 0 0 0 1px var(--line);
}
.brand__sub { display: block; margin-top: 6px; font-size: 13px; color: var(--muted); }
/* «Прогресс» and «Избранное»: full-width buttons one under the other, each expands its block under it like an accordion;
   the title on the left, the figures and the arrow on the right */
.side__summary { display: grid; gap: 8px; margin-top: 8px; }
.side__stat { width: 100%; justify-content: flex-start; gap: 10px; padding-inline: 12px; transition: border-radius .15s linear, border-color .15s linear, background-color .15s linear; }
.side__fold-arrow { flex: none; width: 12px; height: 12px; margin-left: auto; color: var(--muted); transition: transform .15s linear; }
.side__count + .side__fold-arrow { margin-left: 0; }
.side__stat:hover .side__fold-arrow { color: inherit; }
.side__stat[aria-expanded="true"] .side__fold-arrow { transform: rotate(90deg); }
/* the book progress bar fills the row between the title and the percentage, centred vertically */
.side__stat-bar { flex: 1; min-width: 40px; }
.side__stat-pct { font-family: var(--f-mono); font-size: 12px; font-weight: 500; color: var(--ink); font-variant-numeric: tabular-nums; }
.side__badge { min-width: 20px; padding: 1px 6px; border-radius: 99px; background: color-mix(in srgb, var(--bad) 18%, transparent); color: var(--bad); font-family: var(--f-mono); font-size: 11px; text-align: center; }
/* on the light sidebar the plain red badge read weakly (3.4:1): a denser tint and a deeper, bolder red (~4.6:1) */
:root[data-theme="light"] .side__badge { background: color-mix(in srgb, var(--bad) 24%, transparent); color: #A3001A; font-weight: 600; }
.side__count { margin-left: auto; font-family: var(--f-mono); font-weight: 500; font-variant-numeric: tabular-nums; }
.side__count:empty { display: none; }
.side__bm .bm-icon { margin: 0; color: currentColor; }
/* «Избранное» turns gold on hover, while open and while the open topic came from its list */
.side__bm:is(:hover, :focus-visible, [aria-expanded="true"]), .side__bm--active { border-color: var(--gold-ink); color: var(--gold-ink); }
/* the frame of an open «Прогресс»: full accent in the light theme; in the dark one the accent is near-white, so it is muted like the other frames */
.side__summary { --fold-bc: var(--accent); }
:root:not([data-theme="light"]) .side__summary { --fold-bc: color-mix(in srgb, var(--accent) 55%, transparent); }
.side__stat[aria-expanded="true"]:not(.side__bm), .side__stat[aria-expanded="true"]:not(.side__bm):hover { border-color: var(--fold-bc); border-bottom-color: transparent; }
/* the block under its button; the grid rows animate it open and closed */
.side__fold { display: grid; grid-template-rows: 0fr; opacity: 0; transition: grid-template-rows .15s linear, opacity .15s linear; }
.side__fold--open { grid-template-rows: 1fr; opacity: 1; }
.side__fold-clip { min-height: 0; overflow: hidden; }
.side__fold .overall, .side__fold .bookmarks { margin: 0; }
/* an open button and its block are one frame: the button loses its bottom corners, the block its top edge and corners;
   the block keeps the button's border colour (accent for «Прогресс», gold for «Избранное») and a thin line under the button */
.side__stat[aria-expanded="true"] { border-bottom-color: transparent; border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
.side__fold :is(.overall, .bookmarks) { border: 1.5px solid var(--fold-bc); border-top-width: 0; border-radius: 0 0 10px 10px; box-shadow: inset 0 1px var(--border); }
.side__fold .bookmarks { border-color: var(--gold-ink); }
/* «Избранное» has its own gold: softer than the shared one in the dark theme, deeper and more saturated in the light one
   (the shared #b38b27 is only 2.5:1 on the light sidebar); while open, the button and its list share a faint tint of the pure
   ribbon gold (the dark ink over the blue light sidebar turned grey) */
.side__bm-group { --gold-ink: #D9AC45; --bm-tint: color-mix(in srgb, var(--gold) 5%, var(--sheet)); --bm-tint-hover: color-mix(in srgb, var(--gold) 10%, var(--sheet)); }
:root[data-theme="light"] .side__bm-group { --gold-ink: #855E00; --bm-tint: color-mix(in srgb, var(--gold) 16%, transparent); --bm-tint-hover: color-mix(in srgb, var(--gold) 28%, transparent); }
/* :root .side … wins over the light-theme «no fill on sidebar controls» rules below */
:root .side .side__bm-group .side__bm.side__stat[aria-expanded="true"], .side__bm-group .side__fold .bookmarks { background: var(--bm-tint); }
:root .side .side__bm-group .side__bm.side__stat[aria-expanded="true"]:hover { background: var(--bm-tint-hover); }
/* while open, the block shows the progress bar, the percentage and the mistakes, so the button keeps only its title */
.side__stat[aria-expanded="true"] :is(.side__stat-bar, .side__stat-pct, .side__badge) { display: none; }
.side__fold .bookmarks__head { display: none; } /* the button above already says «Избранное» and the count */
.side__fold .bookmarks__empty { padding-top: 8px; }
.overall { padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--sheet); display: grid; gap: 8px; }
:root[data-theme="light"] .overall { background: none; } /* sits on the tinted sidebar like the other frames there */
/* the same for the controls in the sidebar: no grey sheet fill on the tinted paper (hover fills stay) */
:root[data-theme="light"] .side :is(.action-btn, .icon-btn, .search__input):not(:hover) { background: none; }
/* accent-soft is almost the paper colour, so on the sidebar the hover uses the stronger --hover of the contents list */
:root[data-theme="light"] .side :is(.action-btn, .icon-btn):hover { background: var(--hover); }
/* the theme toggles preview the palette they switch to: in the light theme a dark button with a violet moon and stars,
   in the dark theme a white button with a blue sun and rays (the doubled class and the order win over the sidebar hover rules) */
:root[data-theme="light"] .theme-toggle.theme-toggle:is(:hover, :focus-visible) { border-color: color-mix(in srgb, #ADA2FF 55%, transparent); background: #191C29; color: #ADA2FF; }
:root:not([data-theme="light"]) .theme-toggle.theme-toggle:is(:hover, :focus-visible) { border-color: color-mix(in srgb, #2547D0 55%, transparent); background: #FFFFFF; color: #2547D0; }
:root[data-theme="light"] .side .level-chip:not([aria-pressed="true"]) { --face: var(--paper); }
.overall__row { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--muted); }
.overall__value { color: var(--ink); font-variant-numeric: tabular-nums; font-weight: 600; }
/* the book progress at the bottom of the block: a title, the bar with the percentage and how it is counted */
.overall__book { display: grid; gap: 6px; margin-top: 4px; padding-top: 10px; border-top: 1px dashed var(--border); }
.overall__note { margin: 0; font-size: 11px; line-height: 1.4; color: var(--muted); }
/* «С ошибками»: a row that opens the «Работа над ошибками» page */
/* a muted red over a tint that rises from the bottom and fades into the block; it reaches past the row so the text stays in line.
   On hover the solid bottom part of the same gradient grows (--solid 0% → 100%), pushing the soft fade up and out past the top edge. */
@property --solid { syntax: '<percentage>'; inherits: false; initial-value: 0%; }
.overall__mistakes { --tint: 12%; --solid: 0%; align-items: center; width: calc(100% + 16px); margin-inline: -8px; margin-top: -3px; padding: 7px;
  border: 1px solid transparent; border-radius: 6px;
  /* eased fade: the red thins out along a curve and is gone before the top edge, so there is no visible line */
  background: linear-gradient(to top,
    color-mix(in srgb, var(--bad) var(--tint), transparent) 0%,
    color-mix(in srgb, var(--bad) var(--tint), transparent) var(--solid),
    color-mix(in srgb, var(--bad) calc(var(--tint) * .6), transparent) calc(var(--solid) + 30%),
    color-mix(in srgb, var(--bad) calc(var(--tint) * .25), transparent) calc(var(--solid) + 55%),
    color-mix(in srgb, var(--bad) calc(var(--tint) * .07), transparent) calc(var(--solid) + 75%),
    transparent calc(var(--solid) + 92%));
  /* the gradient spans the border box too: sized to the padding box it would repeat under the transparent border,
     and its strongest bottom edge would show as a red line along the top */
  background-origin: border-box;
  color: color-mix(in srgb, var(--bad) 70%, var(--muted)); font: inherit; font-size: 13px; text-align: left; cursor: pointer;
  transition: --solid .3s ease-out, border-color .3s ease-out; }
/* the outline shows only on hover (and keyboard focus) and while «Работа над ошибками» is open */
.overall__mistakes:is(:hover, :focus-visible, [aria-current="page"]) { border-color: color-mix(in srgb, var(--bad) 35%, transparent); }
.overall__mistakes .overall__value { color: inherit; }
/* the pale light theme needs a little more red to be noticed */
:root[data-theme="light"] .overall__mistakes { --tint: 16%; color: color-mix(in srgb, var(--bad) 88%, var(--muted)); }
.overall__mistakes:hover, .overall__mistakes:focus-visible, .overall__mistakes[aria-current="page"] { --solid: 100%; }
.overall__mistakes-end { display: flex; align-items: center; gap: 6px; }.bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.bar--thin { height: 4px; border-radius: 2px; }
.bar__fill { display: block; height: 100%; width: 0; background: var(--accent); transition: width .4s ease, background-color .4s ease; }
.bar__fill--full { background: var(--ok); } /* a bar filled to 100% turns green */
/* a taller bar with its percentage inside: dark over the track, light over the fill; the light copy is clipped to the fill (--p) */
.bar--labeled { position: relative; height: 16px; border-radius: 8px; }
.bar__label { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--f-mono); font-size: 10.5px; font-weight: 400; line-height: 1; color: var(--ink); font-variant-numeric: tabular-nums; }
.bar__label--on-fill { color: var(--on-accent); clip-path: inset(0 calc(100% - var(--p, 0%)) 0 0); transition: clip-path .4s ease; }

/* on desktop the drawer is just part of the sidebar; on mobile it slides in over the page */
.drawer { display: contents; }
.drawer__head, .side__menu, .side__theme, .drawer-backdrop { display: none; }


.level-chips { display: flex; flex-wrap: wrap; gap: 4px; }
/* Level chips: the level's progress rises from the bottom as green «liquid» (--lvl, set from the script), and the outline turns green
   up to the same line. The outline is drawn by a border-box gradient behind a padding-box fill, since border-image ignores rounded corners.
   --lvl is registered so it animates; «Все» has no liquid. */
@property --lvl { syntax: '<percentage>'; inherits: true; initial-value: 0%; }
.level-chip {
  --bc: color-mix(in srgb, var(--accent) 55%, transparent); /* outline above the liquid */
  --face: var(--sheet); /* chip background */
  position: relative; isolation: isolate; overflow: hidden; padding: 2px 7px; border: 1px solid transparent; border-radius: 99px;
  background: linear-gradient(var(--face), var(--face)) padding-box, linear-gradient(to top, var(--ok) var(--lvl), var(--bc) var(--lvl)) border-box;
  color: var(--muted); font-family: var(--f-mono); font-size: 12px; cursor: pointer; transition: --lvl .6s ease, color .15s linear;
}
.level-chip::before { content: ""; position: absolute; z-index: -1; left: 0; right: 0; bottom: 0; height: var(--lvl);
  background: color-mix(in srgb, var(--ok) 32%, transparent); box-shadow: inset 0 1px 0 color-mix(in srgb, var(--ok) 70%, transparent); }
.level-chip[data-level=""]::before { display: none; }
.level-chip[aria-pressed="true"]::before { background: color-mix(in srgb, var(--ok) 70%, transparent); }
/* light theme: the dark --ok at 32% turned sage-grey on the blue paper, so the liquid is a brighter green */
:root[data-theme="light"] .level-chip::before { background: color-mix(in srgb, #2ECC55 40%, transparent); }
/* under the pressed chip's blue the dark --ok has the same lightness and the liquid disappears:
   a lighter green, and bold white text */
:root[data-theme="light"] .level-chip[aria-pressed="true"]:not(.level-chip--done)::before { background: #25A84A; box-shadow: none; }
:root[data-theme="light"] .level-chip[aria-pressed="true"]:not(.level-chip--done) {
  /* the outline follows the fill: the same green up to the liquid line, the chip's blue above it */
  background: linear-gradient(var(--face), var(--face)) padding-box, linear-gradient(to top, #25A84A var(--lvl), var(--bc) var(--lvl)) border-box; }
.level-chip:hover { --bc: var(--accent); color: var(--ink); }
.level-chip[aria-pressed="true"] { --bc: var(--accent); --face: var(--accent); color: var(--on-accent); font-weight: 700; }
/* a level whose every topic is done at 100% (for «Все» — the whole book) turns green */
.level-chip--done, .level-chip--done:hover { --bc: var(--ok); color: var(--ok); }
.level-chip--done::before { box-shadow: none; } /* a full chip has no liquid surface line */
.level-chip--done[aria-pressed="true"] { --bc: var(--ok); --face: var(--ok); color: var(--on-accent); }

/* contents list: progress of the selected level on top, then the chapters as an accordion */
.toc { margin-top: 12px; padding: 4px; border: 1.5px solid color-mix(in srgb, var(--accent) 55%, transparent); border-radius: 10px; }
.toc__empty { margin: 16px 10px; font-size: 14px; color: var(--muted); }
/* one frame: «Содержание тренажера» with the level filter, the level progress and the chapters, split by thin lines */
.toc__section { display: grid; gap: 6px; padding: 0 10px 10px; border-bottom: 1px solid var(--border); }
.toc__label { font-size: 13px; font-weight: 600; color: var(--muted); }
.toc__note { display: block; margin-top: 2px; font-size: 10.5px; font-weight: 400; line-height: 1.35; opacity: .8; }

/* the search sits in its own frame above the contents */
.search { display: grid; gap: 6px; margin-top: 12px; padding: 10px 13px 13px; border: 1.5px solid color-mix(in srgb, var(--accent) 55%, transparent); border-radius: 10px; }
.search__label { font-size: 13px; font-weight: 600; color: var(--muted); }
.search__input { width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--sheet); color: var(--ink); font: inherit; font-size: 14.5px; transition: background-color .15s linear, border-color .15s linear; }
.search__input::placeholder { color: var(--muted); opacity: .4; }
.lvl-prog { display: grid; gap: 5px; padding: 8px 10px 10px; border-bottom: 1px solid var(--border); }
.lvl-prog[hidden] { display: none; }
/* «Разделы тренажера» folds the whole chapter list away, leaving only «Содержание» and the level filter */
/* a compact heading of the list, like «Уровни сложности»: the chapters start right under it, without a gap or a line;
   4px above the hover fill, like its inset from the frame sides, whether or not the level progress is shown */
.toc__toggle { display: flex; align-items: center; gap: 8px; width: 100%; margin-top: 4px; padding: 6px 10px; border: 0; border-radius: 8px; background: transparent; font: inherit; text-align: left; cursor: pointer; }
.toc__toggle:hover { background: var(--hover); }
.toc__toggle:hover .side__fold-arrow { color: var(--accent); }
.toc__toggle[aria-expanded="true"] .side__fold-arrow { transform: rotate(90deg); }
.toc__count { margin-left: auto; font-family: var(--f-mono); font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.toc__count + .side__fold-arrow { margin-left: 0; }
.lvl-prog__row { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.lvl-prog__value { color: var(--ink); font-variant-numeric: tabular-nums; font-weight: 600; }

/* 4px between the heading hover and the dividers, like «Разделы тренажера» */
.chap { position: relative; isolation: isolate; padding-block: 4px; }
.chap + .chap { border-top: 1px solid var(--border); }
/* the open chapter and the chapter of the open page are tinted cards, so their topics do not run into the next chapter heading.
   The dividers stay; the tint is drawn 4px inside them, like the heading hover (::before, inset 4px top and bottom) */
:is(.chap--open, .chap--current)::before { content: ""; position: absolute; z-index: -1; inset: 4px 0; border-radius: 8px; background: color-mix(in srgb, var(--accent) 19%, transparent); transition: background-color .15s linear; }
/* light theme: a clean periwinkle; the accent at 13% over the grey-blue paper looked muddy */
:root[data-theme="light"] :is(.chap--open, .chap--current)::before { background: #C8D3FA; }
/* --hover is about as dark as the tinted card, so inside it the hover is an extra accent layer */
:is(.chap--open, .chap--current) .topic-btn:not([aria-current]):hover { background: color-mix(in srgb, var(--accent) 20%, transparent); }
/* the card's heading has no hover box of its own: hovering it deepens the whole card, so there are only two tones */
:is(.chap--open, .chap--current) .chap__btn:hover { background: transparent; }
/* …only while the card is collapsed (the chapter of the open page); on an open card the heading hover adds nothing */
.chap--current:not(.chap--open):has(> .chap__btn:hover)::before { background: color-mix(in srgb, var(--accent) 27%, transparent); }
:root[data-theme="light"] .chap--current:not(.chap--open):has(> .chap__btn:hover)::before { background: #B9C7F8; }
/* inside the card the hovers are inset by another 4px on every side (8px from the dividers);
   the inner paddings shrink by the same 4px so the text stays in line with plain chapters */
:is(.chap--open, .chap--current) { padding: 8px 4px; }
:is(.chap--open, .chap--current) .chap__btn { padding: 7px 6px; } /* 8+7 = 4+11: the heading text does not jump when the chapter opens */
:is(.chap--open, .chap--current) .chap__topics { margin-left: 18px; }
.chap__btn { display: grid; grid-template-columns: 1.8em minmax(0, 1fr) auto; align-items: center; gap: 6px; width: 100%; padding: 11px 10px; border: 0; border-radius: 8px; background: transparent; color: var(--ink); font-size: 14.5px; font-weight: 600; line-height: 1.3; text-align: left; cursor: pointer;
  transition: background-color .15s linear, color .15s linear; } /* only colours animate: the global button transition also eased the padding, which changes when a chapter opens, and the text jumped */
.chap__btn:hover { background: var(--hover); }
.chap__num { font-family: var(--f-mono); font-size: 12px; font-weight: 500; color: var(--muted); }
/* the chapter of the open page: its number as a filled badge (the card tint is set above), visible while the chapter is collapsed */
.chap--current .chap__num { padding-block: 2px; border-radius: 6px; background: var(--accent); color: var(--on-accent); font-weight: 600; text-align: center; }
.chap__meta { display: block; margin-top: 1px; font-size: 12px; font-weight: 400; color: var(--muted); }
.chap__levels { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; font-weight: 500; }
.chap__end { display: flex; align-items: center; gap: 6px; }
/* the arrow only shows the accordion state; the whole .chap__btn is the control */
.chap__arrow { display: grid; place-items: center; width: 16px; height: 16px; color: var(--muted); }
.chap__btn:hover .chap__arrow { color: var(--accent); }
.chap__arrow-icon { transition: transform .15s linear; }
.chap--open .chap__arrow-icon { transform: rotate(90deg); }
.chap__body { display: grid; grid-template-rows: 0fr; opacity: 0; transition: grid-template-rows .15s linear, opacity .15s linear; }
.chap--open .chap__body { grid-template-rows: 1fr; opacity: 1; }
.chap__clip { min-height: 0; overflow: hidden; }
.chap__topics { display: grid; gap: 6px; margin: 2px 0 6px 22px; padding-left: 8px; border-left: 1px solid var(--border); }
/* a thin accent-tinted line in the middle of the gap between topics, in a chapter and in «Избранное» */
.chap__topic, .bookmarks__topic { position: relative; }
.chap__topic + .chap__topic::before, .bookmarks__topic + .bookmarks__topic::before { content: ""; position: absolute; left: 10px; right: 10px; top: -3.5px; height: 1px; background: color-mix(in srgb, var(--accent) 30%, transparent); }

.topic-btn { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 8px; width: 100%; padding: 6px 10px; border: 0; border-radius: 8px; background: transparent; color: var(--ink); font-size: 14px; line-height: 1.3; text-align: left; cursor: pointer; }
.topic-btn:hover { background: var(--hover); }
/* an overview link: «Содержание тренажера →» at the top of the contents box, «Обзор всего раздела →» first in an expanded chapter */
.topic-btn--overview { font-size: 13px; font-weight: 600; color: var(--accent); }
.topic-btn__arrow { font-size: 17.5px; font-weight: 700; line-height: 1; }
/* an arrow in a link-like button nudges the way it points while the button is hovered or focused */
.arrow { display: inline-block; transition: transform .15s ease; }
:is(.topic-btn, .pager__btn, .pager-level__link, .overall__mistakes, .ex__redo-link, .mistakes__start):is(:hover, :focus-visible) .arrow--next { transform: translateX(3px); }
:is(.topic-btn, .pager__btn, .pager-level__link, .ex__redo-link):is(:hover, :focus-visible) .arrow--prev { transform: translateX(-3px); }
/* «Содержание тренажера» spans its section edge to edge, the text lines up with the labels; declared after .topic-btn so it wins */
.toc__contents { width: auto; margin: 0 -10px -2px; } /* -2px with the 6px grid gap leaves the same space under the text as above it */
/* a full-width line under «Содержание тренажера» so the menu link does not merge with the level filter */
.toc__contents + .toc__label { margin-inline: -10px; padding: 8px 10px 0; border-top: 1px solid var(--border); }
.topic-btn__meta { display: block; margin-top: 1px; font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .04em; color: var(--muted); }
.topic-btn[aria-current="page"] { background: var(--accent); color: var(--on-accent); }
.topic-btn[aria-current="page"] .topic-btn__meta { color: inherit; opacity: .8; }
.topic-btn__studied { color: var(--ok); }
.topic-btn[aria-current="page"] .topic-btn__studied { color: inherit; }

.pill { font-family: var(--f-mono); font-size: 11px; padding: 1px 7px; border-radius: 99px; border: 1px solid var(--border); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
/* below 100% the pill is filled up to its value: red up to 30%, yellow up to 60%, green up to 99%; the fill fades a little towards its edge */
.pill--low { --pc: var(--bad); }
.pill--mid { --pc: var(--mid); }
.pill--high { --pc: var(--ok); }
.pill--low, .pill--mid, .pill--high { color: color-mix(in srgb, var(--pc) 65%, var(--muted)); border-color: color-mix(in srgb, var(--pc) 35%, transparent);
  background: linear-gradient(90deg, color-mix(in srgb, var(--pc) 20%, transparent), color-mix(in srgb, var(--pc) 9%, transparent) var(--p), transparent var(--p)); }
/* the colours are muted towards the grey text so the pills do not pull focus; a little less colour still on the pale light theme */
:root[data-theme="light"] :is(.pill--low, .pill--mid, .pill--high) { color: color-mix(in srgb, var(--pc) 60%, var(--muted)); }
/* the red pill on the dark theme: a stronger fill so it reads as red, and a lighter text to keep 4.5:1 on it */
:root:not([data-theme="light"]) .pill--low { color: color-mix(in srgb, var(--bad) 80%, var(--ink));
  background: linear-gradient(90deg, color-mix(in srgb, var(--bad) 26%, transparent), color-mix(in srgb, var(--bad) 12%, transparent) var(--p), transparent var(--p)); }
.pill--good { color: var(--ok); border-color: var(--ok); background: color-mix(in srgb, var(--ok) 18%, transparent); }
:root[data-theme="light"] .pill--good { background: var(--ok-soft); }
.topic-btn[aria-current="page"] .topic-btn__pill { color: inherit; border-color: currentColor; background: none; }

/* bookmarks: a gold ribbon next to the topic title, and the «Избранное» list at the bottom of the sidebar */
.bm-icon { display: inline-block; width: 11px; height: 14px; margin-left: 6px; vertical-align: -1px; color: var(--gold); }
/* in the sidebar the ribbon is accent-coloured and turns gold on hover and on the active topic */
.topic-btn__bm { color: var(--accent); transition: color .2s linear; }
/* hover uses the same gold as the heading and the active bookmark; on the accent fill of the active topic the brighter gold reads better */
.topic-btn:hover .topic-btn__bm, .topic-btn:focus-visible .topic-btn__bm { color: var(--gold-ink); }
.topic-btn[aria-current="page"] .topic-btn__bm { color: var(--gold); }
.bookmarks { margin-top: 12px; padding: 4px; border: 1.5px solid color-mix(in srgb, var(--accent) 55%, transparent); border-radius: 10px; transition: border-color .2s linear; }
.bookmarks__head { display: flex; align-items: center; gap: 6px; padding: 8px 10px 6px; font-size: 12px; font-weight: 600; color: var(--muted); transition: color .2s linear; }
.bookmarks__icon { margin: 0; color: var(--accent); transition: color .2s linear; }
.bookmarks__count { margin-left: auto; font-family: var(--f-mono); font-weight: 500; font-variant-numeric: tabular-nums; }
.bookmarks__list { display: grid; gap: 6px; }
/* level chips of «Избранное»: the same small pills as the menu filter, but gold like the block */
.bookmarks__levels { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px 10px 6px; }
.bookmarks__level { padding: 2px 7px; border: 1px solid color-mix(in srgb, var(--gold-ink) 55%, transparent); border-radius: 99px; background: transparent;
  color: var(--muted); font-family: var(--f-mono); font-size: 12px; cursor: pointer; transition: color .15s linear, border-color .15s linear, background-color .15s linear; }
.bookmarks__level:is(:hover, :focus-visible) { border-color: var(--gold-ink); color: var(--gold-ink); }
.bookmarks__level[aria-pressed="true"] { border-color: var(--gold-ink); background: var(--gold-ink); color: var(--sheet); }
.bookmarks__empty { margin: 0; padding: 2px 10px 8px; font-size: 13px; color: var(--muted); }
/* the frame and the heading (ribbon, «Избранное», count) light up while a bookmark is hovered or the open topic came from this list */
.bookmarks--active, .bookmarks:has(.topic-btn:hover, .topic-btn:focus-visible) { border-color: var(--gold-ink); }
.bookmarks--active .bookmarks__head, .bookmarks:has(.topic-btn:hover, .topic-btn:focus-visible) .bookmarks__head,
.bookmarks--active .bookmarks__icon, .bookmarks:has(.topic-btn:hover, .topic-btn:focus-visible) .bookmarks__icon { color: var(--gold-ink); }
/* the active topic in «Избранное» is gold like the pressed «В избранном» button; the title keeps the ink colour so it stays readable */
.bookmarks__topic[aria-current="page"] { background: var(--gold-soft); color: var(--ink); }
.bookmarks__topic[aria-current="page"] .topic-btn__meta, .bookmarks__topic[aria-current="page"] .topic-btn__bm { color: var(--gold-ink); opacity: 1; }
.bookmarks__topic[aria-current="page"] .topic-btn__pill { color: var(--gold-ink); border-color: var(--gold-ink); background: none; }

/* ---------- Sheet ---------- */
.sheet {
  /* 100vh minus the 8px body margin above and below, or a short page still scrolls by 16px */
  min-width: 0; min-height: calc(100vh - 16px); padding-block: 36px 18px; padding-inline: clamp(18px, 5vw, 64px);
  background-color: var(--sheet);
  border-left: 1px solid var(--border);
  border-radius: 10px;
}
.sheet__inner { max-width: 880px; margin-inline: auto; }
.sheet__title { font-family: var(--f-display); font-weight: 700; font-size: clamp(26px, 4.4vw, 40px); line-height: 1.12; letter-spacing: -.02em; margin: 12px 0 6px; text-wrap: balance; }
.sheet__lead { margin: 0; font-family: var(--f-en); font-style: italic; font-size: 19px; color: var(--muted); }
.sheet__intro { margin: 16px 0 0; }
.sheet__section { display: flex; align-items: center; gap: 12px; margin: 40px 0 16px; font-family: var(--f-mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.sheet__section::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.sheet__fine { margin-top: 24px; font-size: 13.5px; font-style: italic; text-align: center; color: var(--muted); }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-family: var(--f-mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.crumbs__link { padding: 0; border: 0; background: none; color: var(--accent); font: inherit; letter-spacing: inherit; text-transform: inherit; cursor: pointer; }
.crumbs__link:hover { text-decoration: underline; }
.crumbs__sep { opacity: .6; }
.lvl-tag { display: inline-block; padding: 0 6px; border: 1px solid currentColor; border-radius: 4px; font-family: var(--f-mono); font-size: 11px; letter-spacing: .04em; color: var(--accent); }
.lvl-tag--sm { font-size: 10px; line-height: 1.5; }
.lvl-tag--filled { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

.page-prog { display: grid; gap: 5px; margin-top: 16px; padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px; }
.page-prog__row { display: flex; justify-content: space-between; gap: 12px; font-size: 12.5px; color: var(--muted); }
.page-prog__value { text-align: right; color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.page-prog__levels { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 6px 16px; margin-top: 3px; padding-top: 7px; border-top: 1px dashed var(--border); }
.page-prog__level { display: grid; grid-template-columns: auto minmax(0, 1fr) 2.8em; align-items: center; gap: 6px; font-size: 11.5px; }
.page-prog__tag { font-size: 10px; }

/* Contents */
/* framed like the contents list in the sidebar */
.contents { list-style: none; margin: 24px 0 0; padding: 4px; border: 1.5px solid color-mix(in srgb, var(--accent) 55%, transparent); border-radius: 10px; }
.contents__item { padding-block: 4px; }
.contents__item + .contents__item { border-top: 1px solid var(--border); }
.contents__row { display: grid; grid-template-columns: 2.2em minmax(0, 1fr) auto; gap: 4px 10px; align-items: baseline; width: 100%; padding: 10px 12px; border: 0; border-radius: 8px; background: none; color: var(--ink); text-align: left; cursor: pointer; }
.contents__row:hover { background: var(--hover); }
.contents__row:hover .contents__title { color: var(--accent); }
.contents__num { font-family: var(--f-mono); font-size: 13px; color: var(--muted); }
.contents__title { display: flex; align-items: baseline; gap: 8px; min-width: 0; font-size: 17px; font-weight: 600; }
.contents__title::after { content: ""; flex: 1; min-width: 20px; border-bottom: 2px dotted var(--border); }
.contents__page { font-family: var(--f-mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.contents__meta { grid-column: 2 / 4; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 13px; color: var(--muted); }
.contents__levels { display: inline-flex; gap: 3px; }
.contents__bar { width: 120px; align-self: center; }

/* «Работа над ошибками»: the same frame as the contents, one row per topic with a button per exercise */
.mistakes { list-style: none; margin: 24px 0 0; padding: 4px; border: 1.5px solid color-mix(in srgb, var(--accent) 55%, transparent); border-radius: 10px; }
.mistakes__item { display: grid; gap: 8px; padding: 12px; }
.mistakes__item + .mistakes__item { border-top: 1px solid var(--border); }
.mistakes__head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.mistakes__num { font-family: var(--f-mono); font-size: 13px; color: var(--muted); }
.mistakes__title { padding: 0; border: 0; background: none; color: var(--ink); font-size: 17px; font-weight: 600; text-align: left; cursor: pointer; }
.mistakes__title:hover { color: var(--accent); }
.mistakes__chapter { flex-basis: 100%; font-size: 12.5px; color: var(--muted); } /* the chapter on its own line under the title */
.mistakes__exs { display: flex; flex-wrap: wrap; gap: 6px; }
.mistakes__ex { padding: 3px 12px; border: 1.5px solid color-mix(in srgb, var(--accent) 55%, transparent); border-radius: 99px; background: var(--sheet); color: var(--accent); font-family: var(--f-mono); font-size: 12px; cursor: pointer; }
.mistakes__ex:hover { border-color: var(--accent); background: var(--accent-soft); }
.mistakes__score { color: var(--bad); }
.mistakes__note { color: var(--muted); }
.mistakes__hint { margin: 8px 0 0; font-size: 13.5px; color: var(--muted); }
.mistakes__tools { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; margin-top: 20px; }
.mistakes__tools + .mistakes { margin-top: 12px; }
.mistakes__levels { display: flex; flex-wrap: wrap; gap: 6px; }
.mistakes__start { display: inline-flex; align-items: center; gap: 8px; margin-left: auto; padding: 8px 16px; border: 1.5px solid var(--accent); border-radius: 10px;
  background: var(--accent); color: var(--on-accent); font-size: 14px; font-weight: 600; cursor: pointer; transition: filter .15s; }
.mistakes__start:hover { filter: brightness(1.12); }
.mistakes__level { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border: 1.5px solid color-mix(in srgb, var(--accent) 55%, transparent); border-radius: 99px;
  background: var(--sheet); color: var(--accent); font-family: var(--f-mono); font-size: 13px; font-weight: 600; cursor: pointer; }
.mistakes__level:hover { border-color: var(--accent); background: var(--accent-soft); }
.mistakes__level[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: var(--on-accent); }
.mistakes__level-count { font-weight: 400; opacity: .75; }
.mistakes__empty { margin: 24px 0 0; padding: 16px; border: 1.5px dashed color-mix(in srgb, var(--accent) 55%, transparent); border-radius: 10px; color: var(--muted); }

.topic-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; margin-top: 24px; }
.topic-card { display: grid; gap: 6px; align-content: start; padding: 14px 16px; border: 1px solid var(--border); border-radius: 10px; background: var(--sheet); color: var(--ink); text-align: left; cursor: pointer; }
.topic-card:hover { border-color: var(--accent); }

.topic-card__bar { flex: 1; }
.topic-card__studied { color: var(--ok); font-size: 13px; font-weight: 600; }
/* a 100% figure next to a progress bar is green like the bar; declared after every value colour so it wins */
.pct--full { color: var(--ok); }

/* Rule */
.rule p { margin: 0 0 14px; }
.rule h3 { margin: 28px 0 10px; font-size: 17px; font-weight: 700; text-wrap: balance; }
.rule i { font-family: var(--f-en); font-style: normal; }
.rule i b, .examples__en b { font-weight: 600; background: linear-gradient(transparent -10%, var(--hl) 160%); }
.formula { margin: 0 0 14px; padding: 10px 14px; border-radius: 8px; background: var(--accent-soft); font-family: var(--f-en); font-size: 17px; }

.rule-table__table { width: 100%; border-collapse: collapse; font-size: 15px; }

.rule-table__row:last-child .rule-table__cell { border-bottom: 0; }
.rule-table__th + .rule-table__th, .rule-table__cell + .rule-table__cell { border-left: 1px solid var(--border); }
.examples { list-style: none; margin: 0 0 16px; padding: 0; }
.examples__item { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 16px; padding: 7px 0; border-bottom: 1px dashed var(--border); }

:root[data-theme="dark"] .note { background: color-mix(in srgb, var(--bad-soft) 25%, var(--sheet)); }
.note::before { content: "Важно"; font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--bad); align-self: center; }
.markers { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 0 0 16px; }
.markers__label { margin-right: 4px; font-size: 13.5px; color: var(--muted); }
.markers__word { padding: 1px 10px; border: 1px solid var(--border); border-radius: 99px; background: var(--sheet); font-family: var(--f-en); font-size: 14.5px; }

/* «Правило изучено» and «Добавить в избранное» under the rule */
.study { margin-top: 20px; }
.study__btn { display: block; width: 100%; }
.study__btn[aria-pressed="false"] { border: 1.5px solid color-mix(in srgb, var(--accent) 55%, transparent); color: var(--accent); }
.study__btn[aria-pressed="false"]:hover { border-color: var(--accent); background: var(--accent-soft); }
.study__btn[aria-pressed="true"] { border-color: var(--ok); background: var(--ok-soft); color: var(--ok); }
.study__btn + .study__btn { margin-top: 8px; }

.bm-pop { position: relative; display: inline-block; margin-right: 6px; }
.bm-pop .study__icon { margin: 0; transform-origin: 50% 0; animation: bm-swing 1.5s ease-in-out both; }
@keyframes bm-swing { 12% { transform: rotate(-6deg); } 28% { transform: rotate(12deg); } 45% { transform: rotate(-9deg); }
  62% { transform: rotate(6deg); } 78% { transform: rotate(-3deg); } 90% { transform: rotate(1deg); } 100% { transform: none; } }
.bm-pop__spark { position: absolute; left: calc(50% + var(--x)); top: calc(50% + var(--y)); width: 5px; height: 5px; margin: -2.5px; opacity: 0;
  background: linear-gradient(currentColor, currentColor) center / 100% 1.5px no-repeat, linear-gradient(currentColor, currentColor) center / 1.5px 100% no-repeat;
  animation: bm-spark .8s var(--d) ease-out both; }
.bm-pop__spark--dot { width: 3px; height: 3px; margin: -1.5px; border-radius: 50%; background: currentColor; }
@keyframes bm-spark { 0% { opacity: 0; transform: scale(0); } 35% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(.5); } }
/* «Правило изучено»: on pressing, the ✓ lands like a slot-machine reel — a column of symbols behind a one-line window, resting on the last one */
/* the window sat at the bottom of the taller line box, 0.18em below the text centre; lifted back */
.slot { position: relative; top: -.18em; display: inline-block; height: 1.25em; line-height: 1.25em; overflow: hidden; vertical-align: bottom; }
.slot__reel { display: block; transform: translateY(calc(-1.25em * var(--last))); }
.slot__reel > span { display: block; height: 1.25em; text-align: center; }
/* the reel runs past the ✓ by .2em, then snaps back in the last .28s (an eased overshoot crawled for half a second) */
.slot--spin .slot__reel { animation: slot-spin 1.4s linear; }
@keyframes slot-spin {
  from { transform: translateY(0); filter: blur(.6px); animation-timing-function: cubic-bezier(.3, .45, .55, 1); }
  80% { transform: translateY(calc(-1.25em * var(--last) - .2em)); filter: none; animation-timing-function: ease-out; }
  to { transform: translateY(calc(-1.25em * var(--last))); }
}

/* ---------- Exercises ---------- */
.ex { margin: 0 0 28px; padding: 20px clamp(14px, 3vw, 26px); border: 1px solid var(--border); border-radius: 12px; background: var(--sheet); scroll-margin-top: 16px; }
/* an exercise opened from «С ошибками» flashes its outline once */
.ex--flash { animation: ex-flash 1.6s ease-out; }
@keyframes ex-flash { 0%, 35% { box-shadow: 0 0 0 3px var(--accent); } 100% { box-shadow: 0 0 0 3px transparent; } }
.ex:last-of-type { margin-bottom: 0; } /* the gap to the pager is set by .pager-current */
.ex__head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin-bottom: 8px; }
.ex__num { font-family: var(--f-display); font-weight: 700; font-size: 14px; color: var(--accent); }
.ex__task { margin: 0; font-weight: 600; }
.ex__items { list-style: none; margin: 0; padding: 0; counter-reset: it; }
.ex__item { counter-increment: it; display: grid; grid-template-columns: 2em minmax(0, 1fr); gap: 4px 6px; padding: 10px 0; border-bottom: 1px dashed var(--border); }
.ex__item:last-child { border-bottom: 0; }
.ex__item::before { content: counter(it) "."; grid-row: 1; padding-top: 6px; font-family: var(--f-mono); font-size: 13px; color: var(--muted); }
.ex__q { grid-column: 2; font-family: var(--f-en); font-size: 18px; line-height: 1.9; overflow-wrap: anywhere; }
.ex__q--ru { font-family: var(--f-body); font-size: 16.5px; line-height: 1.6; padding-top: 3px; }
.ex__text { font-family: var(--f-en); font-size: 18px; line-height: 2.15; overflow-wrap: anywhere; }
.ex__hint { font-family: var(--f-body); font-size: 14px; color: var(--muted); }
/* answer fields: .ex__gap inside a sentence, .ex__tr for a whole translation, .ex__blank shows the chosen option */
.ex__gap { max-width: 100%; margin: 0 3px; padding: 0 4px; border: 0; border-bottom: 2px solid var(--muted); border-radius: 0; background: transparent; color: var(--accent); font: inherit; font-family: var(--f-en); text-align: center; }
.ex__tr { grid-column: 2; width: 100%; padding: 4px 4px; border: 0; border-bottom: 2px solid var(--muted); border-radius: 0; background: transparent; color: var(--accent); font-family: var(--f-en); font-size: 17px; }
.ex__blank { display: inline-block; min-width: 3.5em; margin: 0 3px; padding: 0 4px; border-bottom: 2px solid var(--muted); color: var(--accent); text-align: center; line-height: 1.5; }
.ex__field:focus { outline: none; border-bottom-color: var(--accent); background: var(--accent-soft); }
.ex__field--ok, .ex__field--ok:focus { color: var(--ok); border-bottom-color: var(--ok); }
.ex__field--bad, .ex__field--bad:focus { color: var(--bad); border-bottom-color: var(--bad); }
.ex__field--miss, .ex__field--miss:focus, .ex__blank--miss { border-bottom-color: var(--bad); border-bottom-style: dashed; }
.ex__inline-key { margin-right: 4px; font-family: var(--f-en); font-style: italic; font-size: 15px; color: var(--bad); }
.ex__verdict { margin-left: 8px; font-family: var(--f-body); font-weight: 700; font-size: 16px; }
.ex__verdict--ok { color: var(--ok); }
:root[data-theme="light"] .ex__verdict--ok { color: #0c942c; } /* a brighter green just for the ✓ next to a right answer */
.ex__verdict--bad { color: var(--bad); }
.ex__opts { grid-column: 2; display: flex; flex-wrap: wrap; gap: 6px; }
/* Literata sits low in its line box: the padding moved from top to bottom centres the lowercase letters (same height) */
.ex__opt { padding: 1px 13px 5px; border: 1px solid var(--border); border-radius: 99px; background: var(--well); color: var(--ink); font-family: var(--f-en); font-size: 15.5px; cursor: pointer; }
.ex__opt:hover { border-color: var(--accent); }
.ex__opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.ex__opt--ok, .ex__opt--ok:is(:hover, [aria-pressed="true"]) { border-color: var(--ok); background: var(--ok-soft); color: var(--ok); }
/* light theme: --ok-soft is almost the sheet colour (1.01:1), so a right option gets a slightly greener fill and a deeper green text (5.4:1) */
:root[data-theme="light"] .ex__opt--ok, :root[data-theme="light"] .ex__opt--ok:is(:hover, [aria-pressed="true"]) { background: #CDEED5; color: #066B1D; }
.ex__opt--bad, .ex__opt--bad:is(:hover, [aria-pressed="true"]) { border-color: var(--bad); background: var(--bad-soft); color: var(--bad); }
.ex__opt--key:not(.ex__opt--ok) { border-color: var(--ok); border-style: dashed; }
.ex__key { grid-column: 2; font-family: var(--f-en); font-style: italic; font-size: 15.5px; color: var(--ok); }
.ex__key--wrong { color: var(--bad); }
.ex__self-ok { grid-column: 2; justify-self: start; padding: 2px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--well); color: var(--muted); font-size: 13px; cursor: pointer; }
.ex__self-ok:hover { border-color: var(--ok); color: var(--ok); }
.ex__foot { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
.ex__btn:not(.btn--primary):hover { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.ex__score { margin-left: auto; font-weight: 600; font-variant-numeric: tabular-nums; }
.ex__score--good { color: var(--ok); }
.ex__score--low { color: var(--bad); }
.ex__redo { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin-top: 14px; padding: 10px 12px; border: 1px dashed var(--border); border-radius: 10px;
  background: color-mix(in srgb, var(--accent) 4%, transparent); transition: border-color .3s, background-color .3s; }
.ex__redo--done { border-style: solid; border-color: color-mix(in srgb, var(--ok) 55%, transparent); background: color-mix(in srgb, var(--ok) 8%, transparent); }
.ex__redo-status { flex-basis: 100%; margin: 0; color: var(--ok); font-size: 14px; font-weight: 600; }
.ex__redo-link { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border: 1.5px solid color-mix(in srgb, var(--accent) 55%, transparent); border-radius: 8px;
  background: var(--sheet); color: var(--accent); font-size: 13px; font-weight: 600; cursor: pointer; }
.ex__redo-link:hover { border-color: var(--accent); background: var(--accent-soft); }
.ex__redo-link--next { margin-left: auto; }

/* ---------- Pager ---------- */
.pager-current { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px 8px; margin-top: 20px;
  font-family: var(--f-mono); font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); text-align: center; }
/* the title of the open page in the body font, so it reads as a name rather than a caption */
.pager-current__title { font-family: var(--f-body); font-size: 14px; font-weight: 600; letter-spacing: 0; text-transform: none; color: var(--ink); }
.pager { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 20px; }
.pager__btn { display: grid; gap: 2px; padding: 12px 16px; border: 1.5px solid color-mix(in srgb, var(--accent) 55%, transparent); border-radius: 10px; background: var(--sheet); color: var(--accent); font-weight: 600; text-align: left; cursor: pointer; }
.pager__btn:hover { border-color: var(--accent); background: var(--accent-soft); }
.pager__btn--next { text-align: right; grid-column: 2; }
.pager__label { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; font-family: var(--f-mono); font-size: 11.5px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.pager__btn--next .pager__label { justify-content: flex-end; }
.pager__levels { display: inline-flex; gap: 4px; }

/* set apart from the main pager by a wider gap and a faint accent tint */
.pager-level { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 12px; margin-top: 24px; padding: 10px 12px 12px; border: 1px dashed var(--border); border-radius: 10px; background: color-mix(in srgb, var(--accent) 4%, transparent); }
.pager-level__label { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px; font-family: var(--f-mono); font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
/* small cards in the style of the main pager buttons: a direction caption over the topic title */
.pager-level__link { display: grid; gap: 1px; padding: 8px 12px; border: 1.5px solid color-mix(in srgb, var(--accent) 55%, transparent); border-radius: 8px;
  background: var(--sheet); color: var(--accent); font-size: 14px; font-weight: 600; line-height: 1.35; text-align: left; cursor: pointer; }
.pager-level__link:hover { border-color: var(--accent); background: var(--accent-soft); }
.pager-level__dir { font-family: var(--f-mono); font-size: 11px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }

/* scroll-to-top: appears once 30% of the page has been scrolled */
.to-top { position: fixed; z-index: 6; right: 24px; bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); display: grid; place-items: center; width: 54px; height: 54px; padding: 0;
  border: 1.5px solid color-mix(in srgb, var(--accent) 55%, transparent); border-radius: 12px; background: var(--sheet); color: var(--accent); cursor: pointer;
  box-shadow: 0 4px 14px rgba(0, 0, 0, .14); opacity: 0; visibility: hidden; transform: translateY(8px);
  transition: opacity .15s linear, transform .15s linear, visibility .15s linear, background-color .15s linear, border-color .15s linear; }
.to-top--visible { opacity: 1; visibility: visible; transform: none; }
.to-top:hover { border-color: var(--accent); background: var(--accent-soft); }

@media (max-width: 880px) {

  .app { grid-template-columns: minmax(0, 1fr); gap: 0; padding-inline: 0; }

  /* top bar: brand, theme and menu buttons; stays on screen while scrolling */
  .side { position: sticky; top: 0; z-index: 20; max-height: none; overflow: visible; scrollbar-gutter: auto;
    padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 10px; background: var(--paper); border-bottom: 1px solid var(--border); }
  .side__head { align-items: center; }
  .brand__title { font-size: 18px; gap: 6px; }
  .brand__logo { width: 33px; height: 33px; top: 1.5px; }
  .brand__sub { display: none; }
  .icon-btn { width: 38px; height: 38px; }
  .side__menu { display: flex; flex: none; }
  /* on mobile the theme is an icon in the top bar, so the drawer has no action row */
  .side__theme { display: grid; flex: none; width: 40px; height: 40px; border: 1.5px solid color-mix(in srgb, var(--accent) 55%, transparent); border-radius: 10px; color: var(--accent); }
  .side__theme:hover { background: var(--accent-soft); }
  .side__actions { display: none; }

  /* drawer: progress, levels, search and contents */
  .drawer { display: block; position: fixed; z-index: 30; top: 0; bottom: 0; left: 0; width: min(360px, 88vw); overflow-y: auto; overscroll-behavior: contain;
    padding: calc(env(safe-area-inset-top, 0px) + 12px) 14px calc(env(safe-area-inset-bottom, 0px) + 24px); background: var(--paper); border-right: 1px solid var(--border);
    box-shadow: 8px 0 24px rgba(0, 0, 0, .18); transform: translateX(-105%); visibility: hidden; transition: transform .2s ease, visibility .2s linear; }
  .drawer--open { transform: none; visibility: visible; }
  .drawer__head { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-family: var(--f-display); font-weight: 700; font-size: 17px; }
  .side__summary { margin-top: 12px; }
  .drawer-backdrop { display: block; position: fixed; z-index: 25; inset: 0; background: rgba(8, 10, 20, .45); opacity: 0; visibility: hidden; transition: opacity .2s linear, visibility .2s linear; }

  .ex { scroll-margin-top: 76px; } /* clears the sticky top bar */

}
@media (max-width: 560px) {

  .note { grid-template-columns: minmax(0, 1fr); gap: 6px; }
  .note::before { align-self: start; }
  .ex { padding: 16px 14px; }

  .contents__bar { width: 80px; }
  /* rule tables become stacked cards: one row per card, column names as labels */
  .rule-table { overflow: visible; border: 0; background: none; }

  .rule-table__cell { padding: 6px 12px; border: 0; }

}

<script>
/* Helpers used by the data files to write rules. */
window.BOOK = [];
const T = (head, rows) => {

};
const E = list => `<ul class="examples">${list.map(([en, ru]) => `<li class="examples__item"><span class="examples__en">${en}</span><span class="examples__ru">${ru}</span></li>`).join('')}</ul>`;
const N = t => `<div class="note"><div>${t}</div></div>`;
const M = (label, words) => `<div class="markers"><span class="markers__label">${label}</span>${words.map(w => `<span class="markers__word">${w}</span>`).join('')}</div>`;
const F = t => `<div class="formula">${t}</div>`;
</script>
