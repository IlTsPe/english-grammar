.mistakes__head { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: baseline; gap: 4px 10px; }
.mistakes__num { font-family: var(--f-mono); font-size: 13px; color: var(--muted); }
.mistakes__title { justify-self: start; padding: 0; border: 0; background: none; color: var(--ink); font-size: 17px; font-weight: 600; text-align: left; cursor: pointer; }
@media (hover: hover) { :where(:root:not(.pointer-still)) .mistakes__title:hover { color: var(--accent); } }
.mistakes__title .lvl-tag { margin-left: 8px; font-weight: 400; vertical-align: 2px; }
.mistakes__chapter { grid-column: 1 / -1; font-size: 12.5px; color: var(--muted); }
.mistakes__exs { display: flex; flex-wrap: wrap; gap: 6px; }
.mistakes__ex { padding: 3px 12px; border: 1.5px solid color-mix(in srgb, var(--accent) 55%, transparent); border-radius: 99px; background: var(--sheet); color: var(--accent); font-family: var(--f-mono); font-size: 12px; cursor: pointer; }
@media (hover: hover) { :where(:root:not(.pointer-still)) .mistakes__ex:hover { border-color: var(--accent); background: var(--accent-soft); } }
.mistakes__score { color: var(--bad); }
.mistakes__note { color: var(--muted); }
.mistakes__tools { display: flex; flex-wrap: wrap; align-items: center; row-gap: 12px; margin-top: 20px; }
.mistakes__tools + .mistakes { margin-top: 12px; }
.mistakes__levels { display: flex; flex-wrap: wrap; gap: 6px; }
/* calm, in the colors of the menu buttons (as «Сохранить» in «Резервная копия») */
.mistakes__start { display: inline-flex; align-items: center; gap: 8px; margin-left: auto; padding: 8px 16px; border: 1.5px solid color-mix(in srgb, var(--accent) 55%, transparent); border-radius: 10px;
  background: none; color: var(--accent); font-size: 14px; font-weight: 600; cursor: pointer; transition: border-color .15s, background-color .15s; }
.mistakes__start:is(:focus-visible):not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
@media (hover: hover) {
  :where(:root:not(.pointer-still)) .mistakes__start:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
  :root[data-theme="light"]:where(:root:not(.pointer-still)) .mistakes__start:not(:disabled):hover { background: var(--hover); }
}
.mistakes__start:disabled { opacity: .45; cursor: default; }
/* the chips and the button do not fit in one row: the button goes under the chips across the whole width (set by the script) */
.mistakes__tools--stacked .mistakes__start { flex: 1 1 100%; justify-content: center; margin-left: 0; }
.mistakes__start:disabled .arrow--next { transform: none; }
.mistakes__level { display: inline-flex; align-items: center; gap: 8px; padding: 4px 4px 4px 10px; border: 1.5px solid color-mix(in srgb, var(--accent) 55%, transparent); border-radius: 99px;
  background: var(--sheet); color: var(--accent); font-family: var(--f-mono); font-size: 13px; font-weight: 600; cursor: pointer; }
@media (hover: hover) { :where(:root:not(.pointer-still)) .mistakes__level:hover { border-color: var(--accent); background: var(--accent-soft); } }
.mistakes__level[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: var(--on-accent); }
/* the count sits in its own bubble, so «A1 1» does not read as one label */
.mistakes__level-count { min-width: 20px; padding: 1px 6px; border-radius: 99px; background: color-mix(in srgb, var(--accent) 24%, var(--sheet)); font-size: 12px; font-weight: 600; text-align: center; }
.mistakes__level[aria-pressed="true"] .mistakes__level-count { background: color-mix(in srgb, var(--on-accent) 22%, transparent); }
/* «Мои заметки»: free notes, not tied to topics — each a card: the text (a field while editing, it grows with the text),
   then the date and the buttons; «Удалить» turns the footer into a question */
.notes-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; margin-top: 20px; }
.notes-tools__add { margin-left: 0; }
.notes-tools__hint { font-size: 13.5px; color: var(--bad-ink); }
.notes-tools__search { flex: 0 1 280px; min-width: 0; margin-left: auto; padding: 9px 12px; border: 1.5px solid color-mix(in srgb, var(--accent) 55%, transparent); border-radius: 10px;
  background: var(--sheet); color: var(--ink); font: inherit; font-size: 14px; }
.notes-tools__search::placeholder { color: var(--muted); }
.notes-tools__search:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.notes-tools__search[hidden] { display: none; }
.notes-list__none { margin: 16px 0 0; padding: 16px; border: 1.5px dashed color-mix(in srgb, var(--accent) 55%, transparent); border-radius: 10px; color: var(--muted); }
.notes-list__none[hidden], .notes-list__item[hidden], .paging[hidden] { display: none; }
.notes-tools { scroll-margin-top: 16px; }
.paging { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 20px; }
.paging__btn { display: inline-grid; place-items: center; min-width: 38px; height: 38px; padding: 0 10px; border: 1.5px solid color-mix(in srgb, var(--accent) 55%, transparent); border-radius: 10px;
  background: var(--sheet); color: var(--accent); font-size: 14px; font-weight: 600; cursor: pointer; }
.paging__btn:is(:focus-visible) { border-color: var(--accent); background: var(--accent-soft); }
@media (hover: hover) { :where(:root:not(.pointer-still)) .paging__btn:hover { border-color: var(--accent); background: var(--accent-soft); } }
.paging__btn[aria-current="page"] { border-color: var(--accent); background: var(--accent); color: var(--on-accent); }
.paging__gap { display: inline-grid; place-items: center; min-width: 20px; height: 38px; color: var(--muted); }
.notes-list { display: grid; gap: 12px; list-style: none; margin: 16px 0 0; padding: 0; }
.notes-list__item { border: 1.5px solid color-mix(in srgb, var(--accent) 55%, transparent); border-radius: 12px; background: var(--sheet); transition: border-color .15s linear; }
.notes-list__item--edit { border-color: var(--accent); }
.notes-list__text { margin: 0; padding: 12px 14px; font-size: 15px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
.notes-list__field { display: block; width: 100%; min-height: 50px; padding: 12px 14px; border: 0; border-radius: 11px 11px 0 0; background: var(--accent-soft); color: var(--ink); font: 15px/1.5 var(--f-body);
  resize: none; field-sizing: content; outline: none; }
.notes-list__field::placeholder { color: var(--muted); }
.notes-list__foot { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; min-height: 40px; padding: 5px 6px 5px 14px; border-top: 1px solid var(--border); font-size: 12.5px; color: var(--muted); }
.notes-list__date { margin-right: auto; }
.notes-list__ask { margin-right: auto; color: var(--bad-ink); font-weight: 600; }
.notes-list__btn { padding: 4px 10px; border: 1px solid color-mix(in srgb, var(--accent) 55%, transparent); border-radius: 8px; background: none; color: var(--accent); font-size: 12.5px; font-weight: 600; cursor: pointer; }
.notes-list__btn:is(:focus-visible) { border-color: var(--accent); background: var(--accent-soft); }
@media (hover: hover) { :where(:root:not(.pointer-still)) .notes-list__btn:hover { border-color: var(--accent); background: var(--accent-soft); } }
/* «Удалить»: red text without a frame; the frame and fill show on hover */
.notes-list__btn--del { border-color: transparent; color: var(--bad-ink); }
/* the dark-theme red is bright: at rest it is mixed with the muted grey, full on hover */
:root[data-theme="dark"] .notes-list__btn--del:not(:where(:root:not(.pointer-still)) :hover, :focus-visible) { color: color-mix(in srgb, var(--bad) 85%, var(--muted)); }
.notes-list__btn--del:is(:focus-visible) { border-color: var(--bad); background: var(--bad-soft); color: var(--bad-ink); }
@media (hover: hover) { :where(:root:not(.pointer-still)) .notes-list__btn--del:hover { border-color: var(--bad); background: var(--bad-soft); color: var(--bad-ink); } }
.notes-list__btn--confirm { border-color: var(--bad); background: var(--bad); color: var(--sheet); }
.notes-list__btn--confirm:is(:focus-visible) { border-color: var(--bad-ink); background: var(--bad-ink); color: var(--sheet); }
@media (hover: hover) { :where(:root:not(.pointer-still)) .notes-list__btn--confirm:hover { border-color: var(--bad-ink); background: var(--bad-ink); color: var(--sheet); } }
.mistakes__empty { margin-top: 12px; padding: 16px; border: 1.5px dashed color-mix(in srgb, var(--accent) 55%, transparent); border-radius: 10px; color: var(--muted); }

.topic-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; margin-top: 24px; }
.topic-card { display: grid; gap: 6px; align-content: start; padding: 14px 16px; border: 1px solid var(--border); border-radius: 10px; background: var(--sheet); color: var(--ink); text-align: left; cursor: pointer; }
@media (hover: hover) { :where(:root:not(.pointer-still)) .topic-card:hover { border-color: var(--accent); } }
.topic-card__num { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.topic-card__title { font-weight: 600; line-height: 1.3; }
.topic-card__sub { font-family: var(--f-en); font-style: italic; font-size: 14px; color: var(--muted); }
.topic-card__foot { display: flex; align-items: center; gap: 8px; margin-top: 4px; font-size: 12.5px; color: var(--muted); }
.topic-card__bar { flex: 1; }
.topic-card__studied { color: var(--ok); font-size: 13px; font-weight: 600; }
/* a 100% figure next to a progress bar is green like the bar; declared after every value colour so it wins */
.pct--full { color: var(--ok); }

/* Rule */
.rule p { margin: 0; }
.rule p + p { margin-top: 10px; }
.rule h3 { margin: 18px 0 3px; font-size: 20px; font-weight: 700; text-wrap: balance; }
/* a heading sets the gap above it: the block before it drops its bottom margin, so the two never overlap */
.rule.rule > :has(+ h3) { margin-bottom: 0; }
.rule i { font-family: var(--f-en); font-style: normal; }
.rule i b, .examples__en b { font-weight: 600; background: linear-gradient(transparent -10%, var(--hl) 160%); }
.formula { margin: 0 0 14px; padding: 10px 14px; border-radius: 8px; background: var(--accent-soft); font-family: var(--f-en); font-size: 17px; }
.formula b { color: var(--accent); font-weight: 600; }
.rule-table { overflow-x: auto; margin: 0 0 16px; border: 1px solid var(--border); border-radius: 10px; background: var(--sheet); }
.rule :is(p, ul:not(.examples), ol) + .rule-table { margin-top: 10px; } /* the rule text does not run into the table of examples */
.rule-table__table { width: 100%; border-collapse: collapse; font-size: 15px; }
.rule-table__th { padding: 9px 12px; text-align: left; font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); background: var(--well); border-bottom: 1px solid var(--border); white-space: nowrap; }
.rule-table__cell { padding: 8px 12px; vertical-align: top; border-bottom: 1px solid var(--border); }
.rule-table__row:last-child .rule-table__cell { border-bottom: 0; }
.rule-table__th + .rule-table__th, .rule-table__cell + .rule-table__cell { border-left: 1px solid var(--border); }
.examples { list-style: none; margin: 0 0 16px; padding: 0; }
.examples__item { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 16px; padding: 7px 0; border-bottom: 1px dashed var(--border); }
.examples__en { font-family: var(--f-en); font-size: 17px; }
.examples__ru { font-size: 14.5px; color: var(--muted); padding-top: 2px; }
.note { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; margin: 0 0 16px; padding: 12px 14px; border: 1px dashed var(--bad); border-radius: 6px; background: color-mix(in srgb, var(--bad-soft) 45%, var(--sheet)); font-size: 15px; }
:root[data-theme="dark"] .note { background: color-mix(in srgb, var(--bad-soft) 25%, var(--sheet)); }
.note::before { content: "Важно"; font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--bad); align-self: center; }
.markers { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 0 0 16px; }
.markers__label { margin-right: 4px; font-size: 13.5px; color: var(--muted); }
.markers__word { padding: 1px 10px; border: 1px solid var(--border); border-radius: 99px; background: var(--sheet); font-family: var(--f-en); font-size: 14.5px; }

/* «Правило изучено» and «Добавить в избранное» under the rule */
.study { margin-top: 20px; }
.study__btn { display: block; width: 100%; }
.study__btn[aria-pressed="false"] { border: 1.5px solid color-mix(in srgb, var(--accent) 55%, transparent); color: var(--accent); }
@media (hover: hover) { :where(:root:not(.pointer-still)) .study__btn[aria-pressed="false"]:hover { border-color: var(--accent); background: var(--accent-soft); } }
.study__btn[aria-pressed="true"] { border-color: var(--ok); background: var(--ok-soft); color: var(--ok); }
.study__btn + .study__btn { margin-top: 8px; }
.study__btn--bookmark[aria-pressed="true"] { border-color: var(--gold-ink); background: var(--gold-soft); color: var(--gold-ink); }
/* lowered 2px: the label is mostly lowercase, so a ribbon centred on the line box looked high */
.study__icon { margin: 0 6px 0 0; color: inherit; vertical-align: -3px; }
/* «В избранном» on pressing (after a reference clip): the ribbon swings from its top edge like a pendulum and settles,
   while small pluses and dots flash around it */
.bm-pop { position: relative; display: inline-block; margin-right: 6px; }
.bm-pop .study__icon { margin: 0; transform-origin: 50% 0; animation: bm-swing 1.5s ease-in-out both; }
@keyframes bm-swing { 12% { transform: rotate(-6deg); } 28% { transform: rotate(12deg); } 45% { transform: rotate(-9deg); }
  62% { transform: rotate(6deg); } 78% { transform: rotate(-3deg); } 90% { transform: rotate(1deg); } 100% { transform: none; } }
.bm-pop__spark { position: absolute; left: calc(50% + var(--x)); top: calc(50% + var(--y)); width: 5px; height: 5px; margin: -2.5px; opacity: 0;
  background: linear-gradient(currentColor, currentColor) center / 100% 1.5px no-repeat, linear-gradient(currentColor, currentColor) center / 1.5px 100% no-repeat;
  animation: bm-spark .8s var(--d) ease-out both; }
.bm-pop__spark--dot { width: 3px; height: 3px; margin: -1.5px; border-radius: 50%; background: currentColor; }
@keyframes bm-spark { 0% { opacity: 0; transform: scale(0); } 35% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(.5); } }
/* «Правило изучено»: on pressing, the ✓ lands like a slot-machine reel — a column of symbols behind a one-line window, resting on the last one */
/* the window sat at the bottom of the taller line box, 0.18em below the text centre; lifted back */
.slot { position: relative; top: -.18em; display: inline-block; height: 1.25em; line-height: 1.25em; overflow: hidden; vertical-align: bottom; }
.slot__reel { display: block; transform: translateY(calc(-1.25em * var(--last))); }
.slot__reel > span { display: block; height: 1.25em; text-align: center; }
/* the reel runs past the ✓ by .2em, then snaps back in the last .28s (an eased overshoot crawled for half a second) */
.slot--spin .slot__reel { animation: slot-spin 1.4s linear; }
@keyframes slot-spin {
  from { transform: translateY(0); filter: blur(.6px); animation-timing-function: cubic-bezier(.3, .45, .55, 1); }
  80% { transform: translateY(calc(-1.25em * var(--last) - .2em)); filter: none; animation-timing-function: ease-out; }
  to { transform: translateY(calc(-1.25em * var(--last))); }
}

/* ---------- Exercises ---------- */
.ex { margin: 0 0 28px; padding: 20px clamp(14px, 3vw, 26px); border: 1px solid var(--border); border-radius: 12px; background: var(--sheet); scroll-margin-top: 16px; }
/* an exercise opened from «С ошибками» flashes its outline once */
.ex--flash { animation: ex-flash 1.6s ease-out; }
@keyframes ex-flash { 0%, 35% { box-shadow: 0 0 0 3px var(--accent); } 100% { box-shadow: 0 0 0 3px transparent; } }
.ex:last-of-type { margin-bottom: 0; } /* the gap to the pager is set by .pager-current */
.ex__head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin-bottom: 8px; }
.ex__num { font-family: var(--f-display); font-weight: 700; font-size: 14px; color: var(--accent); }
.ex__task { margin: 0; font-weight: 600; }
.ex__items { list-style: none; margin: 0; padding: 0; counter-reset: it; }
.ex__item { counter-increment: it; display: grid; grid-template-columns: 2em minmax(0, 1fr); gap: 4px 6px; padding: 10px 0; border-bottom: 1px dashed var(--border); }
.ex__item:last-child { border-bottom: 0; }
.ex__item::before { content: counter(it) "."; grid-row: 1; padding-top: 6px; font-family: var(--f-mono); font-size: 13px; color: var(--muted); }
.ex__q { grid-column: 2; font-family: var(--f-en); font-size: 18px; line-height: 1.9; overflow-wrap: anywhere; }
.ex__q--ru { font-family: var(--f-body); font-size: 16.5px; line-height: 1.6; padding-top: 3px; }
.ex__text { font-family: var(--f-en); font-size: 18px; line-height: 2.15; overflow-wrap: anywhere; }
.ex__hint { font-family: var(--f-body); font-size: 14px; color: var(--muted); }
/* answer fields: .ex__gap inside a sentence, .ex__tr for a whole translation, .ex__blank shows the chosen option */
.ex__gap { max-width: 100%; margin: 0 3px; padding: 0 4px; border: 0; border-bottom: 2px solid var(--muted); border-radius: 0; background: transparent; color: var(--accent); font: inherit; font-family: var(--f-en); text-align: center; }
.ex__tr { grid-column: 2; width: 100%; padding: 4px 4px; border: 0; border-bottom: 2px solid var(--muted); border-radius: 0; background: transparent; color: var(--accent); font-family: var(--f-en); font-size: 17px; }
.ex__blank { display: inline-block; min-width: 3.5em; margin: 0 3px; padding: 0 4px; border-bottom: 2px solid var(--muted); color: var(--accent); text-align: center; line-height: 1.5; }
.ex__field:focus { outline: none; border-bottom-color: var(--accent); background: var(--accent-soft); }
.ex__field--ok, .ex__field--ok:focus { color: var(--ok); border-bottom-color: var(--ok); }
.ex__field--bad, .ex__field--bad:focus { color: var(--bad); border-bottom-color: var(--bad); }
.ex__field--miss, .ex__field--miss:focus, .ex__blank--miss { border-bottom-color: var(--bad); border-bottom-style: dashed; }
/* the shown answer next to a gap: a green badge, so it reads apart from the hint in brackets and the sentence */
.ex__inline-key { margin-right: 4px; padding: 0 7px 2px; border-radius: 6px; background: var(--ok-soft); font-family: var(--f-en); font-size: 15px; font-weight: 500; color: var(--ok-ink); }
:root[data-theme="light"] .ex__inline-key { background: #C4E8CD; color: #055E19; }
.ex__verdict { margin-left: 8px; font-family: var(--f-body); font-weight: 700; font-size: 16px; }
.ex__verdict--ok { color: var(--ok); }
:root[data-theme="light"] .ex__verdict--ok { color: #0c942c; } /* a brighter green just for the ✓ next to a right answer */
.ex__verdict--bad { color: var(--bad); }
.ex__opts { grid-column: 2; display: flex; flex-wrap: wrap; gap: 6px; }
/* Literata sits low in its line box: the padding moved from top to bottom centres the lowercase letters (same height) */
.ex__opt { padding: 1px 13px 5px; border: 1px solid var(--border); border-radius: 99px; background: var(--well); color: var(--ink); font-family: var(--f-en); font-size: 15.5px; cursor: pointer; }
@media (hover: hover) { :where(:root:not(.pointer-still)) .ex__opt:hover { border-color: var(--accent); } }
.ex__opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.ex__opt--ok, .ex__opt--ok:is([aria-pressed="true"]) { border-color: var(--ok); background: var(--ok-soft); color: var(--ok); }
@media (hover: hover) { :where(:root:not(.pointer-still)) .ex__opt--ok:hover { border-color: var(--ok); background: var(--ok-soft); color: var(--ok); } }
/* light theme: --ok-soft is almost the sheet colour (1.01:1), so a right option gets a slightly greener fill and a deeper green text (5.4:1) */
:root[data-theme="light"] .ex__opt--ok, :root[data-theme="light"] .ex__opt--ok:is([aria-pressed="true"]) { background: #CDEED5; color: #066B1D; }
@media (hover: hover) { :root[data-theme="light"]:where(:root:not(.pointer-still)) .ex__opt--ok:hover { background: #CDEED5; color: #066B1D; } }
.ex__opt--bad, .ex__opt--bad:is([aria-pressed="true"]) { border-color: var(--bad); background: var(--bad-soft); color: var(--bad); }
@media (hover: hover) { :where(:root:not(.pointer-still)) .ex__opt--bad:hover { border-color: var(--bad); background: var(--bad-soft); color: var(--bad); } }
/* the light theme's wrong choice: --bad on --bad-soft was 4.3:1 and the tint nearly the sheet's — a stronger tint, darker text (5.8:1) */
:root[data-theme="light"] .ex__opt--bad, :root[data-theme="light"] .ex__opt--bad:is([aria-pressed="true"]) { background: #F6D0CA; color: #A3001A; }
@media (hover: hover) { :root[data-theme="light"]:where(:root:not(.pointer-still)) .ex__opt--bad:hover { background: #F6D0CA; color: #A3001A; } }
/* «Показать ответы» in a choice exercise: the right option gets the green fill (dashed while it was not the one chosen) */
.ex__opt--key, .ex__opt--key:is([aria-pressed="true"]) { border-color: var(--ok); background: var(--ok-soft); color: var(--ok); }
@media (hover: hover) { :where(:root:not(.pointer-still)) .ex__opt--key:hover { border-color: var(--ok); background: var(--ok-soft); color: var(--ok); } }
:root[data-theme="light"] .ex__opt--key, :root[data-theme="light"] .ex__opt--key:is([aria-pressed="true"]) { background: #CDEED5; color: #066B1D; }
@media (hover: hover) { :root[data-theme="light"]:where(:root:not(.pointer-still)) .ex__opt--key:hover { background: #CDEED5; color: #066B1D; } }
.ex__opt--key:not(.ex__opt--ok) { border-style: dashed; }
/* a shown answer is always green */
.ex__key { grid-column: 2; font-family: var(--f-en); font-style: italic; font-size: 15.5px; font-weight: 500; color: var(--ok-ink); }
.ex__self-ok { grid-column: 2; justify-self: start; padding: 2px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--well); color: var(--muted); font-size: 13px; cursor: pointer; }
@media (hover: hover) { :where(:root:not(.pointer-still)) .ex__self-ok:hover { border-color: var(--ok); color: var(--ok); } }
.ex__foot { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
@media (hover: hover) { :where(:root:not(.pointer-still)) .ex__btn:not(.btn--primary):hover { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); } }
.ex__score { margin-left: auto; font-weight: 600; font-variant-numeric: tabular-nums; }
.ex__score--good { color: var(--ok); }
.ex__score--low { color: var(--bad); }
.ex__redo { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin-top: 14px; padding: 10px 12px; border: 1px dashed var(--border); border-radius: 10px;
  background: color-mix(in srgb, var(--accent) 4%, transparent); transition: border-color .3s, background-color .3s; }
.ex__redo--done { border-style: solid; border-color: color-mix(in srgb, var(--ok) 55%, transparent); background: color-mix(in srgb, var(--ok) 8%, transparent); }
.ex__redo-status { flex-basis: 100%; margin: 0; color: var(--ok); font-size: 14px; font-weight: 600; }
.ex__redo-link { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border: 1.5px solid color-mix(in srgb, var(--accent) 55%, transparent); border-radius: 8px;
  background: var(--sheet); color: var(--accent); font-size: 13px; font-weight: 600; cursor: pointer; }
@media (hover: hover) { :where(:root:not(.pointer-still)) .ex__redo-link:hover { border-color: var(--accent); background: var(--accent-soft); } }
.ex__redo-link--next { margin-left: auto; }
/* the level of the next exercise: a smaller tag, centered on the text line (as an inline box it sat on the baseline, low) */
.ex__redo-text { display: inline-flex; align-items: center; gap: 5px; }
.ex__redo-text .lvl-tag { padding: 0 4px; font-size: 9px; line-height: 1.45; }

/* ---------- Pager ---------- */
.pager-current { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px 8px; margin-top: 20px;
  font-family: var(--f-mono); font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); text-align: center; }
/* the title of the open page in the body font, so it reads as a name rather than a caption */
.pager-current__title { font-family: var(--f-body); font-size: 14px; font-weight: 600; letter-spacing: 0; text-transform: none; color: var(--ink); }
.pager { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 20px; }
.pager__btn { display: grid; gap: 2px; padding: 12px 16px; border: 1.5px solid color-mix(in srgb, var(--accent) 55%, transparent); border-radius: 10px; background: var(--sheet); color: var(--accent); font-weight: 600; text-align: left; cursor: pointer; }
@media (hover: hover) { :where(:root:not(.pointer-still)) .pager__btn:hover { border-color: var(--accent); background: var(--accent-soft); } }
.pager__btn--next { text-align: right; grid-column: 2; }
.pager__label { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; font-family: var(--f-mono); font-size: 11.5px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.pager__btn--next .pager__label { justify-content: flex-end; }
.pager__levels { display: inline-flex; gap: 4px; }
/* «Перейти к теме того же уровня»: a quiet row of two links under the pager */
/* set apart from the main pager by a wider gap and a faint accent tint */
.pager-level { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 12px; margin-top: 24px; padding: 10px 12px 12px; border: 1px dashed var(--border); border-radius: 10px; background: color-mix(in srgb, var(--accent) 4%, transparent); }
.pager-level__label { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px; font-family: var(--f-mono); font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
/* small cards in the style of the main pager buttons: a direction caption over the topic title */
.pager-level__link { display: grid; gap: 1px; padding: 8px 12px; border: 1.5px solid color-mix(in srgb, var(--accent) 55%, transparent); border-radius: 8px;
  background: var(--sheet); color: var(--accent); font-size: 14px; font-weight: 600; line-height: 1.35; text-align: left; cursor: pointer; }
@media (hover: hover) { :where(:root:not(.pointer-still)) .pager-level__link:hover { border-color: var(--accent); background: var(--accent-soft); } }
.pager-level__dir { font-family: var(--f-mono); font-size: 11px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.pager-level__link--prev { grid-column: 1; }
.pager-level__link--next { grid-column: 2; text-align: right; }

/* scroll-to-top: appears once 30% of the page has been scrolled. OFF for now (backlog: it covers the page navigation)
.to-top { position: fixed; z-index: 6; right: 24px; bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); display: grid; place-items: center; width: 54px; height: 54px; padding: 0;
  border: 1.5px solid color-mix(in srgb, var(--accent) 55%, transparent); border-radius: 12px; background: var(--sheet); color: var(--accent); cursor: pointer;
  box-shadow: 0 4px 14px rgba(0, 0, 0, .14); opacity: 0; visibility: hidden; transform: translateY(8px);
  transition: opacity .15s linear, transform .15s linear, visibility .15s linear, background-color .15s linear, border-color .15s linear; }
.to-top--visible { opacity: 1; visibility: visible; transform: none; }
@media (hover: hover) { :where(:root:not(.pointer-still)) .to-top:hover { border-color: var(--accent); background: var(--accent-soft); } } */

@media (max-width: 880px) {
  .side__hide, .float-tools { display: none; }
  /* the top bar starts at the window's edge: the 8px body margin above it showed the page (and the «Информация» spotlight) */
  body { margin-top: 0; }
  /* .to-top { right: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); } — scroll-to-top is off, see above */
  .app { grid-template-columns: minmax(0, 1fr); gap: 0; padding-inline: 0; }

  /* top bar: brand and the Меню / Содержание / Заметки / Инфо / Тема buttons; stays on screen while scrolling */
  .side { position: sticky; top: 0; z-index: 20; max-height: none; overflow: visible; scrollbar-gutter: auto;
    padding: calc(env(safe-area-inset-top, 0px) + 11.5px) 16px 11.5px; background: var(--paper);
    border-radius: 10px 10px 0 0; box-shadow: var(--raise-down); }
  /* the page colour behind the rounded top corners, so the content scrolling under the sticky bar does not show through them */
  .side::before { content: ""; position: absolute; z-index: -1; inset: 0 0 auto; height: 10px; } /* see «top bars' corners» */
  .side__head { align-items: center; flex-wrap: wrap; gap: 8px; }
  .brand__title { font-size: 18px; gap: 6px; }
  .brand__title > span { display: none; } /* only the logo: «Грамматика онлайн» would crowd the buttons */
  .brand__logo { width: 33px; height: 33px; top: 0; } /* centred in the bar like the buttons */
  .brand__row { display: none; }
  /* buttons with the menu's raise, one size at every width up to 880px; the theme is here, so the drawer has no action row */
  /* the buttons start right after the title and keep to the left; only «Тема» goes to the right edge */
  .brand { flex: none; }
  .side__bar { display: flex; flex: 1 1 0; gap: 8px; }
  .side__theme { margin-left: auto; }
  .side__bar .action-btn { min-height: 35px; padding: 4px 10px; gap: 7px; border-radius: 10px; font-size: 13px; box-shadow: var(--raise); }
  .side__bar .action-btn__icon { width: 18px; height: 18px; }
  .side__actions { display: none; }

  /* drawer: progress, bookmarks and the contents (levels, search, chapters) */
  .drawer { display: block; position: fixed; z-index: 30; top: 0; bottom: 0; left: 0; width: min(360px, 88vw); overflow-y: auto; overscroll-behavior: contain;
    padding: calc(env(safe-area-inset-top, 0px) + 12px) 14px calc(env(safe-area-inset-bottom, 0px) + 24px); background: var(--paper); border-right: 1px solid var(--border);
    box-shadow: 10px 0 32px rgba(0, 0, 0, .25); transform: translateX(-105%); visibility: hidden; transition: transform .2s ease, visibility .2s linear; }
  .drawer--open { transform: none; visibility: visible; }
  .drawer__head { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-family: var(--f-display); font-weight: 700; font-size: 17px; }
  /* the close button: the «Меню» button of the top bar (35px high, its icon, border and raise); its width is set from «Меню» in setDrawer */
  .drawer__close { width: 35px; min-height: 35px; padding: 0; box-shadow: var(--raise);
    transition-property: background-color, border-color, color; } /* no width transition: it would grow on every opening */
  .side__summary { margin-top: 12px; }
  /* frosted glass over the page while the drawer is open: the page blurs behind the dimming */
  .drawer-backdrop { display: block; position: fixed; z-index: 25; inset: 0; background: rgba(8, 10, 20, .45); -webkit-backdrop-filter: blur(6px) saturate(1.3); backdrop-filter: blur(6px) saturate(1.3);
    opacity: 0; visibility: hidden; transition: opacity .2s linear, visibility .2s linear; }
  :root:not([data-theme="light"]) .drawer-backdrop { -webkit-backdrop-filter: blur(6px) saturate(1); backdrop-filter: blur(6px) saturate(1); } /* no extra colour in the dark theme */
  .drawer-backdrop--open { opacity: 1; visibility: visible; }
  .search__input { font-size: 16px; } /* 16px+ keeps iOS from zooming in on focus */

  .ex, .notes-tools { scroll-margin-top: 76px; } /* clears the sticky top bar */
  .sheet { padding-inline: 16px; padding-block: 24px 14px; border-inline: 0; border-radius: 0; min-height: 0; }
}
/* «Содержание тренажера» and «Мои заметки» are in the top bar here, so the drawer drops its own; the levels label
   then opens the contents box, without the line that parted it from «Содержание» */
@media (min-width: 650px) and (max-width: 880px) {
  .toc__contents, .side__summary > div:has(> .side__notes) { display: none; }
  .toc__contents + .toc__label { border-top: 0; }
}
/* below 650px the five buttons do not fit: back to the title with an icon-only theme button and «Меню» on the right,
   «Содержание», «Заметки», «Инфо» are in the drawer */
@media (max-width: 649px) {
  .brand { flex: 1; min-width: 0; }
  .brand__title > span { display: inline; }
  .side__bar { flex: none; } /* the title takes the free width, so it stays on one line */
  .side__bar .page-link { display: none; }
  .side__summary > .side__info { display: block; } /* «Инфо» is in the drawer, under «Мои заметки» */
  /* the theme comes first and its auto margin pushes both buttons to the right */
  .side__bar .side__theme { order: -1; width: 35px; padding: 0; }
  .side__theme .theme-toggle__label { display: none; }
  .side__theme .action-btn__icon { width: 16px; height: 16px; }
}
/* below 499px the title goes on two lines, «Грамматика» over «онлайн», at 15px so the two lines (34.5px) are no taller
   than the buttons and the bar keeps its height */
@media (max-width: 498px) {
  .brand__title > span { display: flex; flex-direction: column; align-items: flex-start; font-size: 15px; line-height: 1.15; }
}
/* below 529px the menu takes the whole width of the window */
@media (max-width: 528px) {
  .drawer { width: 100%; border-right: 0; }
}
/* below 360px the title does not fit beside the buttons even on two lines: only the logo stays */
@media (max-width: 359px) {
  .brand__title > span { display: none; }
}
@media (max-width: 560px) {
  .modal__foot .btn { flex: 1 1 0; }
  .sheet__title { font-size: 26px; }
  .sheet__lead { font-size: 17px; }
  .examples__item { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .note { grid-template-columns: minmax(0, 1fr); gap: 6px; }
  .note::before { align-self: start; }
  .info .note::before { text-align: center; }
  .ex { padding: 16px 14px; }
  .ex__q:not(.ex__q--ru), .ex__text { font-size: 17px; }
  /* exercise footer: score on its own line above, the three buttons share one row */
  .ex__foot { gap: 6px; }
  .ex__btn { flex: 1 1 auto; padding: 9px 8px; font-size: 13.5px; white-space: nowrap; }
  .ex__score { order: -1; width: 100%; margin-left: 0; text-align: right; }
  .ex__score:empty { display: none; }
  .ex__redo-link, .mistakes__start { flex: 1 1 100%; justify-content: center; margin-left: 0; }
  .notes-tools__search { flex: 1 1 100%; margin-left: 0; font-size: 16px; } /* 16px+ keeps iOS from zooming in on focus */
  .pager { grid-template-columns: minmax(0, 1fr); }
  .pager__btn--next { grid-column: 1; }
  .pager-level { grid-template-columns: minmax(0, 1fr); }
  .pager-level__link--prev, .pager-level__link--next { grid-column: 1; }
  .contents__bar { width: 80px; }
  .contents--about .contents__row { padding: 8px 12px; }
  /* rule tables become stacked cards: one row per card, column names as labels */
  .rule-table { overflow: visible; border: 0; background: none; }
  .rule-table__table, .rule-table__body, .rule-table__row, .rule-table__cell { display: block; }
  .rule-table__head { display: none; }
  .rule-table__row { margin-bottom: 8px; border: 1px solid var(--border); border-radius: 10px; background: var(--sheet); overflow: hidden; }
  .rule-table__cell { padding: 6px 12px; border: 0; }
  .rule-table__cell + .rule-table__cell { border-left: 0; border-top: 1px dashed var(--border); }

/* the theme buttons (desktop row, floating tools, mobile top bar) are empty in the HTML and filled here from one template:

    + '<span class="theme-toggle__label"></span>';
}
document.querySelectorAll('.theme-toggle').forEach(b => { b.innerHTML = themeToggleHtml(); });
syncThemeBtn();
function syncThemeBtn() {
  const dark = document.documentElement.dataset.theme !== 'light';
  /* the label names the theme the button switches to; the icon-only button in the mobile top bar gets it as aria-label */
  const action = dark ? 'Включить светлую тему' : 'Включить темную тему';
  document.querySelectorAll('.theme-toggle').forEach(b => {
    b.title = action;
    const label = b.querySelector('.theme-toggle__label');

    if (label) label.textContent = b.dataset.label || (dark ? 'Светлая тема' : 'Темная тема');

  });

<script>
/* ================= App ================= */
const LEVELS = { A1: 'Начальный', A2: 'Элементарный', B1: 'Средний', B2: 'Выше среднего', C1: 'Продвинутый', C2: 'Свободное владение' };
const CHAPTERS = window.BOOK.slice().sort((a, b) => a.n - b.n);
const TOPICS = [];
CHAPTERS.forEach(ch => ch.topics.forEach((t, i) => { t.ch = ch; t.num = `${ch.n}.${i + 1}`; TOPICS.push(t); }));
const topicById = Object.fromEntries(TOPICS.map(t => [t.id, t]));
const chapById = Object.fromEntries(CHAPTERS.map(c => ['ch-' + c.id, c]));

const $ = (s, r = document) => r.querySelector(s);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = s => { const sp = el('span'); sp.innerHTML = esc(s).replace(/\(([^)]+)\)/g, '<span class="ex__hint">($1)</span>'); return sp; };

function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function shuffled(arr, seed) { return arr.map((v, i) => ({ v, k: hash(seed + '|' + i + '|' + v) })).sort((a, b) => a.k - b.k).map(o => o.v); }

/* Compare answers ignoring case, punctuation, curly quotes and contractions. */
function norm(s) {
  s = s.toLowerCase().replace(/[’‘`´]/g, "'").replace(/[—–]/g, '-').replace(/[.!?,;:"“”«»]/g, ' ').replace(/\s+-\s+/g, ' ').replace(/\s+/g, ' ').trim();
  s = s.replace(/\bwon't\b/g, 'will not').replace(/\bcan't\b/g, 'cannot').replace(/\bshan't\b/g, 'shall not')
       .replace(/n't\b/g, ' not').replace(/'m\b/g, ' am').replace(/'re\b/g, ' are').replace(/'ll\b/g, ' will').replace(/'ve\b/g, ' have')
       .replace(/\bcan not\b/g, 'cannot');
  return s.replace(/\s+/g, ' ').trim();
}
/* 's and 'd have two meanings each (he's = he is / he has, I'd = I would / I had), so they cannot be folded into one form
   like n't or 'll: both sides are expanded into every reading and match if any reading is shared.
   Only after pronouns and question words — Tom's / my brother's stay possessive. */
const AMBIGUOUS = /\b(i|you|he|she|it|we|they|that|there|here|what|who|where|when|how|let)'(s|d)\b/;
const READINGS = { s: ['is', 'has'], d: ['would', 'had'] };
function readings(s) {
  const m = s.match(AMBIGUOUS);
  if (!m) return [s];
  const [whole, word, c] = m, at = m.index;
  const subs = word === 'let' ? (c === 's' ? ['let us'] : [whole]) : READINGS[c].map(r => `${word} ${r}`);
  return subs.flatMap(sub => readings(s.slice(0, at) + sub + s.slice(at + whole.length)));
}
const accepts = (answers, value) => {
  const mine = readings(norm(value));
  return answers.split('|').some(a => readings(norm(a)).some(r => mine.includes(r)));
};
const firstAnswer = answers => { const a = answers.split('|')[0]; return a === '-' ? '—' : a; };

/* Scoring units: one per gap, one per choice/translation item. */
const gapAnswers = it => Array.isArray(it[1]) ? it[1] : [it[1]];
function units(ex) {
  if (ex.type === 'text') return ex.answers.length;
  if (ex.type === 'gap') return ex.items.reduce((n, it) => n + gapAnswers(it).length, 0);
  return ex.items.length;
}

let progress = store.get('gk2-progress', {});
let studied = store.get('gk2-studied', {});
let bookmarks = store.get('gk2-bookmarks', {}); /* topic id → time it was bookmarked */
let notes = store.get('gk2-notes', []); /* «Мои заметки», see renderNotesPage */
if (!Array.isArray(notes)) notes = [];
let answers = store.get('gk2-answers', {});
let levelFilter = store.get('gk2-level', '');
let route = null;
let viaBookmarks = false; /* the open topic was reached from the «Избранное» list */

/* a share in whole percent; 100 only when everything is done, so 199 of 200 shows 99, not a rounded 100 */
const pctOf = (s, tot) => !tot ? 0 : s >= tot ? 100 : Math.min(99, Math.round(100 * s / tot));
/* a topic's points: one per gap or item of its exercises, plus one for the rule marked as studied —
   so with the rule not studied neither the topic nor its chapter or level reaches 100% */
function topicStats(t) {
  const p = progress[t.id] || {};
  let s = studied[t.id] ? 1 : 0, tot = 1, tried = !!studied[t.id];
  /* min(): a score saved before an exercise lost a gap must not push the topic past 100% */
  t.ex.forEach((ex, i) => { tot += units(ex); if (p[i]) { s += Math.min(p[i][0], units(ex)); tried = true; } });
  return { s, tot, tried, pct: pctOf(s, tot) };
}
function chapterStats(ch, level) {
  let s = 0, tot = 0, tried = false;
  ch.topics.filter(t => !level || t.level === level).forEach(t => { const r = topicStats(t); s += r.s; tot += r.tot; tried = tried || r.tried; });
  return { s, tot, tried, pct: pctOf(s, tot) };
}

/* Book progress: every rule is one point (when marked as studied), every exercise up to one point by the share of right answers
   in its latest check. 100% only with every rule studied and every exercise solved without mistakes. */
function bookProgress() {
  let got = 0, rules = 0, exs = 0;
  TOPICS.forEach(t => {
    rules++; if (studied[t.id]) got++;
    t.ex.forEach((ex, i) => { exs++; const r = progress[t.id] && progress[t.id][i]; if (r) got += r[0] / r[1]; });
  });
  const total = rules + exs;
  return { share: 100 * got / total, pct: Math.floor(100 * got / total), full: got === total, rules, exs, total };
}

/* the progress block, shown in the «Прогресс» drop-down */
function overallBox() {
  let total = 0, perfect = 0;
  TOPICS.forEach(t => t.ex.forEach((ex, i) => {
    total++;
    const r = progress[t.id] && progress[t.id][i];
    if (r && r[0] === r[1]) perfect++;
  }));
  /* «Выполнено» = «Без ошибок» + «С ошибками»: every checked exercise is one or the other */
  const wrong = mistakeCount();
  const book = bookProgress();
  const box = el('div', 'overall');
  box.innerHTML = `<div class="overall__row"><span>Правил изучено</span><b class="overall__value">${TOPICS.filter(t => studied[t.id]).length} из ${TOPICS.length}</b></div>
    <div class="overall__row"><span>Выполнено упражнений</span><b class="overall__value">${perfect + wrong} из ${total}</b></div>
    <div class="overall__row"><span>Без ошибок</span><b class="overall__value">${perfect}</b></div>
    <button class="overall__row overall__mistakes" type="button" data-go="mistakes"${route === 'mistakes' ? ' aria-current="page"' : ''}>
      <span>С ошибками</span><span class="overall__mistakes-end"><b class="overall__value">${wrong}</b>${arrowHtml('next')}</span></button>
    <div class="overall__book">
      <div class="overall__row"><span>Прохождение тренажера</span></div>
      <div class="bar bar--labeled" style="--p:${book.share}%"><i class="bar__fill${book.full ? ' bar__fill--full' : ''}" style="width:${book.share}%"></i><span class="bar__label">${book.pct}%</span><span class="bar__label bar__label--on-fill" aria-hidden="true">${book.pct}%</span></div>
      <p class="overall__note">${foldNote('book')}</p>
    </div>
    <div class="overall__file">
      <div class="overall__row"><span>Резервная копия</span></div>
      <div class="overall__file-btns">
        <button class="overall__file-btn" type="button" data-file="export" title="Сохранить прогресс в файл"${saveLocked() ? ' disabled' : ''}>Сохранить</button>
        <button class="overall__file-btn" type="button" data-file="import" title="Загрузить прогресс из файла">Загрузить</button>
        <button class="overall__file-btn overall__file-btn--wide" type="button" data-file="link" title="Получить ссылку с прогрессом, чтобы отправить ее куда удобно">Отправить ссылкой</button>
      </div>
      <p class="overall__note${fileMsg ? ' overall__note--' + fileMsg[0] : ''}" role="status">${fileMsg ? esc(fileMsg[1]) : foldNote('backup')}</p>
    </div>`;
  return box;
}

/* folded notes in the «Прогресс» block. Folded, the text breaks off after a few words that fade out, with «Показать еще»
   right after them (as in VK posts); open, the whole text with «Скрыть». Open or not is kept only while the page is open
   (re-renders keep it, a reload starts folded). Each note: [shown text, fading words, the rest] */
const FOLD_NOTES = {
  book: ['', 'Учитываются изученные', ' правила и верные ответы в упражнениях. 100% — все изучено и решено без ошибок.'],
  backup: ['Прогресс хранится только в этом браузере. ', 'Сохраните его в файл',
    ' по кнопке «Сохранить» или отправьте ссылкой — «Отправить ссылкой», чтобы перенести прогресс в другой браузер/устройство.'],
};
const notesOpen = {};
function foldNote(key) {
  const [head, fade, tail] = FOLD_NOTES[key], open = !!notesOpen[key];
  const btn = `<button class="overall__more-btn" type="button" data-fold-note="${key}" aria-expanded="${open}">${open ? 'Скрыть' : 'Показать еще'}</button>`;
  /* folded: the fading words and the button wrap together, so the button always stands right after them */
  return head + (open ? `${fade}${tail} ${btn}` : `<span class="overall__fade-row"><span class="overall__fade">${fade}</span> ${btn}</span>`);
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-fold-note]');
  if (!b) return;
  const key = b.dataset.foldNote, note = b.closest('.overall__note');
  notesOpen[key] = !notesOpen[key];
  note.innerHTML = foldNote(key);
  $('[data-fold-note]', note).focus();
});

/* the «Прогресс» button: the book progress bar and percentage, the number of exercises with mistakes */
function renderOverall() {
  const book = bookProgress(), wrong = mistakeCount();
  const b = $('#progBtn');
  b.innerHTML = `<span>Прогресс</span><span class="bar bar--thin side__stat-bar" aria-hidden="true">${barFill(book.full ? 100 : Math.min(book.share, 99))}</span>` +
    `<b class="side__stat-pct">${book.pct}%</b>` + (wrong ? `<span class="side__badge" title="С ошибками: ${wrong}">${wrong}</span>` : '') + FOLD_ARROW;
  b.setAttribute('aria-label', `Прогресс: тренажер пройден на ${book.pct}%` + (wrong ? `, с ошибками ${wrong}` : ''));
  renderFold('prog');
}

/* order of «Работа над ошибками»: by level A1 → C2, within a level by topic number, then by exercise */
const mistakeOrder = (t, i = 0) => Object.keys(LEVELS).indexOf(t.level) * 1e6 + TOPICS.indexOf(t) * 1000 + i;

/* exercises whose latest check is below the full score (errors or blank answers), in mistakeOrder;
   «Заново» drops the check, so the exercise leaves the list until it is checked again */
function mistakes() {
  const out = [];
  TOPICS.forEach(t => {
    const exs = t.ex.map((ex, i) => [i, progress[t.id] && progress[t.id][i]]).filter(([, r]) => r && r[0] < r[1]);
    if (exs.length) out.push({ t, exs });
  });
  return out.sort((a, b) => mistakeOrder(a.t) - mistakeOrder(b.t));
}
const mistakeCount = () => mistakes().reduce((n, m) => n + m.exs.length, 0);

/* the level filter of «Работа над ошибками»: its own, not the sidebar one (that one follows every opened topic);
   a saved level with no mistakes left falls back to «Все» */
let mistakesLevel = store.get('gk2-mistakes-level', '');
let mistakesPage = 0; /* the open page of the list, only while the site is open */
function mistakesFilter() {
  return mistakesLevel && mistakes().some(m => m.t.level === mistakesLevel) ? mistakesLevel : '';
}

/* the exercise after (topic, ei) in «С ошибками» within the page's level filter, wrapping round to the start; null when it is the only one */
function nextMistake(topic, ei) {
  const cur = mistakeOrder(topic, ei);
  const level = mistakesFilter();
  const all = mistakes().filter(m => !level || m.t.level === level).flatMap(({ t, exs }) => exs.map(([i]) => ({ t, i, at: mistakeOrder(t, i) }))).filter(m => m.at !== cur);
  return all.find(m => m.at > cur) || all[0] || null;
}

/* the exercise opened from «Работа над ошибками» gets a bar back to the list and on to the next one */
let mistakeFocus = null, pendingFocus = null;

/* open a topic and bring one of its exercises into view */
function openExercise(topicId, ei) {
  pendingFocus = { t: topicId, ei };
  go(topicId);
  const box = document.querySelectorAll('#main .ex')[ei];
  if (!box) return;
  /* a jump, not a smooth scroll: a new page opens anyway, and the flash shows where to look */
  box.scrollIntoView({ block: 'start' });
  box.classList.remove('ex--flash'); void box.offsetWidth; box.classList.add('ex--flash');
}

/* ---------- Sidebar ---------- */
/* progress for the selected level filter: points scored / all points; hidden for «Все» (the .overall block covers it) */
function renderLevelProgress() {
  const box = $('#lvlProg');
  box.hidden = !levelFilter;
  if (!levelFilter) return;
  const topics = TOPICS.filter(t => t.level === levelFilter);
  let s = 0, tot = 0;
  topics.forEach(t => { const r = topicStats(t); s += r.s; tot += r.tot; });
  const pct = pctOf(s, tot);
  box.innerHTML = `<div class="lvl-prog__row"><span>Уровень <span class="lvl-tag lvl-tag--sm" title="${LEVELS[levelFilter]}">${levelFilter}</span> пройден на</span>${pctLabel(pct, 'lvl-prog__value')}</div>
    <div class="bar bar--thin">${barFill(pct)}</div>`;
}

function renderLevels() {
  const box = $('#levelChips'); box.innerHTML = '';
  [['', 'Все'], ...Object.keys(LEVELS).map(l => [l, l])].forEach(([v, label]) => {
    const b = el('button', 'level-chip', label); b.type = 'button';
    b.setAttribute('aria-pressed', String(levelFilter === v));
    b.dataset.level = v;
    b.addEventListener('click', () => { levelFilter = v; store.set('gk2-level', v); renderLevels(); renderToc(); });
    box.append(b);
  });
  fillLevelChips();
}

/* each chip fills with green from the bottom up to the share of its level's points scored (for «Все» — the whole book);
   at 100% (every rule studied and every exercise of every topic scored in full) it also gets --done */
function fillLevelChips() {
  document.querySelectorAll('#levelChips .level-chip').forEach(b => {
    const level = b.dataset.level;
    let s = 0, tot = 0;
    TOPICS.filter(t => !level || t.level === level).forEach(t => { const r = topicStats(t); s += r.s; tot += r.tot; });
    const pct = tot ? 100 * s / tot : 0;
    if (level) b.style.setProperty('--lvl', pct + '%'); /* «Все» shows no liquid */
    b.classList.toggle('level-chip--done', tot > 0 && s === tot);
    b.title = `${level ? LEVELS[level] : 'Весь тренажер'} · пройдено ${pctOf(s, tot)}%`;
  });
}

/* Accordion: one chapter open at a time (saved in gk2-open-chap); a search opens every match. */
let openChap = store.get('gk2-open-chap', null);
let justToggled = null;
function setOpenChap(id) { openChap = id; store.set('gk2-open-chap', id); }

/* sparks around the «В избранном» ribbon: offset from its centre (px), delay (s), a dot instead of a plus */
/* the text starts 6px to the right, so the right-hand sparks sit only above and below it */
const BM_SPARKS = [[-13, -9, .15, 0], [8, -13, .25, 1], [-12, 8, .35, 1], [1, -15, .45, 1], [-16, -1, .55, 0], [7, 14, .65, 0], [-5, 15, .7, 1]];
/* the symbols on the «Правило изучено» reel; it stops on the last one */
const SLOT_REEL = ['★', '✗', '?', '♦', '✓', '•', '✗', '★', '?', '✓'];
/* an arrow that nudges the way it points while its button is hovered (see .arrow) */
const arrowHtml = (dir, cls = '') => `<span class="arrow arrow--${dir}${cls ? ' ' + cls : ''}" aria-hidden="true">${dir === 'prev' ? '←' : '→'}</span>`;
/* a progress pill: at 100% a green outline, below that a fill coloured by range; cls mixes in an element class of the parent */
const pill = (pct, cls = '') => `<span class="pill pill--${pct >= 100 ? 'good' : pct > 60 ? 'high' : pct > 30 ? 'mid' : 'low'}${cls ? ' ' + cls : ''}" style="--p:${pct}%">${pct}%</span>`;
/* the fill of a progress bar; at 100% it turns green */
const barFill = pct => `<i class="bar__fill${pct >= 100 ? ' bar__fill--full' : ''}" style="width:${pct}%"></i>`;
/* the percentage next to a bar; at 100% it turns green */
const pctLabel = (pct, cls = '', tag = 'b') => `<${tag} class="pct${pct >= 100 ? ' pct--full' : ''}${cls ? ' ' + cls : ''}">${pct}%</${tag}>`;

function setChapOpen(box, open) {
  box.classList.toggle('chap--open', open);
  box.querySelector('.chap__btn').setAttribute('aria-expanded', String(open));
  box.querySelector('.chap__body').inert = !open;
}

/* a hover needs a real mouse move: a re-render or a scroll puts new items under a resting cursor, and the browser lit them up
   as if hovered. While <html> has .pointer-still the hover rules are off (they are gated by :where(:root:not(.pointer-still)));
   it is set at load and on every contents re-render and cleared by the first mouse move. Touch never clears it */
let pointerAt = '';
function holdHover() { document.documentElement.classList.add('pointer-still'); }
document.addEventListener('pointermove', e => {
  if (e.pointerType !== 'mouse') return;
  const at = e.clientX + ',' + e.clientY;
  if (at === pointerAt) return; /* the browser's own move after a layout change, with the same coordinates */
  pointerAt = at;
  document.documentElement.classList.remove('pointer-still');
});

function renderToc() {
  holdHover();
  const q = $('#search').value.trim().toLowerCase();
  const filtering = !!(q || levelFilter);
  if (isAbout(route)) $('#infoBtn').setAttribute('aria-current', 'page'); else $('#infoBtn').removeAttribute('aria-current');
  if (route === 'contents') $('#tocContents').setAttribute('aria-current', 'page'); else $('#tocContents').removeAttribute('aria-current');
  document.querySelectorAll('.page-link').forEach(b => b.toggleAttribute('aria-current', b.dataset.go === 'about' ? isAbout(route) : route === b.dataset.go));
  renderLevelProgress();
  fillLevelChips();
  const list = $('#tocList'); list.innerHTML = '';
  let shown = 0;
  CHAPTERS.forEach(ch => {
    const match = ch.topics.filter(t => (!levelFilter || t.level === levelFilter) &&
      (!q || (t.title + ' ' + t.sub + ' ' + ch.title).toLowerCase().includes(q)));
    if (filtering && !match.length) return;
    const open = q ? true : ch.id === openChap;
    /* a chapter opened by navigation renders closed first, then expands on the next frame */
    const animateIn = open && justToggled === ch.id;
    /* the chapter of the open page (the chapter itself or one of its topics); a topic opened from «Избранное» marks only that list */
    const current = !viaBookmarks && (route === 'ch-' + ch.id || (topicById[route] && topicById[route].ch === ch));
    const box = el('div', current ? 'chap chap--current' : 'chap');
    const cb = el('button', 'chap__btn'); cb.type = 'button';
    if (current) cb.setAttribute('aria-current', 'location');
    /* the pill counts only the selected level and appears once a topic of that level has been started
       (started only at another level, it showed a confusing 0%) */
    const cs = chapterStats(ch, levelFilter);
    const lv = [...new Set(ch.topics.map(t => t.level))].sort();
    cb.innerHTML = `<span class="chap__num">${ch.n}</span><span>${esc(ch.title)}<small class="chap__meta">${ch.topics.length} ${plural(ch.topics.length, 'тема', 'темы', 'тем')}</small>` +
      `<span class="chap__levels" aria-label="Уровни">${lv.map(l => `<span class="lvl-tag lvl-tag--sm" title="${LEVELS[l]}">${l}</span>`).join('')}</span></span>` +
      `<span class="chap__end">${cs.tried ? pill(cs.pct) : ''}` +
      '<span class="chap__arrow" aria-hidden="true"><svg class="chap__arrow-icon" viewBox="0 0 12 12" width="12" height="12"><path d="M4 2.5 7.5 6 4 9.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span></span>';
    /* the chapter title only expands and collapses it; the chapter page opens from «Обзор всего раздела» inside */
    cb.addEventListener('click', () => {
      if (box.classList.contains('chap--open')) { setChapOpen(box, false); if (!q) setOpenChap(null); }
      else if (q) setChapOpen(box, true);
      else { justToggled = ch.id; setOpenChap(ch.id); renderToc(); }
    });
    box.append(cb);
    if (levelFilter && !q && match.length < ch.topics.length) {
      const note = el('small', 'chap__meta', `${match.length} из ${ch.topics.length} ${plural(ch.topics.length, 'темы', 'тем', 'тем')} уровня ${levelFilter}`);
      cb.querySelector('.chap__meta').after(note);
    }
    /* body is always rendered so it can animate open and closed */
    const body = el('div', 'chap__body');
    const clip = el('div', 'chap__clip');
    const sub = el('div', 'chap__topics');
    const ov = el('button', 'topic-btn topic-btn--overview chap__topic'); ov.type = 'button';
    ov.innerHTML = `<span>Обзор всего раздела</span>${arrowHtml('next', 'topic-btn__arrow')}`;
    if (route === 'ch-' + ch.id) ov.setAttribute('aria-current', 'page');
    ov.addEventListener('click', () => go('ch-' + ch.id));
    sub.append(ov);
    (filtering ? match : ch.topics).forEach(t => { const b = topicButton(t); b.classList.add('chap__topic'); sub.append(b); });
    clip.append(sub); body.append(clip); box.append(body);
    setChapOpen(box, open && !animateIn);
    if (animateIn) requestAnimationFrame(() => requestAnimationFrame(() => setChapOpen(box, true)));
    shown++;
    list.append(box);
  });
  justToggled = null;
  $('#tocToggle .toc__label').textContent = levelFilter ? `Разделы уровня ${levelFilter}` : 'Разделы тренажера';
  $('#tocCount').textContent = shown || '';
  syncTocFold();
  if (!shown) list.innerHTML = '<p class="toc__empty">Ничего не нашлось. Попробуйте «past», «артикль» или снимите фильтр уровня.</p>';
  renderBookmarks();
  renderNotes();
}

/* the bookmark ribbon; cls mixes in the element class of the place it sits in */
const bmIcon = (cls = '') => `<svg class="bm-icon${cls ? ' ' + cls : ''}" viewBox="0 0 11 14" aria-hidden="true"><path d="M1 1.5A1 1 0 0 1 2 .5h7a1 1 0 0 1 1 1V13L5.5 10 1 13z" fill="currentColor"/></svg>`;

function topicButton(t, fromBookmarks = false) {
  const b = el('button', fromBookmarks ? 'topic-btn bookmarks__topic' : 'topic-btn'); b.type = 'button';
  /* the open topic is highlighted only in the list it was opened from: «Избранное» or the contents list */
  if (t.id === route && fromBookmarks === viaBookmarks) b.setAttribute('aria-current', 'page');
  const st = topicStats(t);
  b.innerHTML = `<span>${esc(t.title)}${bookmarks[t.id] ? bmIcon('topic-btn__bm') : ''}<small class="topic-btn__meta">${t.num} · ${t.level}${studied[t.id] ? ' · <span class="topic-btn__studied">правило ✓</span>' : ''}</small></span>` +
    (st.tried ? pill(st.pct, 'topic-btn__pill') : '');
  if (bookmarks[t.id]) b.title = 'В избранном';
  b.addEventListener('click', () => go(t.id, true, true, fromBookmarks));
  return b;
}

/* «Избранное»: the bookmarked topics in book order, regardless of the menu's level filter and search;
   its own level chips (only levels that have bookmarks, gk2-bm-level) narrow the list. It turns gold while the open topic was reached from this list. */
let bmLevel = store.get('gk2-bm-level', '');
function bookmarksBox() {
  const marked = TOPICS.filter(t => bookmarks[t.id]);
  const levels = Object.keys(LEVELS).filter(l => marked.some(t => t.level === l));
  const level = levels.includes(bmLevel) ? bmLevel : '';
  const box = el('section', 'bookmarks' + (viaBookmarks && bookmarks[route] ? ' bookmarks--active' : ''));
  box.setAttribute('aria-label', 'Избранное');
  if (levels.length > 1) {
    const bar = el('div', 'bookmarks__levels'); bar.setAttribute('role', 'group'); bar.setAttribute('aria-label', 'Уровень сложности');
    ['', ...levels].forEach(l => {
      const n = l ? marked.filter(t => t.level === l).length : marked.length;
      const b = el('button', 'bookmarks__level', l || 'Все'); b.type = 'button';
      b.title = `${l ? LEVELS[l] : 'Все уровни'} · ${n} ${plural(n, 'тема', 'темы', 'тем')}`;
      b.setAttribute('aria-pressed', String(l === level));
      b.addEventListener('click', () => { bmLevel = l; store.set('gk2-bm-level', l); renderFold('bm'); });
      bar.append(b);
    });
    box.append(bar);
  }
  const list = el('div', 'bookmarks__list');
  marked.filter(t => !level || t.level === level).forEach(t => list.append(topicButton(t, true)));
  if (!marked.length) list.innerHTML = '<p class="bookmarks__empty">Пока пусто. Отметьте тему кнопкой «Добавить в избранное» на ее странице.</p>';
  box.append(list);
  return box;
}
/* the «Избранное» button: the ribbon and the count; gold while the open topic came from the list */
function renderBookmarks() {
  const n = TOPICS.filter(t => bookmarks[t.id]).length;
  const b = $('#bmBtn');
  b.innerHTML = `${bmIcon()}<span>Избранное</span><b class="side__count">${n || ''}</b>` + FOLD_ARROW;
  b.setAttribute('aria-label', `Избранное: ${n}`);
  b.classList.toggle('side__bm--active', viaBookmarks && !!bookmarks[route]);
  renderFold('bm');
}

/* «Мои заметки»: free notes, not tied to topics — [{ id, text, c: created, at: last edit }], newest first;
   kept in gk2-notes, so they go into backups and links */
const notesIcon = (cls = '') => `<svg class="notes-icon${cls ? ' ' + cls : ''}" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10.8 2.7a1.5 1.5 0 0 1 2.1 2.1L5.6 12.1 2.5 13l.9-3.1z"/><path d="M9.6 3.9l2.1 2.1"/></svg>`;
const noteDate = at => new Date(at).toLocaleString('ru-RU', { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' });
/* the menu button only leads to the page: the count and an arrow, highlighted while the page is open */
function renderNotes() {
  const b = $('#notesBtn');
  b.innerHTML = `${notesIcon()}<span>Мои заметки</span><b class="side__count">${notes.length || ''}</b>` + FOLD_ARROW;
  b.setAttribute('aria-label', `Мои заметки: ${notes.length}`);
  if (route === 'notes') b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  document.querySelectorAll('.page-link[data-go="notes"]').forEach(h => {
    h.innerHTML = `${notesIcon('action-btn__icon')}<span>${h.dataset.label}</span><b class="page-link__count">${notes.length || ''}</b>`;
    h.setAttribute('aria-label', `Мои заметки: ${notes.length}`);
  });
}
const NOTE_FOLD = 255; /* a longer note is folded on its page */
const NOTES_PAGE = 7; /* notes per page of «Мои заметки» */
const MISTAKES_PAGE = 7; /* topics per page of «Работа над ошибками» */
/* page numbers in `nav` (hidden with a single page); `pick(k)` opens page k. The arrows only where there is somewhere to go;
   with many pages: the first, the last, the current with its neighbours and «…» for the gaps (1 … 4 5 6 … 100),
   near an edge five in a row (1 2 3 4 5 … 100) */
function fillPaging(nav, page, count, pick) {
  nav.replaceChildren();
  nav.hidden = count < 2;
  if (count < 2) return;
  const pageBtn = (k, html, label) => {
    const b = el('button', 'paging__btn'); b.type = 'button'; b.innerHTML = html;
    if (label) b.setAttribute('aria-label', label);
    if (k === page && !label) b.setAttribute('aria-current', 'page');
    b.addEventListener('click', () => pick(k));
    nav.append(b);
  };
  if (page > 0) pageBtn(page - 1, arrowHtml('prev'), 'Предыдущая страница');
  const nums = new Set(count <= 7 ? [...Array(count).keys()] : [0, count - 1, page - 1, page, page + 1]);
  if (count > 7 && page <= 3) [1, 2, 3, 4].forEach(k => nums.add(k));
  if (count > 7 && page >= count - 4) [2, 3, 4, 5].forEach(k => nums.add(count - k));
  let prev = -1;
  [...nums].filter(k => k >= 0 && k < count).sort((x, y) => x - y).forEach(k => {
    if (k - prev === 2) pageBtn(prev + 1, String(prev + 2)); /* a gap of one page shows that page, not «…» */
    else if (k - prev > 2) nav.append(el('span', 'paging__gap', '…'));
    pageBtn(k, String(k + 1)); prev = k;
  });
  if (page < count - 1) pageBtn(page + 1, arrowHtml('next'), 'Следующая страница');
}
const saveNotes = () => { store.set('gk2-notes', notes); renderNotes(); };

/* ---------- Backup: everything the app keeps in localStorage (gk2-*) as one JSON file ---------- */
/* fileMsg: the last result shown under the buttons, [kind, text]; kept here because the block is re-rendered */
const BACKUP_APP = 'grammar-online';
/* a success message goes away after 15 seconds; another save within that time just updates it and starts the 15 seconds again */
let fileMsg = null, fileMsgTimer;
function showFileMsg(kind, text) {
  fileMsg = [kind, text];

  /* «ошибки в № 3, 5, 7», «не заполнены № 8–10»; in a text exercise the items are gaps */
  const gaps = t.ex[i].type === 'text';
  const [w, b] = m, parts = [];
  if (w.length) parts.push(`<span class="mistakes__score">${w.length > 1 ? 'ошибки' : 'ошибка'} в ${gaps ? (w.length > 1 ? 'пропусках ' : 'пропуске ') : '№ '}${numList(w)}</span>`);

  { id: 'sections', title: 'Разделы и темы', sub: 'Как устроены страницы разделов и тем', body: () => `
      <p>Тренажер разбит по разделам, а каждый раздел в свою очередь по темам. Внутри темы сначала приводится правило с примерами, а затем упражнения для закрепления этого правила.</p>

  { id: 'exercises', title: 'Упражнения и проверка', sub: 'Как проверяются ответы', body: () => `
      <h3>Проверка</h3>
      <p>Кнопка «Проверить» активируется, как только вы введете хотя бы один ответ. Неверные ответы выделяются красным цветом, а также незаполненные поля.</p>

  { id: 'mistakes', title: 'Работа над ошибками', sub: 'Как быстро вернуться к упражнениям с ошибками', body: () => `

      <p>На странице собраны упражнения, в которых при последней проверке были выявлены ошибки или остались незаполненные упражнения. Если таких упражнений нет, на странице отобразится надпись: «Сейчас таких упражнений нет».</p>

  { id: 'bookmarks', title: 'Избранное и заметки', sub: 'Информация, к которой хочется вернуться', body: () => `

const aboutPage = id => ABOUT.find(p => 'about-' + p.id === id);
const isAbout = id => id === 'about' || !!aboutPage(id);

const ABOUT_FOLD = 347, FADE_WORDS = 3, aboutNarrow = matchMedia('(max-width: 998px)');
let aboutOpen = false; /* kept only while the page is open */
aboutNarrow.addEventListener('change', () => { if (route === 'about') go('about', false, false); });
function renderAboutPage(wrap) {
  wrap.append(el('h1', 'sheet__title', 'Информация'));
  const mail = el('a', 'sheet__link', 'pegasusgamesru@gmail.com');
  mail.href = 'mailto:pegasusgamesru@gmail.com';
  const contact = el('p', 'sheet__intro sheet__intro--contact', 'Если у вас есть замечания или пожелания, можете направить их на почту: ');
  contact.append(mail);
  /* static text with <b> marks, so innerHTML is safe here */
  const para = html => { const p = el('p', 'sheet__intro'); p.innerHTML = html; return p; };
  const paras = [
    '«Грамматика онлайн» — некоммерческий и независимый проект. Идея его создания появилась во время занятий по книге Ю. Б. Голицынского «Грамматика. Сборник упражнений».',
    'Работать с бумажным сборником не всегда удобно: ответы нужно сверять вручную, из-за чего легко пропустить ошибку, да и сам учебник не самый мобильный предмет. Хотелось сразу видеть, где допущена ошибка, и в любой момент быстро возвращаться к сложной/интересной теме. Поиски бесплатных тренажеров со схожим подходом не привели к удовлетворительному результату (возможно, я плохо искал), поэтому и возникла идея создать его самостоятельно.',
    'За основу взята <b>только структура сборника</b>: разделы и темы расположены в той же последовательности. При этом все правила, примеры и упражнения написаны заново и <b>не дублируют текст книги</b>, а также добавлен дополнительный раздел (№19). Тренажер не является электронной версией какого-либо издания книги — это самостоятельная разработка, созданная по ее мотивам.',
    'В тренажере нет регистрации, платных разделов или ограничений по функционалу — весь функционал доступен сразу, без каких-либо условий. Если тренажер вам понравился, вы можете выразить благодарность автору, нажав кнопку <b class="sheet__donate">«Поддержать автора»</b> внизу меню.'];
  /* below 999px the text is folded after ABOUT_FOLD characters, like a long note */
  const intro = el('div', 'info-intro');
  const fill = () => {
    const ps = paras.map(para);
    const more = el('button', 'overall__more-btn', aboutOpen ? 'Скрыть' : 'Показать еще'); more.type = 'button';
    more.setAttribute('aria-expanded', String(aboutOpen));
    more.addEventListener('click', () => { aboutOpen = !aboutOpen; fill(); $('.overall__more-btn', intro).focus({ preventScroll: aboutOpen }); });
    if (!aboutNarrow.matches) { intro.replaceChildren(...ps); return; }
    if (aboutOpen) { ps.at(-1).append(' ', more); intro.replaceChildren(...ps); return; }
    let left = ABOUT_FOLD;
    const shown = [];
    for (const p of ps) {
      shown.push(p);
      if (p.textContent.length < left) { left -= p.textContent.length; continue; }
      /* the text up to the limit, broken at a word; its last FADE_WORDS words fade out before the button («Хотелось сразу видеть,») */
      const full = p.textContent, head = full.slice(0, left).replace(/\s+\S*$/, '');
      const words = head.split(/(\s+)/), k = Math.max(0, words.length - 2 * FADE_WORDS + 1);
      const plain = words.slice(0, k).join(''), fade = words.slice(k).join('');
      fadeTokens = words.slice(k);
      restTokens = full.slice(head.length).split(/(\s+)/).filter(Boolean);
      const row = el('span', 'overall__fade-row');
      row.append(el('span', 'overall__fade', fade), ' ', more);
      p.replaceChildren(plain, row); break;
    }
    intro.replaceChildren(...shown);
    fitFade();
  };
  /* the fading words and the hidden text after them, in words and spaces */
  let fadeTokens = [], restTokens = [];
  /* only the words on the button's line fade: those the line break left on the line above stay plain text;
     with fewer than FADE_WORDS on the button's line, the next words of the hidden text join it */
  const fitFade = () => {
    const fade = $('.overall__fade', intro);
    if (!fade || !intro.isConnected) return;
    const row = fade.parentNode, btn = $('.overall__more-btn', row);
    const tokens = fadeTokens.slice();
    let words, i, extra = 0;
    const lay = () => {
      while (row.firstChild !== btn) row.firstChild.remove(); /* the button stays in place, so it keeps the focus */
      words = tokens.map(w => el('span', '', w));
      btn.before(...words, ' ');
      const r = btn.getBoundingClientRect(), y = (r.top + r.bottom) / 2;
      i = words.findIndex(w => { const q = w.getBoundingClientRect(); return q.top <= y && q.bottom >= y; });
      if (i < 0) i = words.length;
    };
    const onLine = () => words.slice(i).filter(w => /\S/.test(w.textContent)).length;
    lay();
    /* on a narrow line the button may keep wrapping away: at most six words join, and the try with most words by the button wins */
    let best = [onLine(), 0];
    while (best[0] < FADE_WORDS && extra < Math.min(restTokens.length, 12)) {
      tokens.push(...restTokens.slice(extra, extra + 2)); extra += 2; /* a space and a word */
      lay();
      if (onLine() > best[0]) best = [onLine(), extra];
    }
    if (extra !== best[1]) { tokens.length = fadeTokens.length + best[1]; lay(); }
    const text = ws => ws.map(w => w.textContent).join('');
    words.forEach(w => w.remove());
    btn.previousSibling.before(text(words.slice(0, i)), el('span', 'overall__fade', text(words.slice(i))));
  };
  new ResizeObserver(fitFade).observe(intro);
  fill();
  wrap.append(intro, el('div', 'sheet__section sheet__section--about', 'Как устроен тренажер'));
  const ol = el('ol', 'contents contents--about');
  ABOUT.forEach((p, i) => {
    const li = el('li', 'contents__item'); const b = el('button', 'contents__row'); b.type = 'button';
    b.innerHTML = `<span class="contents__num">${i + 1}</span><span class="contents__title">${esc(p.title)}</span><span class="contents__meta">${esc(p.sub)}</span>`;
    b.addEventListener('click', () => go('about-' + p.id));
    li.append(b); ol.append(li);
  });
  wrap.append(ol, contact);
}
